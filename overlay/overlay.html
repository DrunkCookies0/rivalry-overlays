// Unified pip row, RLCS-style: bestOf pips total, blue wins fill from the
// LEFT, red wins fill from the RIGHT, neutral/gold marker on the GEOMETRIC
// CENTER pip representing the active game. Pinned to center so the marker
// never drifts as wins accumulate; hidden when the series is decided or
// when a claimed pip covers the center slot.
function renderPips(){
  const total = Math.max(1, control.bestOf | 0);
  // For odd bestOf (BO3/5/7), threshold = (N+1)/2. For even (shouldn't
  // happen in RL but defensive), require strict majority.
  const oddThresh = Math.ceil((total + 1) / 2);
  // Cap each team's wins at the threshold so an out-of-spec score from the
  // control bus can't push one cluster into the other's pips. If a team has
  // already clinched the series, the other team's render-side wins are
  // additionally clamped to (total - oddThresh) so the loser's cluster
  // can't overlap the winner's claimed pips.
  let blueWins = Math.min(Math.max(0, control.series.a | 0), oddThresh);
  let redWins  = Math.min(Math.max(0, control.series.b | 0), oddThresh);
  if (blueWins >= oddThresh) redWins  = Math.min(redWins,  total - oddThresh);
  if (redWins  >= oddThresh) blueWins = Math.min(blueWins, total - oddThresh);
  const seriesDecided = blueWins >= oddThresh || redWins >= oddThresh;

  // Active-game pip is always the geometric center. Hidden when:
  //   - series is decided (no more games to play)
  //   - center pip is already claimed by either team
  const centerIdx = Math.floor(total / 2);
  const centerClaimed = centerIdx < blueWins || centerIdx >= total - redWins;
  const currentPip = (!seriesDecided && !centerClaimed) ? centerIdx : -1;

  const el = $("pips");
  el.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const d = document.createElement("div");
    let cls = "seg";
    if (i < blueWins) {
      cls += " on blue";
      if (seriesDecided && blueWins >= oddThresh) cls += " win";
    } else if (i >= total - redWins) {
      cls += " on red";
      if (seriesDecided && redWins >= oddThresh) cls += " win";
    } else if (i === currentPip) {
      cls += " current";
    }
    d.className = cls;
    el.appendChild(d);
  }
}

function fmtClock(sec, isOT){
  sec = Math.max(0, Math.round(sec || 0));
  const m = Math.floor(sec/60), s = sec%60;
  const t = (isOT ? "+" : "") + m + ":" + String(s).padStart(2,"0");
  return t;
}

// Find the currently spectated player across the field shapes the API may use.
// RL's Stats API sends Game.Target as an OBJECT ({Name, Shortcut, TeamNum})
// when bHasTarget is true. Older API revisions also showed it as a bare
// string. We accept either and pull the player name out.
function getTargetName(data){
  const g = data.Game || {};
  const candidates = [
    data.Target, g.Target, data.Spectated,
    data.Spectator, g.Spectator,
  ];
  for (const t of candidates) {
    if (!t) continue;
    if (typeof t === "string") return t;
    if (typeof t === "object") return t.Name || t.PlayerName || null;
  }
  return null;
}

// Sticky focus: RL's Stats API only includes Game.Target in some frames
// during director cam (~63% of frames). Without persistence the statbar +
// radial gauge flicker on/off every other frame. We hold the last known
// target for FOCUS_STICKY_MS so the UI feels solid; in that window we
// re-look-up the player by name in the current Players array so live
// stats (boost, goals) still update.
const FOCUS_STICKY_MS = 500;
let lastFocusName = null;
let lastFocusTime = 0;

// Boost cache: RL only re-sends a player's Boost field when it changes. If
// we showed "--" on any frame missing the field, the side rails would
// flicker. Cache the last value per name; we only show "--" if we've never
// seen a real value for that player.
const lastBoostByName = {};

function onUpdateState(data){
  const game = data.Game || {};
  const teams = game.Teams || [];
  if (teams[0]) { lastScoreA = teams[0].Score ?? 0; $("scoreA").textContent = lastScoreA; }
  if (teams[1]) { lastScoreB = teams[1].Score ?? 0; $("scoreB").textContent = lastScoreB; }
  // Hybrid OT detector. Fast path is RL's explicit Game.IsOT — that's the
  // truth when it's set. But in bot/private/freeplay matches RL never sets it,
  // so we infer OT from a clock-direction breadcrumb: once the regulation
  // clock has touched 0, count consecutive frames where TimeSeconds is going
  // UP. Confirms OT after OT_ASCEND_HYSTERESIS ascending frames so a flicker
  // doesn't trigger a false positive. Treats missing/null TimeSeconds as a
  // no-op rather than coercing to 0 (would latch clockHitZero mid-regulation).
  const hasTime = typeof game.TimeSeconds === "number";
  const rawTime = hasTime ? game.TimeSeconds : prevTimeSeconds;
  if (hasTime) {
    // clockHitZero — regulation-expiry breadcrumb for OT inference. Widened
    // to 2.0 because RL's TimeSeconds quantizes near regulation expiry and
    // frequently skips the (0, 0.5] window entirely. Gated on sawDescent so
    // pre-kickoff TimeSeconds=0 frames at match start (no regulation descent
    // observed yet) can't latch this and false-fire inferredOT.
    if (rawTime <= 2.0 && sawDescent) clockHitZero = true;
    // OT flip at REGULATION END (deterministic). When the regulation clock
    // reaches 0 with tied scores after a descent was observed, RL always goes
    // to OT (no draws), so latch currentOT now -- BEFORE the OT CountdownBegin.
    // This is what lets the state strip show OVERTIME for the whole OT kickoff
    // instead of flashing KICKOFF then swapping. The ascending-frame hysteresis
    // below stays as a fallback (e.g. mid-OT reconnect). If it somehow isn't OT,
    // MatchEnded / PodiumStart reset currentOT=false.
    if (clockHitZero && !currentOT && lastScoreA === lastScoreB){
      inferredOT = true;
      currentOT = true;
      updateStateStrip();
    }
    // Track direction. clockAscending gates the final10 widget directly so
    // we don't depend on a single threshold firing reliably under RL's
    // quantization. Also feeds the OT-inference ascending counter.
    if (rawTime + 0.05 < prevTimeSeconds) {
      sawDescent = true;
      clockAscending = false;
      otAscendingFrames = 0;
    } else if (rawTime > prevTimeSeconds + 0.05) {
      clockAscending = true;
      otAscendingFrames++;
      // Three triggers — any one fires inferredOT after the hysteresis count:
      //   - clockHitZero (the canonical regulation-expiry breadcrumb)
      //   - sawDescent never set (mid-OT reconnect fallback)
      //   - prevTimeSeconds was already low (≤3s) when the ascend started —
      //     covers regulation→OT handoffs where RL skipped the sub-2s window
      //     entirely and jumped straight to the OT up-counter from a low tick.
      if (otAscendingFrames >= OT_ASCEND_HYSTERESIS &&
          (clockHitZero || !sawDescent || prevTimeSeconds <= 3)) {
        inferredOT = true;
      }
    }
    prevTimeSeconds = rawTime;
  }
  const apiOT = !!(game.IsOT || game.isOT);
  const isOT = apiOT || inferredOT;
  const clk = $("clock");
  const t = Math.round(rawTime);
  clk.textContent = fmtClock(rawTime, isOT);
  clk.classList.toggle("ot", isOT);
  // Final 10s of regulation — show big center-screen number, including the
  // "0" frame which matches the in-game UI's hold at 0:00 while RL waits
  // for OT or a buzzer-beater goal. Hidden during:
  //   - OT (via isOT)
  //   - the clock ascending (covers OT ascend before inferredOT confirms,
  //     without depending on a single quantization-fragile threshold)
  //   - any active goal sequence (RL freezes TimeSeconds at the goal moment;
  //     goalSequenceActive flips true in showGoalBanner so the counter hides
  //     when the banner takes over, not 750ms earlier on GoalScored).
  //   - the kickoff countdown (3-2-1-GO) — the big gold "0" shouldn't
  //     compete with the kickoff center text when OT kickoff begins.
  const showFinal10 = !matchOver && !isOT && !clockAscending && !goalSequenceActive &&
                      !inCountdown && t >= 0 && t <= 10;
  const f10 = $("final10");
  if (showFinal10){
    f10.textContent = String(t);
    f10.classList.add("show");
  } else {
    f10.classList.remove("show");
  }
  // OT state drives the eventbar takeover. Tracked module-side so the
  // CountdownBegin handler can re-evaluate eventbar without a fresh snapshot.
  if (isOT !== currentOT){ currentOT = isOT; updateStateStrip(); }

  const players = data.Players || [];
  latestPlayers = players;
  renderBoost($("colA"), players.filter(p => p.TeamNum === 0), "blue");
  renderBoost($("colB"), players.filter(p => p.TeamNum === 1), "red");

  // focused player -> statfeed + radial boost (with sticky-focus persistence)
  const targetName = getTargetName(data);
  let target = targetName ? players.find(p => p.Name === targetName) : null;
  const now = performance.now();
  if (target) {
    lastFocusName = target.Name;
    lastFocusTime = now;
  } else if (lastFocusName && now - lastFocusTime < FOCUS_STICKY_MS) {
    target = players.find(p => p.Name === lastFocusName) || null;
  }
  updateFocus(target);
  markActive(target ? target.Name : null);
}

function renderBoost(col, players, cls){
  // keep DOM stable to avoid flicker; rebuild only if roster size changed
  if (col.childElementCount !== players.length){
    col.innerHTML = "";
    players.forEach(() => {
      const t = document.createElement("div");
      t.className = "ptag";
      t.innerHTML = `<span class="shimmer"></span><div class="prow"><span class="pname"></span><span class="pboost nums"><span class="num"></span><span class="slot"></span></span></div><div class="fill"></div>`;
      col.appendChild(t);
    });
  }
  // Prune stale names so the cache stays bounded to the active roster (and a
  // returning name can't pick up a previous occupant's last-seen boost).
  const present = new Set(players.map(p => p.Name));
  for (const k in lastBoostByName) if (!present.has(k)) delete lastBoostByName[k];
  players.forEach((p, i) => {
    const tag = col.children[i];
    if (typeof p.Boost === "number") lastBoostByName[p.Name] = p.Boost;
    const boost = lastBoostByName[p.Name];
    const hasBoost = typeof boost === "number";
    // Unknown boost shows 0 (not "--") per broadcast preference; RL only
    // re-sends Boost on change, so an as-yet-unseen player reads 0 until the
    // first value lands (brief, since boost changes constantly in play).
    const shownBoost = hasBoost ? boost : 0;
    tag.querySelector(".pname").textContent = p.Name || "";
    tag.querySelector(".pboost .num").textContent = shownBoost;
    tag.querySelector(".fill").style.width = shownBoost + "%";
    tag.dataset.name = p.Name || "";
  });
}

function markActive(name){
  document.querySelectorAll(".ptag").forEach(t =>
    t.classList.toggle("active", !!name && t.dataset.name === name));
}

function updateFocus(p){
  const bar = $("statbar"), gauge = $("boostgauge");
  if (!p){ bar.style.display = "none"; gauge.style.display = "none"; return; }
  bar.style.display = "flex"; gauge.style.display = "block";

  const blue = p.TeamNum === 0;
  $("sbWho").textContent = p.Name || "";
  $("sbWho").className = "who " + (blue ? "blue" : "red");
  $("sbGoals").textContent   = p.Goals   ?? 0;
  $("sbShots").textContent   = p.Shots   ?? 0;
  $("sbAssists").textContent = p.Assists ?? 0;
  $("sbSaves").textContent   = p.Saves   ?? 0;
  $("sbDemos").textContent   = demosByName[p.Name] || 0;

  // Same boost cache as renderBoost so the radial gauge doesn't flicker
  // to 0 / "--" on frames where RL omits the Boost field.
  const cachedBoost = lastBoostByName[p.Name];
  const boost = typeof p.Boost === "number" ? p.Boost
              : typeof cachedBoost === "number" ? cachedBoost : 0;
  const val = $("gaugeVal");
  val.style.stroke = blue ? "var(--blue)" : "var(--red)";
  val.style.strokeDasharray = GAUGE_CIRC;
  val.style.strokeDashoffset = GAUGE_CIRC * (1 - boost/100);
  // Unknown boost shows 0 (not "--") per broadcast preference.
  $("gaugeLabel").textContent = boost;
}

/* ---- Goal sequence (v0.5.5 layered model) --------------------------------
 * Each visual layer has a single owner and an explicit end condition.
 * Handlers route events to layer roles; they don't kill siblings except
 * at explicit cleanup boundaries (clearGoalSequence on kickoff/match end).
 *
 * Event                 Layer role
 * ──────────────────    ──────────────────────────────────────────────────
 * GoalScored            START banner (+750ms), card (+4350ms), stinger
 *                       fallback (+13750ms — bot/freeplay path)
 * GoalReplayStart       END banner; cancel stinger fallback
 *                       (card show timer LEFT ALIVE — fires mid-replay)
 * GoalReplayWillEnd     START stinger (+STINGER_LEAD_AFTER_WILLEND_MS,
 *                       so the wipe-in is mid-animation at the cut)
 * GoalReplayEnd         BACKSTOP — fire stinger only if WillEnd didn't
 *                       (deduped on lastStingerTime within ~1.5s)
 * CountdownBegin        Kickoff 3-2-1 starts; stinger BACKSTOP if no goal
 *                       was covered yet this cycle; clearGoalSequence
 * RoundStarted          GO!; OT preemptive flip (tight gate); clearGoalSequence
 *
 * The stinger is the topmost cover layer. It is the SINGLE OWNER of the
 * replay-card hide — the card disappears simultaneously with stinger start,
 * with the wipe-in covering the swap from the viewer. GoalReplayWillEnd and
 * GoalReplayEnd never hide the card directly under this model.
 *
 * Bot/freeplay/private matches don't emit Replay* events — the +13750ms
 * fallback in onGoalScored drives the stinger and gets cancelled if the
 * real events arrive.
 * ------------------------------------------------------------------------- */
let bannerTimer = null;
let bannerExitTimer = null;

function fillGoalText(tpl, scorer, teamName){
  return String(tpl || "{SCORER} SCORED!")
    .replace(/\{SCORER\}/g, (scorer || "").toUpperCase())
    .replace(/\{scorer\}/g, scorer || "")
    .replace(/\{TEAM\}/g, (teamName || "").toUpperCase())
    .replace(/\{team\}/g, teamName || "");
}

function showGoalBanner(scorer, teamNum){
  // Mark the goal sequence as active so the final10 widget hides while the
  // banner / replay card / stinger / kickoff window plays out. Cleared in
  // clearGoalSequence on next kickoff / disconnect / match end.
  goalSequenceActive = true;
  const blue = teamNum === 0;
  const teamName = blue ? control.teamA.name : control.teamB.name;
  document.documentElement.style.setProperty("--goalc", blue ? "var(--blue)" : "var(--red)");
  $("gbText").textContent = fillGoalText(control.goalText, scorer, teamName);
  // Subtitle + badges — populated from per-player league data (when wired).
  // Look up the scorer in the latest snapshot for any attached metadata. Both
  // slots stay hidden until real data lands.
  applyGoalBannerExtras(scorer, teamNum);
  // Strip the .exiting class from any previous goal cycle so the wipe-in
  // is anchored at the correct side. Apply .from-right when the orange
  // (right-side) team scored, so the banner wipes in from their side.
  const b = $("goalBanner");
  clearTimeout(bannerExitTimer);
  b.classList.remove("exiting");
  b.classList.toggle("from-right", teamNum === 1);
  b.classList.add("show");
  // Fade out the focused-player widgets (statbar + radial gauge) for the
  // ENTIRE goal sequence — banner, replay, replay card, stinger, kickoff —
  // so they don't pop back in during the banner-exit → replay-start gap.
  // clearGoalSequence removes the class; hideGoalBanner does NOT (banner
  // exit is just stage 1, the sequence continues).
  document.body.classList.add("goal-sequence-active");
  clearTimeout(bannerTimer);
  // Measured against the LOS Twitch reference (2026-05-25 08-40-55.mp4):
  //   LOS banner wipe-in starts T+2.1s after the goal moment
  //   LOS banner gone T+5.5s after the goal moment
  //   Total on-screen: ~3.4 seconds
  // Our wipe-in + wipe-out animations are ~0.56s combined, so 2940ms of
  // "visible" middle would exactly match LOS's total. Bot match goal
  // sequences are shorter than LOS's competitive matches though, so
  // 2500ms keeps us in roughly the right phase without dragging into
  // kickoff prep in shorter sequences. Tune if needed.
  bannerTimer = setTimeout(hideGoalBanner, 3000);
}
function hideGoalBanner(){
  // Enter from left, exit to right (mirrored for orange goals).
  // Adding .exiting and removing .show in the same tick lets the browser
  // batch them into one paint, which can skip the transform-origin flip
  // and make the wipe-out look like a normal rewind. The force-reflow
  // (`void b.offsetWidth`) commits the .exiting origin change as its own
  // paint first so the scaleX collapse animates against the new origin.
  // The .exiting class is then cleaned up after the transition finishes
  // (~600ms for the slowest layer), leaving the banner ready for the
  // next goal's wipe-in.
  const b = $("goalBanner");
  b.classList.add("exiting");
  void b.offsetWidth;
  b.classList.remove("show");
  clearTimeout(bannerExitTimer);
  bannerExitTimer = setTimeout(() => b.classList.remove("exiting"), 600);
  clearTimeout(bannerTimer);
  bannerTimer = null;
  // Focused-player widgets stay hidden — banner exit is just stage 1 of the
  // goal sequence. clearGoalSequence (on kickoff / match end / disconnect)
  // is the single owner of the goal-sequence-active class removal so the
  // widgets don't pop back in between banner exit and replay start.
}

// Kickoff 3-2-1-GO center-screen countdown. Fires on CountdownBegin so
// broadcasts with RL's in-game HUD hidden still see a countdown.
//
// v0.5.11 model: GO! is anchored to a CountdownBegin+delay+3000ms timer
// targeting ball-drop, NOT to RoundStarted. Paired-capture analysis showed
// RoundStarted fires BEFORE ball-drop (not at it):
//   admin-pause kickoff: RoundStarted is ~4650ms before ball-drop
//   OT kickoff:          RoundStarted is ~805ms  before ball-drop
// Anchoring on RoundStarted dropped GO! several seconds early. RoundStarted
// is kept as a safety backstop that calls fireKickoffGo (idempotent), so a
// future regression that clears the primary timer still recovers.
//
// Four delay regimes — pick at CountdownBegin time:
//   - FIRST kickoff after MatchCreated (longest intro)        — LOW confidence
//   - OT kickoff (~4800ms CountdownBegin→ball-drop)           — measured v0.5.11
//   - POST-GOAL kickoff (celebration already covered spawn)   — LOW confidence
//   - FRESH kickoff (admin pause/resume; ~7770ms ball-drop)   — measured v0.5.10
// OT is detected via the same gate as the OT preemptive state flip:
// sawDescent + prevTimeSeconds≤2 + tied scores + not the first kickoff.
//
// NOTE: FIRST + POSTGOAL delays have no ball-drop ground truth yet — they
// were tuned by feel and may drift. Capture and re-verify against
// match-start and post-goal kickoffs before declaring them stable.
// CONFIDENCE: LOW for FIRST + POSTGOAL — no ball-drop measurements yet.
// These were tuned by feel pre-v0.5.11 and may drift; re-verify against
// captured ball-drop frames for first-of-match and post-goal kickoffs
// before assuming stable.
const KICKOFF_FIRST_DELAY_MS     = 750;
// v0.5.10: bumped 1500 → 4750 per the v0.5.9 admin-pause capture analysis
// (workflow wul19xv9n, ball-drop ground-truth anchor):
//   CountdownBegin → ball-drop = ~7770ms in admin-pause/resume kickoffs
//   Digit span 3→2→1→GO = 3000ms hardcoded
//   Entry delay needed = 7770 − 3000 ≈ 4770ms → rounded to 4750
//
// The v0.5.4 analysis I tuned v0.5.6's value against was WRONG: it
// conflated RoundStarted (camera-cut to player POV) with ball-drop.
// RoundStarted in admin-resume is ~4650ms BEFORE ball-drop, not at it.
// So 1500ms made overlay "GO!" land 3267ms before the ball actually
// dropped. Tuning in the opposite direction now.
//
// CONFIDENCE: LOW. Ball-drop frame ID has ±50ms wobble at 60fps + ±100ms
// estimation error on the soft ball-touch-down moment. Verify with a
// follow-up admin-pause capture before assuming stable.
//
// KNOWN UNKNOWN: this is tuned for admin-pause/restart specifically. A
// "true fresh kickoff" (different scenario — TBD what triggers it) may
// have a different lead-in. If a non-admin-pause case shows drift,
// introduce a dedicated KICKOFF_ADMIN_RESUME_DELAY_MS and detect it via
// state-change heuristics (clock jump, score jump, etc.).
const KICKOFF_FRESH_DELAY_MS     = 4750;
// v0.5.11: OT kickoffs use a shorter lead-in than admin-pause kickoffs.
// Paired capture analysis:
//   CountdownBegin → ball-drop = ~4800ms in OT kickoffs
//   Digit span 3→2→1→GO = 3000ms hardcoded
//   Entry delay needed = 4800 − 3000 = 1800ms
// Detected via the same heuristic as the RoundStarted OT preemptive flip,
// but evaluated at CountdownBegin instead — see startKickoffCountdown.
const KICKOFF_OT_DELAY_MS        = 1800;
const KICKOFF_POSTGOAL_DELAY_MS  = 900;
const KICKOFF_POST_GOAL_WINDOW_MS = 15000;
const KICKOFF_GO_HOLD_MS = 1300;
let firstKickoffPending = true;
let kickoffTimers = [];
// Set when fireKickoffGo runs; prevents the fallback timer and RoundStarted
// from both showing GO! and producing a flicker. Cleared on finish.
let kickoffGoShown = false;

// WALL-CLOCK ANCHORED KICKOFF COUNTDOWN.
// OBS browser sources (CEF) throttle setTimeout/setInterval to ~1Hz (worse
// after minutes) when the source is off the active scene or OBS is minimized,
// which made the chained-setTimeout 3-2-1-GO drop / bunch / arrive late. We
// now stamp a start time + chosen delay at CountdownBegin and let an
// un-throttled tick re-render the CORRECT digit for the actual elapsed wall
// time every ~60ms. A missed/clamped tick self-heals: it shows the right
// digit for the real elapsed time and jumps straight to GO! if behind.
let kickoffStartMs = 0;        // performance.now() stamped at CountdownBegin
let kickoffDelayMs = 0;        // chosen per-scenario lead-in for this kickoff
let kickoffActive = false;     // true between start and finish (gates the tick)
let kickoffLastDigit = null;   // last rendered digit/state, so we only re-render on change
// Tick source. A Web Worker's timers are NOT throttled when the page is
// backgrounded, so its 60ms ping keeps reaching the main thread (whose
// handler runs even when the page's own timers are clamped). Built inline via
// a Blob URL so this file stays self-contained. If Worker construction throws
// (restricted env), we fall back to a main-thread setInterval — the render
// reads wall-clock either way, so even a clamped ~1Hz fallback shows correct
// digits (they only change at 1Hz anyway).
let kickoffWorker = null;
let kickoffFallbackTimer = null;
function startKickoffTick(){
  stopKickoffTick();
  if (!kickoffWorker){
    try {
      kickoffWorker = new Worker(URL.createObjectURL(new Blob(
        ["let i;onmessage=e=>{if(e.data==='start'){clearInterval(i);i=setInterval(()=>postMessage(0),60)}else{clearInterval(i)}}"],
        {type:'text/javascript'})));
      kickoffWorker.onmessage = kickoffTick;
    } catch (err) {
      kickoffWorker = null;   // restricted env — fall back to main-thread timer
    }
  }
  if (kickoffWorker){
    kickoffWorker.postMessage('start');
  } else {
    kickoffFallbackTimer = setInterval(kickoffTick, 60);
  }
}
function stopKickoffTick(){
  if (kickoffWorker) kickoffWorker.postMessage('stop');
  if (kickoffFallbackTimer){ clearInterval(kickoffFallbackTimer); kickoffFallbackTimer = null; }
}
// Render the correct digit for the elapsed wall time, re-rendering only on a
// change. Windows: [delay, delay+1000)->"3", [+1000,+2000)->"2",
// [+2000,+3000)->"1", >= delay+3000 -> GO!. Before `delay` we hold (no digit
// shown yet). GO! is idempotent via fireKickoffGo's kickoffGoShown guard.
function kickoffTick(){
  if (!kickoffActive) return;
  const elapsed = performance.now() - kickoffStartMs;
  if (elapsed < kickoffDelayMs) return;        // pre-roll: nothing shown yet
  const since = elapsed - kickoffDelayMs;
  if (since >= 3000){
    if (kickoffLastDigit !== "GO"){ kickoffLastDigit = "GO"; fireKickoffGo(); }
    return;
  }
  const digit = since >= 2000 ? "1" : since >= 1000 ? "2" : "3";
  if (digit !== kickoffLastDigit){
    kickoffLastDigit = digit;
    showKickoffValue(digit, false);
  }
}
function showKickoffValue(text, isGo){
  const el = $("kickoffCount");
  if (!el) return;
  el.classList.remove("show", "go");
  void el.offsetWidth;
  el.textContent = text;
  el.classList.add("show");
  if (isGo) el.classList.add("go");
}
function startKickoffCountdown(){
  finishKickoffCountdown();
  const postGoal = (performance.now() - lastGoalTime) < KICKOFF_POST_GOAL_WINDOW_MS;
  // Deterministic delay pick. currentOT is now reliable BEFORE the OT kickoff
  // (regulation-buzzer flip in onUpdateState), so OT no longer races the old
  // sawDescent/prevTimeSeconds/tied heuristic. Order: FIRST kickoff after
  // MatchCreated, else OT (~4800ms ball-drop), else POST-GOAL (celebration
  // covered spawn), else FRESH (admin pause/resume, ~7770ms ball-drop).
  const delay = firstKickoffPending ? KICKOFF_FIRST_DELAY_MS
              : currentOT            ? KICKOFF_OT_DELAY_MS
              : postGoal             ? KICKOFF_POSTGOAL_DELAY_MS
              :                        KICKOFF_FRESH_DELAY_MS;
  firstKickoffPending = false;
  // Anchor to wall-clock and start the un-throttled tick. The tick renders the
  // correct digit for the actual elapsed time (3 -> 2 -> 1 -> GO!), so a CEF
  // timer clamp can't drop / bunch digits — a late tick self-heals to the
  // right value and jumps to GO! if behind. GO! fires from the tick at
  // delay+3000; RoundStarted no longer drives it.
  kickoffStartMs = performance.now();
  kickoffDelayMs = delay;
  kickoffLastDigit = null;
  kickoffActive = true;
  startKickoffTick();
}
// GO! anchor. Driven by the wall-clock tick (kickoffTick) at delay+3000, which
// targets ball-drop, not RoundStarted (which RL fires ~4650ms BEFORE ball-drop
// in admin-pause kickoffs and ~805ms BEFORE ball-drop in OT). RoundStarted no
// longer calls this. Idempotent via kickoffGoShown so a re-entrant tick can't
// double-fire.
function fireKickoffGo(){
  if (kickoffGoShown) return;
  kickoffGoShown = true;
  kickoffLastDigit = "GO";
  // The digit tick is done once GO! shows — stop it so it can't keep pinging.
  // (currentOT is already true for OT kickoffs from the regulation-buzzer flip
  // in onUpdateState, so no OT flip is needed here anymore.)
  stopKickoffTick();
  kickoffTimers.forEach(clearTimeout);
  kickoffTimers = [];
  showKickoffValue("GO!", true);
  // GO!-hold teardown is a single one-shot timer (not a sequence), so a CEF
  // clamp only delays the teardown harmlessly.
  kickoffTimers.push(setTimeout(finishKickoffCountdown, KICKOFF_GO_HOLD_MS));
}
function finishKickoffCountdown(){
  stopKickoffTick();
  kickoffActive = false;
  kickoffLastDigit = null;
  kickoffTimers.forEach(clearTimeout);
  kickoffTimers = [];
  kickoffGoShown = false;
  const el = $("kickoffCount");
  if (el) el.classList.remove("show", "go");
}

// Populate the goal banner's optional subtitle + badges slots. Data sources:
//   1. League API per-player blob (future) — `subtitle` string + `badges` array
//   2. Manual override on control state (`control.scorerSubtitle`, `control.scorerBadges`)
// Both slots stay hidden when no data is supplied. Up to 3 badges max.
function applyGoalBannerExtras(scorer, teamNum){
  const b = $("goalBanner");
  const player = (latestPlayers || []).find(p => p && p.Name === scorer) || {};
  const subtitle = player.subtitle || control.scorerSubtitle || "";
  const badges   = (player.badges && player.badges.length ? player.badges
                  : (control.scorerBadges || [])).slice(0, 3);
  if (subtitle){
    $("gbSub").textContent = subtitle;
    b.classList.add("has-sub");
  } else {
    b.classList.remove("has-sub");
  }
  const host = $("gbBadges");
  host.innerHTML = "";
  if (badges.length){
    badges.forEach(label => {
      const el = document.createElement("span");
      el.className = "gb-badge";
      el.textContent = label;
      host.appendChild(el);
    });
    b.classList.add("has-badges");
  } else {
    b.classList.remove("has-badges");
  }
}

// Scoreboard GOAL flash — gold "GOAL" graphic over the scoring team's name
// block. Synced with the goal banner so both reactions read as one moment.
let goalFlashTimers = { A:null, B:null };
let goalFlashExitTimers = { A:null, B:null };
function showGoalFlash(teamNum){
  const which = teamNum === 0 ? "A" : "B";
  const el = $("goalFlash" + which);
  if (!el) return;
  // Clean up any pending exit-cleanup from a previous flash before we re-show.
  clearTimeout(goalFlashExitTimers[which]);
  el.classList.remove("exiting", "show");
  // Force reflow so re-trigger during a previous flash re-animates cleanly.
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(goalFlashTimers[which]);
  goalFlashTimers[which] = setTimeout(() => hideGoalFlash(teamNum), 2800);
}
function hideGoalFlash(teamNum){
  const which = teamNum === 0 ? "A" : "B";
  const el = $("goalFlash" + which);
  if (!el) return;
  el.classList.add("exiting");
  void el.offsetWidth;
  el.classList.remove("show");
  clearTimeout(goalFlashExitTimers[which]);
  goalFlashExitTimers[which] = setTimeout(() => el.classList.remove("exiting"), 400);
}

// The stinger is the topmost cover layer. It owns the visual handoff from
// replay → live (or banner → live in bot-mode fallback), so it ALSO hides
// the replay card as it fires — the card disappears simultaneously with
// the wipe-in starting, and the wipe-in covers the card-vacate frame from
// the viewer. Per the layered ownership model: the stinger is the single
// authority on "card is gone now", not GoalReplayWillEnd / GoalReplayEnd.
// Also cancels any pending replay-card show timer — a very short replay
// (shorter than the +4350ms scheduled show) could otherwise fire the timer
// AFTER the stinger has already cut to live, popping the card on top of
// the wrong scene with no exit animation.
function playStinger(){
  if (!control.goalSequence) return;
  const s = $("stinger");
  if (!s) return;
  lastStingerTime = performance.now();
  clearTimeout(replayCardShowTimer);
  hideReplayCard();
  s.classList.remove("run");
  void s.offsetWidth;        // force reflow so the animation restarts
  s.classList.add("run");
  clearTimeout(playStinger._t);
  playStinger._t = setTimeout(() => s.classList.remove("run"), 950);
}

// Delay (ms) between RL firing GoalScored and the banner starting to wipe in.
// Lets the in-game celebration land first, then the broadcast graphic sweeps
// in over it. Bump up for more breathing room, down for snappier.
const GOAL_BANNER_DELAY_MS = 750;

function onGoalScored(data){
  if (!control.goalSequence) return;     // let the in-game text show if disabled
  const scorer = (data.Scorer && data.Scorer.Name) || "";
  const teamNum = (data.Scorer && data.Scorer.TeamNum);
  // Don't render a "name-less" banner. Some game modes / own-goals fire
  // GoalScored with an empty Scorer.Name (also fires on every GoalReplayEnd
  // as a phantom payload). Skip — and skip BEFORE the dedup map update so the
  // phantom doesn't poison the last-fire key.
  if (!scorer) return;
  // Dedup the double-fire RL emits per real goal (~4-15ms apart; second payload
  // typically lacks GoalSpeed and would zero out lastGoalSpeed if we re-ran the
  // pipeline). If the late payload carries a GoalSpeed and the earlier one was
  // 0, adopt it; otherwise drop the duplicate.
  const now = performance.now();
  const prevFire = lastGoalFireByName[scorer] || 0;
  if (now - prevFire < GOAL_DEDUP_MS) {
    const lateSpeed = Number(data.GoalSpeed) || 0;
    if (lateSpeed > 0 && lastGoalSpeed === 0) lastGoalSpeed = lateSpeed;
    return;
  }
  lastGoalFireByName[scorer] = now;
  lastGoalTime = now;
  lastGoalSpeed = Number(data.GoalSpeed) || 0;
  // The scorer's card goes full gold and HOLDS through the whole goal sequence
  // (banner + replay), not the generic 2s stat-pop timer — cleared in
  // clearGoalSequence when the next kickoff begins. Clear any prior gold first
  // (defensive: a rare back-to-back goal by a different player).
  clearGoalGold();
  goalGoldTag = spawnStatPop(scorer, "goal", "futbol", true);
  // Cancel any in-flight pending banner+flash from a previous goal so a
  // rapid back-to-back doesn't double-pop.
  clearTimeout(goalBannerShowTimer);
  goalBannerShowTimer = setTimeout(() => {
    showGoalBanner(scorer, teamNum);
    showGoalFlash(teamNum);
  }, GOAL_BANNER_DELAY_MS);
  // Schedule the replay card to fade in once the goal banner has wiped
  // out. Replay events (GoalReplayStart/End) don't fire in every game
  // mode, so we drive the card off the same trigger as the banner with
  // a longer delay. onGoalReplayStart/End / clearGoalSequence cancel this
  // if RL does fire those.
  clearTimeout(replayCardShowTimer);
  replayCardShowTimer = setTimeout(
    () => showReplayCard(scorer, teamNum),
    GOAL_BANNER_DELAY_MS + 3600
  );
  // Same fallback pattern for the stinger — GoalReplayEnd doesn't fire in
  // bot/freeplay/private matches, so trigger the wipe on a timer ~9s after
  // the replay card lands (13.75s after the goal). onGoalReplayEnd /
  // clearGoalSequence cancel this if the real event arrives so we don't
  // double-fire. CountdownBegin also fires the stinger early if the fallback
  // hasn't run yet (lastGoalTime > lastStingerTime check).
  clearTimeout(stingerShowTimer);
  // playStinger hides the card as it fires (single owner of the cut handoff
  // under the v0.5.5 layered model). No explicit hideReplayCard call needed.
  stingerShowTimer = setTimeout(playStinger, GOAL_BANNER_DELAY_MS + 13000);
}
function onGoalReplayStart(){
  if (!control.goalSequence) return;
  if (!goalSequenceActive) return;
  // Real replay started. Cancel the stinger fallback only — the replay card
  // show timer is INTENTIONALLY left alive so the card still appears at its
  // scheduled moment (after the banner has exited), which lines up with the
  // replay playback. RL fires GoalReplayStart ~1-3s after the goal, well
  // before the replay-card show timer at GOAL_BANNER_DELAY_MS + 3600ms.
  clearTimeout(stingerShowTimer);
  hideGoalBanner();
}
// RL fires GoalReplayWillEnd ~3s before GoalReplayEnd. Under the v0.5.5
// layered model this is the STINGER START trigger — not a card cleanup
// event. We schedule the stinger to fire shortly before the expected cut
// so the wipe-in is mid-animation when GoalReplayEnd lands (covering
// the cut from viewers). The replay card stays up the entire time; the
// stinger hides it simultaneously when it fires, with the wipe-in
// covering the swap. Tuned against [[live-capture-workflow]] data.
const STINGER_LEAD_AFTER_WILLEND_MS = 2500;
function onGoalReplayWillEnd(){
  if (!control.goalSequence) return;
  if (!goalSequenceActive) return;
  if (performance.now() - lastStingerTime < STINGER_BACKSTOP_DEDUP_MS) return;
  // Card stays. Schedule (or re-schedule) the stinger for the lead-in.
  // Cancels any prior bot-mode fallback that was already in flight so we
  // can't double-fire from the +13750ms GoalScored timer landing later.
  clearTimeout(stingerShowTimer);
  stingerShowTimer = setTimeout(playStinger, STINGER_LEAD_AFTER_WILLEND_MS);
}
// Backstop only. By the time GoalReplayEnd fires, the stinger should
// already be running (started ~500ms ago from GoalReplayWillEnd). If for some
// reason it didn't — e.g., GoalReplayWillEnd never fired, or the WillEnd→End
// gap was shorter than STINGER_LEAD_AFTER_WILLEND_MS — fire it now so the
// cut to live isn't completely uncovered. Dedup on lastStingerTime so a
// successful WillEnd-triggered stinger isn't double-fired.
//
// Dedup window is wide enough to cover: full stinger animation (~950ms) +
// the WillEnd→End gap variance observed across captures (RL is not bounded
// at exactly ~3s — long-tailed replays push it further). 3500ms gives us
// solid headroom against a second stinger firing over the first's tail.
const STINGER_BACKSTOP_DEDUP_MS = 3500;
function onGoalReplayEnd(){
  if (!control.goalSequence) return;
  if (!goalSequenceActive) return;
  // Card show-timer is no longer needed (we either showed it already or
  // the replay was too short for the show timer to fire — either way kill it).
  clearTimeout(replayCardShowTimer);
  const now = performance.now();
  if (now - lastStingerTime < STINGER_BACKSTOP_DEDUP_MS) {
    // Stinger already running from GoalReplayWillEnd — nothing to do. It's
    // already hiding the card and covering the cut.
    return;
  }
  // Stinger didn't fire from WillEnd; fire it now as the backstop.
  clearTimeout(stingerShowTimer);
  playStinger();
}
// Remove the scorer's persistent gold treatment. Safe to call when no gold is
// active. Single teardown for goalGoldTag, called from clearGoalSequence (all
// the kickoff / disconnect / match-end paths route through it) and resetMatch.
function clearGoalGold(){
  if (!goalGoldTag) return;
  goalGoldTag.classList.remove("statev");
  const gpb = goalGoldTag.querySelector(".pboost");
  if (gpb) gpb.classList.remove("statev");
  goalGoldTag = null;
}

function clearGoalSequence(){
  clearGoalGold();
  // Cancel every in-flight timer that drives a piece of the goal sequence so
  // a match boundary / disconnect / next goal can't leave any element stuck
  // on screen. NOTE: deliberately does NOT touch the stinger's .run class or
  // its self-clearing timer — clearGoalSequence is often called RIGHT AFTER
  // playStinger() (CountdownBegin / RoundStarted backstop path), and stripping
  // .run synchronously would cancel the stinger before the browser paints it.
  // playStinger owns its own 950ms teardown; let the animation complete.
  goalSequenceActive = false;
  clearTimeout(goalBannerShowTimer);
  clearTimeout(replayCardShowTimer);
  clearTimeout(stingerShowTimer);
  clearTimeout(bannerTimer);
  clearTimeout(bannerExitTimer);
  clearTimeout(goalFlashTimers.A);
  clearTimeout(goalFlashTimers.B);
  clearTimeout(goalFlashExitTimers.A);
  clearTimeout(goalFlashExitTimers.B);
  hideGoalBanner();
  hideReplayCard();
  // Force-clear the GOAL flashes if either was visible.
  document.querySelectorAll(".goal-flash").forEach(el => {
    el.classList.remove("show", "exiting");
  });
  document.body.classList.remove("goal-sequence-active");
}

// Look up the scorer's row in the latest UpdateState snapshot and paint
// their stats into the card. Team color drives both the card background
// and which corner it sits in (left for blue, right for orange).
function showReplayCard(scorerName, teamNum){
  const blue = teamNum === 0;
  const p = latestPlayers.find(x => x && x.Name === scorerName) || {};
  document.documentElement.style.setProperty("--rpc", blue ? "var(--blue)" : "var(--red)");
  const card = $("replayCard");
  card.classList.remove("left", "right");
  card.classList.add(blue ? "left" : "right");
  $("rpcName").textContent = scorerName || "-";
  $("rpcGoals").textContent   = p.Goals   ?? 0;
  $("rpcAssists").textContent = p.Assists ?? 0;
  $("rpcSaves").textContent   = p.Saves   ?? 0;
  $("rpcShots").textContent   = p.Shots   ?? 0;
  $("rpcDemos").textContent   = demosByName[scorerName] ?? 0;
  // Goal speed — RL's GoalScored.GoalSpeed comes in KPH (matches the in-game
  // post-goal display unit). Convert to MPH for NA broadcasts: MPH = KPH × 0.621371.
  // When league API supplies match region, the unit will flip for non-NA matches.
  const speedEl = $("rpcSpeed");
  if (lastGoalSpeed > 0){
    const mph = Math.round(lastGoalSpeed * 0.621371);
    speedEl.innerHTML = `<b>${mph}</b>MPH`;
  } else {
    speedEl.textContent = "";
  }
  // Assister attribution — only show if an assist statfeed fired in the
  // window before this goal AND the assister isn't the scorer themselves.
  const recentAssist = lastAssist.player &&
                       lastAssist.player !== scorerName &&
                       (performance.now() - lastAssist.time) < ASSIST_WINDOW_MS;
  if (recentAssist){
    $("rpcAssister").textContent = lastAssist.player;
    card.classList.add("has-assist");
  } else {
    card.classList.remove("has-assist");
  }
  card.classList.add("show");
}

function hideReplayCard(){
  const c = $("replayCard");
  c.classList.remove("show", "has-assist");
  // Scrub the assister text so a rapid next goal doesn't flash the previous
  // assister's name on the new card for one frame before applyControl re-paints.
  const a = $("rpcAssister");
  if (a) a.textContent = "";
}

// StatfeedEvent type → { color family class, SVG_ICONS key }.
// Color family groups related events under one visual identity (e.g. epic
// save shares save's teal); the icon differentiates the subtype. Keys are
// substrings matched against the lowercased event name.
const STAT_POP_TYPES = [
  // Order matters — more specific keywords first so "epic save" doesn't
  // match the plain "save" rule, "hat" doesn't match "shot", etc.
  { match: "hat",         cls: "goal",   icon: "trophy"          },
  { match: "aerial",      cls: "goal",   icon: "plane"           },
  { match: "bicycle",     cls: "goal",   icon: "bicycle"         },
  { match: "pool",        cls: "goal",   icon: "baseball"        },
  { match: "epicsave",    cls: "save",   icon: "shield-halved"   },
  { match: "epic save",   cls: "save",   icon: "shield-halved"   },
  { match: "save",        cls: "save",   icon: "hand-fist"       },
  { match: "highfive",    cls: "five",   icon: "hand"            },
  { match: "high five",   cls: "five",   icon: "hand"            },
  { match: "lowfive",     cls: "five",   icon: "hand"            },
  { match: "low five",    cls: "five",   icon: "hand"            },
  { match: "assist",      cls: "assist", icon: "handshake"       },
  { match: "shot",        cls: "shot",   icon: "bullseye"        },
  { match: "demolish",    cls: "demo",   icon: "bomb"            },
  { match: "demo",        cls: "demo",   icon: "bomb"            },
  { match: "centre",      cls: "pass",   icon: "arrows-left-right" },
  { match: "center",      cls: "pass",   icon: "arrows-left-right" },
  { match: "clear",       cls: "pass",   icon: "arrow-up"        },
  { match: "goal",        cls: "goal",   icon: "futbol"          },
];
function lookupStatPop(type){
  for (const t of STAT_POP_TYPES) if (type.includes(t.match)) return t;
  return null;
}

function onStatfeed(data){
  const type = (data.Type || data.EventName || data.Event || "").toString().toLowerCase();
  // Pull the "main actor" name across the field-name variants RL has used.
  const mainName = (data.MainPlayer && data.MainPlayer.Name) ||
                   (data.MainTarget && data.MainTarget.Name) ||
                   data.MainPlayer || data.Name;
  // Demolitions need their own branch — attacker is the actor (not the
  // demoed player), they double-fire (~800ms apart), and the bottom-bar
  // demo counter is tallied here. All other event types fall through to
  // the generic STAT_POP_TYPES lookup.
  if (type.includes("demo") || type.includes("demolish")){
    const attacker = (data.Attacker && data.Attacker.Name) || mainName;
    if (attacker){
      const key = "demo|" + attacker;
      const now = performance.now();
      if (now - (lastStatfeedFire[key] || 0) < STATFEED_DEDUP_MS) return;
      lastStatfeedFire[key] = now;
      demosByName[attacker] = (demosByName[attacker] || 0) + 1;
      spawnStatPop(attacker, "demo", "bomb");
    }
    return;
  }
  // Goal pops are spawned from onGoalScored (the canonical trigger) to avoid
  // double-popping if RL also fires a Goal-typed StatfeedEvent. Special-goal
  // subtypes (hat-trick, aerial, bicycle, pool) DO come through statfeed and
  // are handled below — they don't conflict with onGoalScored's plain "goal"
  // because the StatfeedEvent type string carries the subtype keyword.
  if (type === "goal" || type === "goalscored") return;

  const meta = lookupStatPop(type);
  if (!meta || !mainName) return;
  spawnStatPop(mainName, meta.cls, meta.icon);
  if (meta.cls === "assist") {
    // Remember the most recent assist so the replay card can attribute it.
    lastAssist = { player: mainName, time: performance.now() };
  }
}

// Stat-event treatment (Option B, v0.6.4): muted plate tint + boost number
// replaced by the event icon in-slot + a subtle one-pass shimmer. Mirrors
// the chosen prototype. Re-firing within the hold crossfades to the new icon
// and restarts the tint/shimmer. Hold tunable here (v0.6.5).
const STAT_POP_HOLD_MS = 2000;
const EV_FAMILIES = ["ev-goal","ev-assist","ev-save","ev-shot","ev-demo","ev-pass","ev-five"];
// persist=true skips the auto-clear timer; the caller owns teardown (used for
// the goal gold, which rides the goal-sequence lifecycle). Returns the tag so
// the caller can track it.
function spawnStatPop(playerName, cls, iconKey, persist){
  const tag = document.querySelector('.ptag[data-name="' + cssEscape(playerName) + '"]');
  if (!tag) return null;
  const pb = tag.querySelector(".pboost");
  const slot = tag.querySelector(".pboost .slot");
  if (!pb || !slot) return;
  // Put the event icon in the boost-number slot (inline SVG; offline-safe).
  const def = SVG_ICONS[iconKey];
  slot.innerHTML = "";
  if (def) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", def.viewBox);
    svg.setAttribute("aria-hidden", "true");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", def.path);
    p.setAttribute("fill", "currentColor");
    svg.appendChild(p);
    slot.appendChild(svg);
  }
  // Event-family color drives the muted plate tint via --evc.
  tag.classList.remove(...EV_FAMILIES);
  tag.classList.add("ev-" + cls);
  // Restart cleanly so a rapid re-fire replays the shimmer + transitions.
  tag.classList.remove("statev"); pb.classList.remove("statev");
  void tag.offsetWidth;
  tag.classList.add("statev"); pb.classList.add("statev");
  clearTimeout(tag._statT);
  tag._statT = null;
  if (!persist) {
    tag._statT = setTimeout(() => {
      tag.classList.remove("statev");
      pb.classList.remove("statev");
    }, STAT_POP_HOLD_MS);
  }
  return tag;
}
// Minimal CSS.escape polyfill for the rare case it's not present in the
// Electron build's renderer; player names can contain quotes/brackets.
function cssEscape(s){
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\]/g, "\\$&");
}

function resetMatch(){
  // Tear down any in-flight kickoff tick so a mid-kickoff match reset can't
  // leak a running tick into the next match.
  finishKickoffCountdown();
  demosByName = {};
  firstKickoffPending = true;
  clearGoalGold();
  // Clear per-match state that could bleed into the next match if matches
  // start back-to-back within the assist/goal-dedup windows.
  lastAssist = { player: null, time: 0 };
  lastGoalSpeed = 0;
  lastGoalTime = 0;
  lastStingerTime = 0;
  lastGoalFireByName = {};
  lastStatfeedFire = {};
  lastCountdownBeginTime = 0;
  // OT detector — clear so a new match starts in regulation mode regardless
  // of where the previous one ended.
  prevTimeSeconds = 0;
  clockHitZero = false;
  otAscendingFrames = 0;
  inferredOT = false;
  sawDescent = false;
  clockAscending = false;
  goalSequenceActive = false;
  matchOver = false;
  // Scores get re-populated by the next UpdateState; reset so the RoundStarted
  // OT preemptive flip can't see stale tied scores carried from the prior match.
  lastScoreA = 0;
  lastScoreB = 0;
}

function connectGame(){
  const ws = new WebSocket(GAME_WS);
  ws.onopen = () => $("status").textContent = "live";
  ws.onclose = () => {
    $("status").textContent = "reconnecting";
    // Tear down any in-flight goal sequence so a dropped WS during a goal
    // doesn't leave the banner / replay card / stinger pinned on screen
    // for the rest of the broadcast.
    clearGoalSequence();
    finishKickoffCountdown();   // stops the kickoff tick + clears the anchor
    inCountdown = false;
    currentOT = false;
    // Reset OT detector so the reconnect doesn't re-fire OVERTIME based on
    // stale state from before the drop. sawDescent stays false so if we
    // reconnect mid-OT, the "no descent ever observed" path can still infer.
    clockHitZero = false;
    otAscendingFrames = 0;
    inferredOT = false;
    prevTimeSeconds = 0;
    sawDescent = false;
    clockAscending = false;
    // Reset goal-sequence state too — a disconnect during a goal sequence
    // shouldn't leave final10 suppressed for the rest of the match.
    goalSequenceActive = false;
    lastGoalTime = 0;
    lastStingerTime = 0;
    // OT preemptive flip at RoundStarted reads lastScoreA/lastScoreB AND
    // gates on !firstKickoffPending. The sawDescent reset above already
    // blocks false positives until a real descent is observed post-reconnect,
    // but reset these too so the gate doesn't depend on that side effect.
    firstKickoffPending = true;
    lastScoreA = 0;
    lastScoreB = 0;
    updateStateStrip();
    setTimeout(connectGame, 1500);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    const ev = (msg.event || "").toString();
    const data = msg.data || {};
    if (ev === "UpdateState") onUpdateState(data);
    else if (ev === "GoalScored") onGoalScored(data);
    // Canonical RL replay event names: GoalReplayStart / GoalReplayWillEnd /
    // GoalReplayEnd (confirmed via live WS capture 2026-06-14). The prior
    // ReplayPlayback* / ReplayWillEnd names were the dead-handler bug (RL
    // never emitted them, so these branches never matched). Bot/freeplay/private
    // modes may not fire the replay events at all, so the onGoalScored fallback
    // timers remain as the safety net for modes that drop them entirely.
    else if (ev === "GoalReplayStart")   onGoalReplayStart();
    else if (ev === "GoalReplayWillEnd") onGoalReplayWillEnd();
    else if (ev === "GoalReplayEnd")     onGoalReplayEnd();
    else if (ev === "CountdownBegin") {
      // Debounce — RL sometimes fires CountdownBegin twice after pause/resume,
      // and the second would re-anchor the kickoff timer with a different
      // regime than the first (drifts the visible 3-2-1 from the in-game one).
      const now = performance.now();
      if (now - lastCountdownBeginTime < COUNTDOWN_DEBOUNCE_MS) return;
      lastCountdownBeginTime = now;
      matchOver = false; // a new kickoff means we're back in live play
      // If a goal happened since the last stinger fired, play the stinger NOW
      // to mask the cut to kickoff. playStinger hides the card itself.
      if (goalSequenceActive && lastGoalTime > lastStingerTime) {
        playStinger();
      }
      inCountdown = true;
      updateStateStrip();
      startKickoffCountdown();
      clearGoalSequence();
    }
    else if (ev === "RoundStarted")  {
      // RoundStarted is the camera-cut to player POV — NOT ball-drop. Per the
      // v0.5.11 paired-capture measurement (RoundStarted lands 805ms-4650ms
      // BEFORE actual ball-drop depending on scenario), it is NOT a reliable
      // GO! anchor. fireKickoffGo is now driven by the per-scenario delay+3000
      // timer scheduled in startKickoffCountdown. RoundStarted just clears
      // inCountdown and any lingering goal-sequence state.
      inCountdown = false;
      updateStateStrip();
      clearGoalSequence();
    }
    else if (ev === "StatfeedEvent") onStatfeed(data);
    else if (ev === "MatchCreated" || ev === "MatchInitialized") resetMatch();
    // Golden-goal OT ends the match without firing GoalReplayEnd, which
    // would leave the replay card pinned on screen. MatchEnded / PodiumStart
    // force a full clear of the goal sequence and the OT/kickoff takeovers.
    else if (ev === "MatchEnded" || ev === "PodiumStart") {
      clearGoalSequence();
      currentOT = false;
      inCountdown = false;
      // Match is over: hide the held final-10 "0" and gate it from re-showing
      // if UpdateState keeps streaming a 0:00 clock through the podium.
      matchOver = true;
      $("final10").classList.remove("show");
      // Reset OT detector so the next match starts in regulation mode.
      clockHitZero = false;
      otAscendingFrames = 0;
      inferredOT = false;
      prevTimeSeconds = 0;
      sawDescent = false;
      clockAscending = false;
      // Reset goal-sequence state so a stuck goalSequenceActive can't
      // suppress final10 in the next match's final 10 seconds.
      goalSequenceActive = false;
      lastGoalTime = 0;
      lastStingerTime = 0;
      // RL sometimes drops back to a fresh match without a MatchInitialized
      // (e.g., menu drop → straight into next match). Reset firstKickoff +
      // scores so the OT preemptive flip doesn't see stale tied state at
      // the next match's first kickoff.
      firstKickoffPending = true;
      lastScoreA = 0;
      lastScoreB = 0;
      // Reset the per-match tally maps here too. These normally clear in
      // resetMatch (MatchCreated/MatchInitialized), but bot/private modes
      // don't reliably emit those — without this, stale demo counts / goal
      // dedup keys / statfeed dedup keys could carry into the next match.
      demosByName = {};
      lastGoalFireByName = {};
      lastStatfeedFire = {};
      updateStateStrip();
      finishKickoffCountdown();
    }
  };
}

function connectControl(){
  const ws = new WebSocket(CONTROL_WS);
  ws.onclose = () => setTimeout(connectControl, 1500);
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "control"){ control = Object.assign(control, msg.payload || {}); applyControl(); }
  };
}

applyControl();
connectGame();
connectControl();
