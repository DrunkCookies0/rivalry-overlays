<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RIVALRY Overlay</title>
<style>
  /* RIVALRY brand typography: Exo 2 italic 700 for display headlines
     (team names, scorer text, eyebrows), Space Mono for numeric/stat
     fields, Roboto for body. Same Google Fonts request as RIVALRY-web. */
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700&family=Roboto:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap');

  /* RLCS-style broadcast overlay. Transparent so it composites in OBS over
     gameplay + player webcams. Designed against a 1920x1080 canvas. */
  :root{
    --blue:#2f7dff;   /* team A accent (Rocket League BLUE team — game color, not brand) */
    --red:#ff7601;    /* team B accent (Rocket League ORANGE team — matches brand USW orange) */
    /* Chrome surfaces — all aligned to the RIVALRY brand palette below. */
    --panel:rgba(19,46,59,.94);     /* jet-black @ .94, used for scorebar + player tags */
    --panel-solid:#132E3B;           /* jet-black solid, used for subbar */
    --bar:#1a3d4d;                   /* surface-1, used for the statfeed bar */
    --ink:#F1EEEE;                   /* white-smoke — primary text */
    --muted:rgba(241,238,238,.65);   /* dimmed white-smoke — secondary text */
    --gold:#F1C40F;                  /* brand gold — goal text + accents */
    --seg-off:#475a6e;               /* unclaimed pip — bright enough to read against panel */
    --shadow:0 10px 34px rgba(0,0,0,.55);

    /* RIVALRY brand tokens (sync with RIVALRY-web/brand.css). Available for
       upcoming brand-pass restyling without re-plumbing CSS variables. */
    --rivalry-yale-blue:#20496F;
    --rivalry-jet-black:#132E3B;
    --rivalry-white-smoke:#F1EEEE;
    --rivalry-surface-1:#1a3d4d;
    --rivalry-surface-2:#20496F;
    --rivalry-gold:#F1C40F;
    --rivalry-teal:#1ABC9C;
    --rivalry-green:#2ECC71;
    --rivalry-red:#E74C3C;

    /* Brand font stacks. Use --font-display for italic display headlines,
       --font-stat for tabular numeric values, --font-body for everything else. */
    --font-display:'Exo 2','Segoe UI',system-ui,sans-serif;
    --font-stat:'Space Mono','SF Mono',Consolas,monospace;
    --font-body:'Roboto','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;
    font-family:var(--font-body);color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  .nums{font-family:var(--font-stat);font-weight:700;font-variant-numeric:tabular-nums;}
  /* Display headline utility used by every italic-uppercase brand label. */
  .headline{font-family:var(--font-display);font-style:italic;font-weight:700;}

  /* ============================ TOP SCOREBAR ============================ */
  .top{position:fixed;top:0;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;}

  /* event title strip sitting above the bar */
  .eventbar{background:var(--rivalry-yale-blue);color:rgba(241,238,238,.85);
    font-family:var(--font-display);font-style:italic;
    font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
    padding:5px 26px;border-radius:0 0 0 0;white-space:nowrap;
    border-bottom:2px solid var(--rivalry-jet-black);box-shadow:var(--shadow);}
  .eventbar b{color:var(--ink);}
  /* State strip — narrow pill that sits BELOW the pip row in the subbar and
     shows match-state takeovers (OVERTIME red pulse, KICKOFF gold). Hidden
     when neither applies. OVERTIME wins if both somehow co-apply. .fading
     keeps the element in layout during the soft fade-out (matches the
     kickoff countdown's exit feel); JS removes .fading after the transition. */
  .state-strip{margin:4px auto 0;padding:3px 18px;
    font-family:var(--font-display);font-style:italic;
    font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    opacity:0;transform:translateY(-4px) scale(.94);
    transition:opacity .4s ease-in,transform .4s ease-in;
    pointer-events:none;display:none;}
  .state-strip.show,
  .state-strip.fading{display:inline-block;}
  .state-strip.show{opacity:1;transform:translateY(0) scale(1);}
  .state-strip.fading{opacity:0;transform:translateY(-4px) scale(.94);}
  .state-strip.kickoff{background:var(--gold);color:#1a1206;}
  .state-strip.overtime{background:var(--red);color:#fff;
    animation:stateStripOT 1.4s ease-in-out infinite;}
  @keyframes stateStripOT{
    0%,100%{box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 rgba(255,118,1,0);}
    50%    {box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 18px rgba(255,118,1,.85);}
  }

  .scorebar{display:flex;align-items:stretch;height:62px;background:var(--panel);
    box-shadow:var(--shadow);}
  /* Both team slots are fixed-width so the clock + score blocks always sit at
     the visual center of the scorebar regardless of team-name length. Names
     longer than the slot truncate with an ellipsis. Budget ~18-20 chars at
     24px Exo 2 italic for clean display; the league should target that. */
  .team{position:relative;display:flex;align-items:center;gap:14px;padding:0 20px;
    width:340px;flex:0 0 340px;
    background:linear-gradient(180deg,var(--rivalry-surface-1),var(--rivalry-jet-black));}
  .team.left{justify-content:flex-end;text-align:right;}
  .team.right{flex-direction:row-reverse;justify-content:flex-end;text-align:left;}
  .team .logo{width:42px;height:42px;flex:0 0 auto;background:center/contain no-repeat;}
  .team .name{flex:1 1 auto;min-width:0;font-family:var(--font-display);font-style:italic;
    font-weight:700;font-size:24px;letter-spacing:.5px;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* colored accent line under the team's name side */
  .team::after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;}
  .team.left::after{background:var(--blue);}
  .team.right::after{background:var(--red);}

  /* GOAL flash — fires when a team scores. Overlays the team block with a
     gold "GOAL" graphic. Multi-stage animation: slab wipes in from the
     score side, text punches in with an overshoot bounce, a diagonal sheen
     sweeps across once, and the gold glow pulses during the hold before
     wiping back out the same side. */
  .goal-flash{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;pointer-events:none;overflow:hidden;
    background:linear-gradient(180deg,#1a1206 0%,#241808 60%,#0e0904 100%);
    transform:scaleX(0);
    transition:transform .32s cubic-bezier(.7,0,.2,1);
    z-index:5;}
  /* Entry origin = score side (so wipe sweeps inward from the score that
     just changed). Exit origin = opposite side, which makes the wipe-out
     continue the same direction it came in (pass-through), not reverse. */
  .team.left  .goal-flash{transform-origin:right center;}
  .team.right .goal-flash{transform-origin:left center;}
  .goal-flash.show{transform:scaleX(1);}
  .team.left  .goal-flash.exiting{transform-origin:left center;transform:scaleX(0);}
  .team.right .goal-flash.exiting{transform-origin:right center;transform:scaleX(0);}
  /* Diagonal sheen sweep — a bright gold streak that translates across the
     slab once after the text lands. Implemented via a ::before pseudo so it
     sits over the bg gradient but under the text. */
  .goal-flash::before{content:"";position:absolute;top:-50%;bottom:-50%;
    width:60%;left:-70%;
    background:linear-gradient(105deg,
      rgba(255,255,255,0)    0%,
      rgba(255,255,255,0)   35%,
      rgba(255,225,140,.55) 50%,
      rgba(255,255,255,0)   65%,
      rgba(255,255,255,0)  100%);
    transform:skewX(-18deg);pointer-events:none;
    opacity:0;}
  .goal-flash.show::before{animation:gfSheen 1.1s .32s cubic-bezier(.45,.05,.55,1) 1;}
  @keyframes gfSheen{
    0%   {left:-70%;opacity:0;}
    15%  {opacity:1;}
    85%  {opacity:1;}
    100% {left:140%;opacity:0;}
  }
  .goal-flash .gf-text{font-family:var(--font-display);font-style:italic;
    font-weight:700;font-size:34px;letter-spacing:6px;text-transform:uppercase;
    color:var(--gold);position:relative;z-index:2;
    text-shadow:0 0 14px rgba(241,196,15,.65),0 2px 0 rgba(0,0,0,.55);
    opacity:0;transform:scale(.4);}
  .goal-flash.show .gf-text{
    animation:gfPunch .55s .22s cubic-bezier(.34,1.56,.64,1) forwards,
              gfPulse 1.2s .85s ease-in-out infinite;}
  @keyframes gfPunch{
    0%   {opacity:0;transform:scale(.4)   translateY(8px);}
    60%  {opacity:1;transform:scale(1.18) translateY(0);}
    78%  {transform:scale(.96) translateY(0);}
    100% {opacity:1;transform:scale(1)    translateY(0);}
  }
  @keyframes gfPulse{
    0%,100% {text-shadow:0 0 14px rgba(241,196,15,.65),0 2px 0 rgba(0,0,0,.55);}
    50%     {text-shadow:0 0 26px rgba(255,220,90,.95),0 0 8px rgba(255,220,90,.55),0 2px 0 rgba(0,0,0,.55);}
  }
  /* Thin team-color bar at the bottom — keeps identity readable under the gold. */
  .goal-flash::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;z-index:3;}
  .team.left  .goal-flash::after{background:var(--blue);}
  .team.right .goal-flash::after{background:var(--red);}

  .score{display:flex;align-items:center;justify-content:center;min-width:64px;
    font-family:var(--font-stat);font-size:38px;font-weight:700;
    font-variant-numeric:tabular-nums;}
  .score.blue{background:var(--blue);color:#fff;}
  .score.red{background:var(--red);color:#fff;}

  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:120px;background:#f4f7fb;color:#11151b;}
  .clock{font-family:var(--font-stat);font-size:30px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;}
  .clock.ot{color:var(--red);}

  /* ===================== KICKOFF CENTER COUNTDOWN (3-2-1-GO) ============== */
  /* Mirrors RL's own kickoff countdown for broadcasts where the in-game HUD
     is hidden via Settings → Interface. Driven by CountdownBegin: 3 → 2 → 1
     each second, then GO! briefly. Each value re-mounts via key change so
     the punch-in animation restarts cleanly. */
  .kickoff-count{position:fixed;top:42%;left:50%;
    font-family:var(--font-display);font-style:italic;font-weight:700;
    font-size:240px;line-height:1;color:#fff;
    text-shadow:0 8px 28px rgba(0,0,0,.8),0 0 24px rgba(255,255,255,.35);
    pointer-events:none;z-index:54;
    opacity:0;transform:translate(-50%,-50%) scale(.94);
    transition:opacity .4s ease-in,transform .4s ease-in;}
  .kickoff-count.show{opacity:1;transform:translate(-50%,-50%) scale(1);
    animation:kickoffPunch .5s cubic-bezier(.34,1.56,.64,1);}
  .kickoff-count.go{color:var(--gold);
    text-shadow:0 8px 28px rgba(0,0,0,.8),0 0 32px rgba(241,196,15,.85);}
  @keyframes kickoffPunch{
    0%   {opacity:0;transform:translate(-50%,-50%) scale(.4);}
    60%  {opacity:1;transform:translate(-50%,-50%) scale(1.15);}
    100% {opacity:1;transform:translate(-50%,-50%) scale(1);}
  }

  /* ===================== FINAL 10s CENTER COUNTDOWN ====================== */
  /* When ≤10s remain in regulation, a big gold number appears upper-center
     of the screen and pulses each second. Hidden during OT (the eventbar's
     OVERTIME treatment carries the urgency cue there). */
  .final10{position:fixed;top:18%;left:50%;transform:translate(-50%,-50%);
    font-family:var(--font-stat);font-weight:700;font-size:180px;line-height:1;
    color:var(--gold);font-variant-numeric:tabular-nums;
    text-shadow:0 0 28px rgba(241,196,15,.75),0 6px 18px rgba(0,0,0,.7);
    pointer-events:none;display:none;z-index:55;
    animation:final10Tick .9s ease-in-out infinite;}
  .final10.show{display:block;}
  @keyframes final10Tick{
    0%,100%{transform:translate(-50%,-50%) scale(1);
            text-shadow:0 0 22px rgba(241,196,15,.55),0 6px 18px rgba(0,0,0,.7);}
    50%    {transform:translate(-50%,-50%) scale(1.08);
            text-shadow:0 0 36px rgba(241,196,15,.95),0 6px 18px rgba(0,0,0,.7);}
  }

  /* under-bar row: region tag + segmented series pips per team */
  .subbar{display:flex;width:100%;justify-content:space-between;
    background:var(--panel-solid);box-shadow:var(--shadow);}
  .subside{display:flex;align-items:center;gap:10px;padding:5px 14px;}
  .subside.right{flex-direction:row-reverse;}
  .tag{font-family:var(--font-display);font-style:italic;
    font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);
    background:rgba(32,73,111,.3);border:1px solid rgba(32,73,111,.45);
    padding:3px 8px;border-radius:0;}
  /* RLCS-style unified pip row: blue team's wins fill from the LEFT,
     red team's wins fill from the RIGHT, gold marker sits on the active
     game's pip in the middle of unclaimed pips. Single centered row
     instead of separate per-team clusters. */
  .pips{display:flex;gap:5px;}
  .seg{width:26px;height:8px;border-radius:2px;background:var(--seg-off);
    box-sizing:border-box;}
  .seg.on.blue{background:var(--blue);box-shadow:0 0 7px var(--blue);}
  .seg.on.red{background:var(--red);box-shadow:0 0 7px var(--red);}
  /* Active-game pip is HOLLOW (matches RLCS): transparent fill + bright outline. */
  .seg.current{background:transparent;border:2px solid var(--ink);
    box-shadow:0 0 4px rgba(241,238,238,.55);}
  /* Series-winning team's claimed pips swap to gold with a strong glow and a
     thin team-color underline so the "they took the series" moment reads
     clearly at a glance, while the team identity stays implicit via position +
     the underline accent. */
  .seg.win{background:var(--gold);box-shadow:0 0 12px var(--gold);}
  .seg.win.blue{box-shadow:0 0 12px var(--gold),inset 0 -3px 0 var(--blue);}
  .seg.win.red{box-shadow:0 0 12px var(--gold),inset 0 -3px 0 var(--red);}

  /* ===================== SIDE PLAYER BOOST TAGS ====================== */
  .col{position:fixed;top:18px;display:flex;flex-direction:column;gap:7px;width:250px;}
  .col.left{left:18px;}
  .col.right{right:18px;}
  .ptag{position:relative;background:var(--panel);box-shadow:var(--shadow);
    padding:8px 12px 10px;overflow:hidden;}
  .ptag .prow{display:flex;align-items:center;gap:10px;}
  .col.right .ptag .prow{flex-direction:row-reverse;text-align:right;}
  .ptag .pname{flex:1;font-family:var(--font-display);font-style:italic;
    font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.5px;}
  .ptag .pboost{font-family:var(--font-stat);font-size:18px;font-weight:700;
    min-width:40px;text-align:center;font-variant-numeric:tabular-nums;}
  /* boost fill line along the bottom of the tag */
  .ptag .fill{position:absolute;left:0;bottom:0;height:4px;width:0;transition:width .12s linear;}
  .col.left .ptag .fill{background:var(--blue);}
  .col.right .ptag .fill{background:var(--red);right:0;left:auto;}
  /* On the active tag the team color is now the background, so the team-color
     fill bar would disappear. Switch it to white-smoke for contrast. */
  .ptag.active .fill{background:var(--ink);}
  /* Spectated player: swap the whole tag background to the team color so
     the highlight reads as identity (not a gold trim), with a soft ambient
     shadow tinted to match. Boost number + name stay legible on the
     saturated team color thanks to white text + dark text shadow on the box. */
  .col.left .ptag.active{background:var(--blue);
    box-shadow:0 8px 24px rgba(47,125,255,.55);}
  .col.right .ptag.active{background:var(--red);
    box-shadow:0 8px 24px rgba(255,118,1,.55);}

  /* Stat-event pop badges — float to the inside of each player tag (right
     side of left col, left side of right col), stack vertically when a
     player picks up multiple events in quick succession, auto-dismiss. */
  .ptag .pops{position:absolute;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:10;}
  .col.left  .ptag .pops{left:calc(100% + 8px);align-items:flex-start;}
  .col.right .ptag .pops{right:calc(100% + 8px);align-items:flex-end;}
  .stat-pop{font-family:var(--font-display);font-style:italic;font-weight:700;
    font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    padding:4px 10px;color:#fff;white-space:nowrap;
    background:var(--bar);
    box-shadow:0 4px 12px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08);
    opacity:0;transform:translateX(-12px) scale(.85);
    transition:opacity .35s ease-out,transform .35s cubic-bezier(.34,1.56,.64,1);}
  .col.right .ptag .stat-pop{transform:translateX(12px) scale(.85);}
  .stat-pop.show{opacity:1;transform:translateX(0) scale(1);}
  .stat-pop.fade{opacity:0;transform:translateX(0) scale(.95);
    transition:opacity .30s ease-in,transform .30s ease-in;}
  /* Color per event type — clearest possible distinction at a glance. */
  .stat-pop.goal{background:var(--gold);color:#1a1206;
    box-shadow:0 4px 14px rgba(241,196,15,.6),inset 0 0 0 1px rgba(0,0,0,.2);}
  .stat-pop.assist{background:#8e5fd9;
    box-shadow:0 4px 12px rgba(142,95,217,.5),inset 0 0 0 1px rgba(255,255,255,.12);}
  .stat-pop.save{background:#1abc9c;
    box-shadow:0 4px 12px rgba(26,188,156,.5),inset 0 0 0 1px rgba(255,255,255,.12);}
  .stat-pop.shot{background:#ff7601;
    box-shadow:0 4px 12px rgba(255,118,1,.5),inset 0 0 0 1px rgba(255,255,255,.12);}
  .stat-pop.demo{background:#e74c3c;
    box-shadow:0 4px 12px rgba(231,76,60,.55),inset 0 0 0 1px rgba(255,255,255,.12);}

  /* ===================== BOTTOM STATFEED BAR ====================== */
  /* While the goal banner is on screen, the focused-player widgets (this
     statfeed bar + the radial boost gauge below) fade out so they don't
     compete visually with the GOAL graphic. JS toggles body.banner-active. */
  .statbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    display:flex;align-items:stretch;height:40px;background:var(--bar);
    box-shadow:var(--shadow);border-radius:4px;overflow:hidden;
    transition:opacity .22s ease-out;}
  body.banner-active .statbar,
  body.banner-active .boostgauge{opacity:0;pointer-events:none;}
  .statbar .who{display:flex;align-items:center;padding:0 20px;
    font-family:var(--font-display);font-style:italic;
    font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:#fff;}
  .statbar .who.blue{background:var(--blue);}
  .statbar .who.red{background:var(--red);}
  .statbar .stat{display:flex;align-items:center;gap:7px;padding:0 18px;
    border-right:1px solid #1c2632;}
  .statbar .stat:last-child{border-right:none;}
  .statbar .stat b{font-family:var(--font-stat);font-size:18px;font-weight:700;
    font-variant-numeric:tabular-nums;}
  .statbar .stat span{font-family:var(--font-display);font-style:italic;
    font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}

  /* ===================== RADIAL BOOST GAUGE ====================== */
  .boostgauge{position:fixed;bottom:22px;right:30px;width:118px;height:118px;
    transition:opacity .22s ease-out;}
  .boostgauge svg{transform:rotate(-90deg);}
  .boostgauge .track{fill:none;stroke:#1a2330;stroke-width:9;}
  .boostgauge .val{fill:none;stroke:var(--blue);stroke-width:9;stroke-linecap:round;
    transition:stroke-dashoffset .12s linear,stroke .2s;}
  .boostgauge .label{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-family:var(--font-stat);font-size:34px;font-weight:700;
    font-variant-numeric:tabular-nums;}

  /* ===================== GOAL BANNER ====================== */
  /* Positioned at y=35% center, 300px tall, fully opaque across the full
     width. This was originally chosen to physically cover RL's in-game
     "X Scored!" text (rendered around y=22-30%). RL has a "Hide In-Game
     HUD" toggle in Settings → Interface that broadcasters should enable —
     pending verification of whether it suppresses the goal celebration
     text too, this overlay coverage remains as a belt-and-suspenders
     fallback. Coexists with the top scorebar which is centered + only
     ~50% wide, so the scorebar still shows above the goal slab.
     Asset spec for the designer is in DESIGN-SPEC.md. */
  .goal-banner{position:fixed;top:35%;left:0;right:0;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60;}
  /* Layer 1: dark slate backing, taller than mid slab, wipes in first/slowest.
     Gives the team-color slab a "mounted on" feel. */
  .goal-banner .gb-back{position:absolute;left:0;right:0;top:50%;height:320px;
    transform:translateY(-50%) scaleX(0);transform-origin:left center;
    transition:transform .42s cubic-bezier(.65,0,.2,1);
    background:linear-gradient(180deg,#11161d 0%,#06080b 50%,#11161d 100%);
    box-shadow:0 0 70px rgba(0,0,0,.85);}
  /* Layer 2: team-color slab — solid base with soft ambient lighting that
     mimics RL's in-game focused-player card. Radial spotlight from top center
     gives a "light from above" feel; bottom subtly darkens for grounding.
     Inner shadow around the perimeter adds plate depth. No hatch / stripes.
     Wipes in 90ms after the backing so the layers stagger. */
  .goal-banner .gb-bg{position:absolute;left:0;right:0;top:50%;height:260px;
    transform:translateY(-50%) scaleX(0);transform-origin:left center;
    transition:transform .34s cubic-bezier(.7,0,.25,1) .09s;
    background-color:var(--goalc);
    background-image:
      radial-gradient(ellipse 70% 90% at 50% -10%,
                      rgba(255,255,255,.32) 0%,
                      rgba(255,255,255,.10) 35%,
                      rgba(255,255,255,0)   65%),
      linear-gradient(180deg,
                      rgba(255,255,255,0) 0%,
                      rgba(255,255,255,0) 55%,
                      rgba(0,0,0,.28)     100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.45),
      inset 0 -2px 0 rgba(0,0,0,.55),
      inset 0 0 80px rgba(0,0,0,.20);}
  /* Layer 3: scorer avatar — square plate with the brand "Rivalry Cut"
     diagonally clipped corners (matches RIVALRY-web's signature shape).
     Always to the left of the scorer text regardless of which team scored.
     RV logo is the placeholder; league API swaps the src later. */
  .goal-banner .gb-avatar{position:relative;flex:0 0 auto;width:140px;height:140px;
    object-fit:contain;padding:24px;
    background:rgba(0,0,0,.45);
    box-shadow:0 6px 22px rgba(0,0,0,.55);
    margin-right:28px;
    clip-path:polygon(
      0 0,
      calc(100% - 18px) 0,
      100% 18px,
      100% 100%,
      18px 100%,
      0 calc(100% - 18px));
    opacity:0;transform:translateY(14px);
    transition:opacity .28s .30s,transform .28s .30s;}
  .goal-banner.show .gb-avatar{opacity:1;transform:translateY(0);}
  /* Layer 4: scorer text + subtitle + badges — vertical stack to the right of
     the avatar. Each row fades + slides in last, sits above all layers. */
  .goal-banner .gb-stack{position:relative;display:flex;flex-direction:column;
    align-items:flex-start;gap:6px;}
  .goal-banner .gb-text{position:relative;
    font-family:var(--font-display);font-style:italic;
    font-size:92px;font-weight:700;letter-spacing:7px;line-height:1;
    text-transform:uppercase;color:#fff;
    text-shadow:0 4px 18px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.95),
                0 2px 0 rgba(0,0,0,.6);
    opacity:0;transform:translateY(14px);
    transition:opacity .28s .30s,transform .28s .30s;white-space:nowrap;}
  /* Subtitle — optional one-liner under the scorer name. Hidden when empty.
     Will be populated from league-API data (e.g., team name, role, milestone). */
  .goal-banner .gb-sub{position:relative;
    font-family:var(--font-display);font-style:italic;
    font-size:22px;font-weight:700;letter-spacing:4px;
    text-transform:uppercase;color:rgba(255,255,255,.85);
    text-shadow:0 2px 8px rgba(0,0,0,.65);
    opacity:0;transform:translateY(8px);
    transition:opacity .28s .38s,transform .28s .38s;display:none;}
  .goal-banner.has-sub .gb-sub{display:block;}
  .goal-banner.show.has-sub .gb-sub{opacity:1;transform:translateY(0);}
  /* Badges row — up to 3 small pills (achievement / role / milestone markers).
     Hidden when empty. Populated from league-API per-player data. */
  .goal-banner .gb-badges{position:relative;display:none;flex-direction:row;gap:8px;
    opacity:0;transform:translateY(8px);
    transition:opacity .28s .46s,transform .28s .46s;}
  .goal-banner.has-badges .gb-badges{display:flex;}
  .goal-banner.show.has-badges .gb-badges{opacity:1;transform:translateY(0);}
  .goal-banner .gb-badge{font-family:var(--font-display);font-style:italic;
    font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    padding:5px 11px;color:#fff;background:rgba(0,0,0,.55);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
  .goal-banner.show .gb-back{transform:translateY(-50%) scaleX(1);}
  .goal-banner.show .gb-bg{transform:translateY(-50%) scaleX(1);}
  .goal-banner.show .gb-text{opacity:1;transform:translateY(0);}
  /* Per-side content delays — orange (from-right) banner wipes mirror-image so
     the slab reaches the content area at a different perceived moment than
     blue. Override these independently to tune each side without affecting
     the other. Defaults match the base (blue) timing; adjust as needed. */
  .goal-banner.from-right .gb-avatar{
    transition:opacity .28s .30s,transform .28s .30s;}
  .goal-banner.from-right .gb-text{
    transition:opacity .28s .30s,transform .28s .30s;}
  .goal-banner.from-right .gb-sub{
    transition:opacity .28s .38s,transform .28s .38s;}
  .goal-banner.from-right .gb-badges{
    transition:opacity .28s .46s,transform .28s .46s;}
  /* Wipe direction follows the scoring team. Blue (left team) is the default:
     wipe in from left, exit to right. Orange (right team) gets .from-right,
     which mirrors both: wipe in from right, exit to left. The .exiting class
     swaps the active origin so the slab collapses off the screen in the
     "outgoing" direction instead of rewinding. */
  .goal-banner.exiting .gb-back,
  .goal-banner.exiting .gb-bg{transform-origin:right center;}
  .goal-banner.from-right .gb-back,
  .goal-banner.from-right .gb-bg{transform-origin:right center;}
  .goal-banner.from-right.exiting .gb-back,
  .goal-banner.from-right.exiting .gb-bg{transform-origin:left center;}
  /* On exit, the text/avatar/extras fade out FASTER than the banner layers
     so they clear before the slab wipes away. Banner layer timings are
     untouched (entry behavior preserved). */
  .goal-banner.exiting .gb-avatar,
  .goal-banner.exiting .gb-text,
  .goal-banner.exiting .gb-sub,
  .goal-banner.exiting .gb-badges{
    transition:opacity .14s ease-in,transform .14s ease-in;}

  /* ===================== STINGER WIPE (masks replay cut in/out) ============ */
  .stinger{position:fixed;inset:0;overflow:hidden;pointer-events:none;display:none;z-index:120;}
  .stinger.run{display:block;}
  .stinger .panel{position:absolute;top:-20%;height:140%;width:170%;left:-210%;transform:skewX(-12deg);}
  .stinger .panel.p1{background:var(--rivalry-yale-blue);}
  .stinger .panel.p2{background:var(--rivalry-jet-black);}
  .stinger .slogo{position:absolute;top:50%;left:50%;width:230px;height:155px;opacity:0;
    transform:translate(-50%,-50%) scale(.55);background:center/contain no-repeat;}
  .stinger.run .panel.p1{animation:stgSweep .9s cubic-bezier(.6,0,.2,1) forwards;}
  .stinger.run .panel.p2{animation:stgSweep .9s cubic-bezier(.6,0,.2,1) .06s forwards;}
  .stinger.run .slogo{animation:stgLogo .9s ease forwards;}
  @keyframes stgSweep{0%{left:-210%;}44%{left:-22%;}56%{left:-22%;}100%{left:170%;}}
  @keyframes stgLogo{0%,30%{opacity:0;transform:translate(-50%,-50%) scale(.55);}
    46%,54%{opacity:1;transform:translate(-50%,-50%) scale(1);}78%,100%{opacity:0;}}

  /* ===================== REPLAY PLAYER CARD ====================== */
  /* Sits in the bottom corner on the scorer's team side during the goal
     replay window. Shows the scorer's name + stats snapshot taken at the
     moment they scored. Subsequent cuts will add: ball-speed (cut 2),
     assist player (cut 3), avatar slot (cut 4). */
  .replay-card{position:fixed;bottom:30px;width:500px;
    background-color:var(--rpc);
    background-image:
      radial-gradient(ellipse 70% 90% at 50% -10%,
                      rgba(255,255,255,.30) 0%,
                      rgba(255,255,255,.08) 35%,
                      rgba(255,255,255,0)   65%),
      linear-gradient(180deg,
                      rgba(255,255,255,0) 0%,
                      rgba(255,255,255,0) 60%,
                      rgba(0,0,0,.30)     100%);
    box-shadow:
      0 12px 32px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.45),
      inset 0 -2px 0 rgba(0,0,0,.55);
    opacity:0;transform:translateY(40px);pointer-events:none;z-index:55;
    transition:opacity .28s ease-out,transform .34s cubic-bezier(.2,.7,.2,1);}
  .replay-card.left{left:30px;}
  .replay-card.right{right:30px;}
  .replay-card.show{opacity:1;transform:translateY(0);}
  .replay-card .rpc-header{display:flex;align-items:center;justify-content:space-between;
    padding:11px 20px;background:rgba(0,0,0,.35);
    border-bottom:1px solid rgba(0,0,0,.5);
    font-family:var(--font-display);font-style:italic;
    font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
    color:rgba(255,255,255,.8);}
  .replay-card .rpc-speed{color:var(--gold);font-variant-numeric:tabular-nums;}
  .replay-card .rpc-speed b{font-family:var(--font-stat);font-size:16px;font-weight:700;
    color:var(--gold);margin-right:4px;}
  .replay-card .rpc-identity{display:flex;align-items:center;gap:18px;
    padding:18px 20px 8px 20px;}
  .replay-card .rpc-avatar{flex:0 0 auto;width:70px;height:70px;
    object-fit:contain;padding:12px;
    background:rgba(0,0,0,.35);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    clip-path:polygon(
      0 0,
      calc(100% - 10px) 0,
      100% 10px,
      100% 100%,
      10px 100%,
      0 calc(100% - 10px));}
  .replay-card .rpc-name{flex:1 1 auto;
    font-family:var(--font-display);font-style:italic;
    font-size:36px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Assister line — hidden when no assist was captured in the window before
     the goal. Sits between the name and the stat grid as a thin one-liner. */
  .replay-card .rpc-assist{padding:0 20px 10px 20px;
    font-family:var(--font-display);font-style:italic;
    font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:rgba(255,255,255,.78);display:none;}
  .replay-card .rpc-assist b{color:#fff;font-weight:700;}
  .replay-card.has-assist .rpc-assist{display:block;}
  .replay-card .rpc-stats{display:grid;grid-template-columns:repeat(5,1fr);
    gap:1px;padding:0 12px 14px 12px;}
  .replay-card .rpc-stat{display:flex;flex-direction:column;align-items:center;
    padding:9px 6px;}
  .replay-card .rpc-stat b{font-family:var(--font-stat);font-size:30px;font-weight:700;
    color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
  .replay-card .rpc-stat span{font-family:var(--font-display);font-style:italic;
    font-size:13px;font-weight:700;letter-spacing:1px;
    color:rgba(255,255,255,.75);margin-top:5px;text-transform:uppercase;}

  #status{position:fixed;top:2px;right:4px;font-size:10px;color:var(--muted);
    font-family:monospace;opacity:.6;}
</style>
</head>
<body>

  <!-- TOP SCOREBAR -->

  <!-- BOTTOM STATFEED -->

  <!-- GOAL BANNER (sweeps across, covers RL's in-game "X Scored" text)
       Layers: back slate → team-color slab w/ ambient lighting → avatar + text.
       Avatar defaults to the RV logo placeholder; league API supplies the

  <div class="goal-banner" id="goalBanner">

  <!-- REPLAY PLAYER CARD (appears during the goal replay; team side via class)
       The avatar slot defaults to the RV logo (shared placeholder for all
       avatar/logo slots); once the league API gives us a per-player URL we
       just swap rpcAvatar.src in showReplayCard. -->
  <div class="replay-card" id="replayCard">
    <div class="rpc-header">

  <!-- STINGER WIPE (fires on replay start + end to mask the cut) -->
  <div class="stinger" id="stinger">
    <div class="panel p2"></div>

    <div class="slogo" id="stingerLogo" style="background-image:url('../assets/rivalry-logo.svg')"></div>
  </div>

<script>
const GAME_WS = "ws://localhost:49124";
const CONTROL_WS = "ws://localhost:49777";

let control = {
  teamA: { name:"BLUE",   logo:"", tag:"EU" },
  teamB: { name:"ORANGE", logo:"", tag:"EU" },
  bestOf: 5,
  series: { a:0, b:0 },
  eventTitle: "RIVALRY",
  // Placeholder subtitle + badges so the goal banner slots render during
  // local testing. League API per-player blob will override these via the
  // `player.subtitle` / `player.badges` fields when wired.
  scorerSubtitle: "RIVALRY PRO LEAGUE • SEASON 1",
  scorerBadges: ["MVP", "TOP SCORER", "HAT TRICK"],
  goalSequence: true,
  goalText: "{SCORER} SCORED!"
};

const $ = (id) => document.getElementById(id);
const GAUGE_CIRC = 2 * Math.PI * 52; // circumference of the boost ring

// demos are not in UpdateState; tally them from StatfeedEvent, keyed by player.
let demosByName = {};
// Match-state flags that drive the eventbar takeover (OVERTIME / KICKOFF).
// updateEventBar() reads these and chooses what to render.
let currentOT = false;
let inCountdown = false;
// OT detection: RL never sets Game.IsOT in bot/private/freeplay matches (43k
// frames across the v0.5.1 capture had zero hits). We keep the IsOT fast path
// for real-RLCS matches and add a clock-direction hysteresis fallback:
//   1. clockHitZero flips true when TimeSeconds first reaches 0 (regulation expiry)
//   2. After that, count consecutive frames where TimeSeconds is increasing
//   3. inferredOT flips true once that count reaches OT_ASCEND_HYSTERESIS
// SECONDARY PATH for "connected mid-OT" (e.g., OBS source refresh during OT,
// WS reconnect mid-OT): if we've never seen a descending frame this match AND
// otAscendingFrames hits the threshold, also infer OT — covers the case where
// we never observe the regulation→0 transition. sawDescent flips true on any
// observed downward step in regulation.
// Conservative threshold of 3 frames (~600ms at RL's 5fps UpdateState cadence)
// because only one OT capture so far — revisit if real-match captures show
// late detection or false positives. Worst case under reordered/jittery frames
// is ~1.2s (one stale-frame reset). Reset on resetMatch / disconnect / match end.
let prevTimeSeconds = 0;
let clockHitZero = false;
let otAscendingFrames = 0;
let inferredOT = false;
let sawDescent = false;
const OT_ASCEND_HYSTERESIS = 3;
// Last GoalScored timestamp — used to pick the kickoff countdown delay
// (post-goal kickoffs have less spawn lead-in than pause/restart kickoffs).
let lastGoalTime = 0;
// Most recent assist event — used to attribute the replay card's "Assist" line
// when a goal lands within ASSIST_WINDOW_MS. RL doesn't include the assister
// in the GoalScored payload, so we correlate via the statfeed event timing.
let lastAssist = { player: null, time: 0 };
const ASSIST_WINDOW_MS = 5000;
// Last goal's shot speed (raw value from RL's GoalScored.GoalSpeed). Captured
// at goal time, surfaced on the replay card. Default NA → MPH; non-NA → KPH
// (region wiring lives in [[team-record-display]] once league API lands).
let lastGoalSpeed = 0;

// Latest snapshot of the players list. We pin this on every UpdateState so
// the replay card can look up the scorer's row at the moment they scored.
let latestPlayers = [];
// Timer that fades the replay card in after the goal banner finishes its
// exit animation, so the two graphics don't overlap on screen.
let replayCardShowTimer = null;
// Timer that defers the banner+flash show until after the in-game goal
// celebration lands. Captured so clearGoalSequence + rapid back-to-back goals
// can cancel a pending show before it pops over podium / next-goal state.
let goalBannerShowTimer = null;
// Stinger fallback timer — ReplayPlaybackEnd is the canonical trigger but RL's
// Stats API drops that event in bot/freeplay/private matches. Same fallback
// pattern as the replay card: fire on a timer; clear if the real event arrives.
let stingerShowTimer = null;
// Tracks when the stinger last fired so CountdownBegin can trigger it
// on demand without double-firing if ReplayPlaybackEnd already played it.
let lastStingerTime = 0;
// GoalScored dedup — RL fires every goal twice ~4-15ms apart; the second
// payload typically lacks GoalSpeed and would zero out our captured speed
// if we ran the pipeline twice. Key on scorer name within GOAL_DEDUP_MS.
const GOAL_DEDUP_MS = 100;
let lastGoalFireByName = {};
// Statfeed dedup — Demolition fires twice per real demo (~800ms apart) which
// over-counts demos and stacks DEMO pops. Key on `${type}|${actor}` within
// STATFEED_DEDUP_MS. Trade-off: chained demos under ~1s would lose the second
// pop; revisit if telemetry shows it.
const STATFEED_DEDUP_MS = 1000;
let lastStatfeedFire = {};
// Last CountdownBegin timestamp so a double-fire (RL quirk after pause) can be
// debounced. Without this, the second CountdownBegin re-anchors the kickoff
// sequence with a different regime than the first, drifting from the in-game 3.
let lastCountdownBeginTime = 0;
const COUNTDOWN_DEBOUNCE_MS = 500;

// RV logo as the universal avatar/logo placeholder for team-, player-, and
// franchise-level slots that don't yet have a real asset. League API can
// override per row when it lands.
const RV_LOGO = "../assets/rivalry-logo.svg";

// Eventbar shows the operator-set event title only — match-state takeovers
// (OVERTIME / KICKOFF) live in the state strip below the pip row.
function updateEventBar(){
  $("eventbar").innerHTML = control.eventTitle || "RIVALRY";
}

// State strip — below the pip row. OVERTIME wins over KICKOFF if both apply.
// On transition to hidden, the .fading class keeps the element in layout
// while opacity animates to 0 (matches the kickoff countdown's soft exit),
// then the styling classes are stripped after the fade completes.
let stateStripFadeTimer = null;
function updateStateStrip(){
  const ss = $("stateStrip");
  if (!ss) return;
  clearTimeout(stateStripFadeTimer);
  ss.classList.remove("fading");
  if (currentOT){
    ss.textContent = "OVERTIME";
    ss.classList.remove("kickoff");
    ss.classList.add("overtime", "show");
  } else if (inCountdown){
    ss.textContent = "KICKOFF";
    ss.classList.remove("overtime");
    ss.classList.add("kickoff", "show");
  } else if (ss.classList.contains("show")){
    ss.classList.remove("show");
    ss.classList.add("fading");
    stateStripFadeTimer = setTimeout(() => {
      ss.classList.remove("fading", "overtime", "kickoff");
    }, 420);
  }
}

function applyControl(){
  updateEventBar();
  $("nameA").textContent = control.teamA.name || "BLUE";
  $("nameB").textContent = control.teamB.name || "ORANGE";
  $("logoA").style.backgroundImage = `url("${control.teamA.logo || RV_LOGO}")`;
  $("logoB").style.backgroundImage = `url("${control.teamB.logo || RV_LOGO}")`;
  $("tagA").textContent = control.teamA.tag || "";
  $("tagB").textContent = control.teamB.tag || "";
  renderPips();
}

// Unified pip row, RLCS-style: bestOf pips total, blue wins fill from the
// LEFT, red wins fill from the RIGHT, neutral/gold marker on the GEOMETRIC
// CENTER pip representing the active game. Pinned to center so the marker
// never drifts as wins accumulate; hidden when the series is decided or
// when a claimed pip covers the center slot.
function renderPips(){
  const total = Math.max(1, control.bestOf | 0);
  // For odd bestOf (BO3/5/7), threshold = (N+1)/2. For even (shouldn't
  // happen in RL but defensive), require strict majority.
  const oddThresh = Math.ceil((total + 1) / 2);
  // Cap each team's wins at the threshold so an out-of-spec score from the
  // control bus can't push one cluster into the other's pips. If a team has
  // already clinched the series, the other team's render-side wins are
  // additionally clamped to (total - oddThresh) so the loser's cluster
  // can't overlap the winner's claimed pips.
  let blueWins = Math.min(Math.max(0, control.series.a | 0), oddThresh);
  let redWins  = Math.min(Math.max(0, control.series.b | 0), oddThresh);
  if (blueWins >= oddThresh) redWins  = Math.min(redWins,  total - oddThresh);
  if (redWins  >= oddThresh) blueWins = Math.min(blueWins, total - oddThresh);
  const seriesDecided = blueWins >= oddThresh || redWins >= oddThresh;

  // Active-game pip is always the geometric center. Hidden when:
  //   - series is decided (no more games to play)
  //   - center pip is already claimed by either team
  const centerIdx = Math.floor(total / 2);
  const centerClaimed = centerIdx < blueWins || centerIdx >= total - redWins;
  const currentPip = (!seriesDecided && !centerClaimed) ? centerIdx : -1;

  const el = $("pips");
  el.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const d = document.createElement("div");
    let cls = "seg";
    if (i < blueWins) {
      cls += " on blue";
      if (seriesDecided && blueWins >= oddThresh) cls += " win";
    } else if (i >= total - redWins) {
      cls += " on red";
      if (seriesDecided && redWins >= oddThresh) cls += " win";
    } else if (i === currentPip) {
      cls += " current";
    }
    d.className = cls;
    el.appendChild(d);
  }
}

function fmtClock(sec, isOT){
  sec = Math.max(0, Math.round(sec || 0));
  const m = Math.floor(sec/60), s = sec%60;
  const t = (isOT ? "+" : "") + m + ":" + String(s).padStart(2,"0");
  return t;
}

// Find the currently spectated player across the field shapes the API may use.
// RL's Stats API sends Game.Target as an OBJECT ({Name, Shortcut, TeamNum})
// when bHasTarget is true. Older API revisions also showed it as a bare
// string. We accept either and pull the player name out.
function getTargetName(data){
  const g = data.Game || {};
  const candidates = [
    data.Target, g.Target, data.Spectated,
    data.Spectator, g.Spectator,
  ];
  for (const t of candidates) {
    if (!t) continue;
    if (typeof t === "string") return t;
    if (typeof t === "object") return t.Name || t.PlayerName || null;
  }
  return null;
}

// Sticky focus: RL's Stats API only includes Game.Target in some frames
// during director cam (~63% of frames). Without persistence the statbar +
// radial gauge flicker on/off every other frame. We hold the last known
// target for FOCUS_STICKY_MS so the UI feels solid; in that window we
// re-look-up the player by name in the current Players array so live
// stats (boost, goals) still update.
const FOCUS_STICKY_MS = 500;
let lastFocusName = null;
let lastFocusTime = 0;

// Boost cache: RL only re-sends a player's Boost field when it changes. If
// we showed "--" on any frame missing the field, the side rails would
// flicker. Cache the last value per name; we only show "--" if we've never
// seen a real value for that player.
const lastBoostByName = {};

function onUpdateState(data){
  const game = data.Game || {};
  const teams = game.Teams || [];
  if (teams[0]) $("scoreA").textContent = teams[0].Score ?? 0;
  if (teams[1]) $("scoreB").textContent = teams[1].Score ?? 0;
  // Hybrid OT detector. Fast path is RL's explicit Game.IsOT — that's the
  // truth when it's set. But in bot/private/freeplay matches RL never sets it,
  // so we infer OT from a clock-direction breadcrumb: once the regulation
  // clock has touched 0, count consecutive frames where TimeSeconds is going
  // UP. Confirms OT after OT_ASCEND_HYSTERESIS ascending frames so a flicker
  // doesn't trigger a false positive. Treats missing/null TimeSeconds as a
  // no-op rather than coercing to 0 (would latch clockHitZero mid-regulation).
  const hasTime = typeof game.TimeSeconds === "number";
  const rawTime = hasTime ? game.TimeSeconds : prevTimeSeconds;
  if (hasTime) {
    if (rawTime <= 0.5) clockHitZero = true;
    // Track descents so a mid-OT reconnect (never observed regulation→0) can
    // still infer OT from "consistent ascending frames and no descent ever seen".
    if (rawTime + 0.05 < prevTimeSeconds) {
      sawDescent = true;
      otAscendingFrames = 0;
    } else if (rawTime > prevTimeSeconds + 0.05) {
      otAscendingFrames++;
      if (otAscendingFrames >= OT_ASCEND_HYSTERESIS &&
          (clockHitZero || !sawDescent)) {
        inferredOT = true;
      }
    }
    prevTimeSeconds = rawTime;
  }
  const apiOT = !!(game.IsOT || game.isOT);
  const isOT = apiOT || inferredOT;
  const clk = $("clock");
  const t = Math.round(rawTime);
  clk.textContent = fmtClock(rawTime, isOT);
  clk.classList.toggle("ot", isOT);
  // Final 10s of regulation — show big center-screen number, hidden during
  // OT. Gated on !clockHitZero so the moment regulation expires the counter
  // stops, even during the ~3-frame ascend window before OT is confirmed.
  const showFinal10 = !isOT && !clockHitZero && t > 0 && t <= 10;
  const f10 = $("final10");
  if (showFinal10){
    f10.textContent = String(t);
    f10.classList.add("show");
  } else {
    f10.classList.remove("show");
  }
  // OT state drives the eventbar takeover. Tracked module-side so the
  // CountdownBegin handler can re-evaluate eventbar without a fresh snapshot.
  if (isOT !== currentOT){ currentOT = isOT; updateStateStrip(); }

  const players = data.Players || [];
  latestPlayers = players;
  renderBoost($("colA"), players.filter(p => p.TeamNum === 0), "blue");
  renderBoost($("colB"), players.filter(p => p.TeamNum === 1), "red");

  // focused player -> statfeed + radial boost (with sticky-focus persistence)
  const targetName = getTargetName(data);
  let target = targetName ? players.find(p => p.Name === targetName) : null;
  const now = performance.now();
  if (target) {
    lastFocusName = target.Name;
    lastFocusTime = now;
  } else if (lastFocusName && now - lastFocusTime < FOCUS_STICKY_MS) {
    target = players.find(p => p.Name === lastFocusName) || null;
  }
  updateFocus(target);
  markActive(target ? target.Name : null);
}

function renderBoost(col, players, cls){
  // keep DOM stable to avoid flicker; rebuild only if roster size changed
  if (col.childElementCount !== players.length){
    col.innerHTML = "";
    players.forEach(() => {
      const t = document.createElement("div");
      t.className = "ptag";
      t.innerHTML = `<div class="prow"><span class="pname"></span><span class="pboost nums"></span></div><div class="fill"></div><div class="pops"></div>`;
      col.appendChild(t);
    });
  }
  players.forEach((p, i) => {
    const tag = col.children[i];
    if (typeof p.Boost === "number") lastBoostByName[p.Name] = p.Boost;
    const boost = lastBoostByName[p.Name];
    const hasBoost = typeof boost === "number";
    tag.querySelector(".pname").textContent = p.Name || "";
    tag.querySelector(".pboost").textContent = hasBoost ? boost : "--";
    tag.querySelector(".fill").style.width = (hasBoost ? boost : 0) + "%";
    tag.dataset.name = p.Name || "";
  });
}

function markActive(name){
  document.querySelectorAll(".ptag").forEach(t =>
    t.classList.toggle("active", !!name && t.dataset.name === name));
}

function updateFocus(p){
  const bar = $("statbar"), gauge = $("boostgauge");
  if (!p){ bar.style.display = "none"; gauge.style.display = "none"; return; }
  bar.style.display = "flex"; gauge.style.display = "block";

  const blue = p.TeamNum === 0;
  $("sbWho").textContent = p.Name || "";
  $("sbWho").className = "who " + (blue ? "blue" : "red");
  $("sbGoals").textContent   = p.Goals   ?? 0;
  $("sbShots").textContent   = p.Shots   ?? 0;
  $("sbAssists").textContent = p.Assists ?? 0;
  $("sbSaves").textContent   = p.Saves   ?? 0;
  $("sbDemos").textContent   = demosByName[p.Name] || 0;

  // Same boost cache as renderBoost so the radial gauge doesn't flicker
  // to 0 / "--" on frames where RL omits the Boost field.
  const cachedBoost = lastBoostByName[p.Name];
  const haveBoost = typeof p.Boost === "number" || typeof cachedBoost === "number";
  const boost = typeof p.Boost === "number" ? p.Boost
              : typeof cachedBoost === "number" ? cachedBoost : 0;
  const val = $("gaugeVal");
  val.style.stroke = blue ? "var(--blue)" : "var(--red)";
  val.style.strokeDasharray = GAUGE_CIRC;
  val.style.strokeDashoffset = GAUGE_CIRC * (1 - boost/100);
  $("gaugeLabel").textContent = haveBoost ? boost : "--";
}

/* ---- Goal sequence -------------------------------------------------------
 * GoalScored            -> show custom banner (covers RL's in-game "X Scored")
 * ReplayPlaybackStart   -> hide banner (real cut into replay)
 * ReplayWillEnd         -> hide replay card (~3s pre-warning)
 * ReplayPlaybackEnd     -> fire stinger wipe (mask cut back to live)
 * CountdownBegin /
 * RoundStarted          -> clear everything for kickoff
 * Bot/freeplay/private matches don't emit Replay* events — fallback timers
 * in onGoalScored drive the same sequence and get cancelled when (and if)
 * the real events arrive.
 * ------------------------------------------------------------------------- */
let bannerTimer = null;
let bannerExitTimer = null;

function fillGoalText(tpl, scorer, teamName){
  return String(tpl || "{SCORER} SCORED!")
    .replace(/\{SCORER\}/g, (scorer || "").toUpperCase())
    .replace(/\{scorer\}/g, scorer || "")
    .replace(/\{TEAM\}/g, (teamName || "").toUpperCase())
    .replace(/\{team\}/g, teamName || "");
}

function showGoalBanner(scorer, teamNum){
  const blue = teamNum === 0;
  const teamName = blue ? control.teamA.name : control.teamB.name;
  document.documentElement.style.setProperty("--goalc", blue ? "var(--blue)" : "var(--red)");
  $("gbText").textContent = fillGoalText(control.goalText, scorer, teamName);
  // Subtitle + badges — populated from per-player league data (when wired).
  // Look up the scorer in the latest snapshot for any attached metadata. Both
  // slots stay hidden until real data lands.
  applyGoalBannerExtras(scorer, teamNum);
  // Strip the .exiting class from any previous goal cycle so the wipe-in
  // is anchored at the correct side. Apply .from-right when the orange
  // (right-side) team scored, so the banner wipes in from their side.
  const b = $("goalBanner");
  clearTimeout(bannerExitTimer);
  b.classList.remove("exiting");
  b.classList.toggle("from-right", teamNum === 1);
  b.classList.add("show");
  // Fade out the focused-player widgets (statbar + radial gauge) so they
  // don't compete with the GOAL banner. The body class drives the CSS;
  // hideGoalBanner removes it and they fade back in.
  document.body.classList.add("banner-active");
  clearTimeout(bannerTimer);
  // Measured against the LOS Twitch reference (2026-05-25 08-40-55.mp4):
  //   LOS banner wipe-in starts T+2.1s after the goal moment
  //   LOS banner gone T+5.5s after the goal moment
  //   Total on-screen: ~3.4 seconds
  // Our wipe-in + wipe-out animations are ~0.56s combined, so 2940ms of
  // "visible" middle would exactly match LOS's total. Bot match goal
  // sequences are shorter than LOS's competitive matches though, so
  // 2500ms keeps us in roughly the right phase without dragging into
  // kickoff prep in shorter sequences. Tune if needed.
  bannerTimer = setTimeout(hideGoalBanner, 3000);
}
function hideGoalBanner(){
  // Enter from left, exit to right (mirrored for orange goals).
  // Adding .exiting and removing .show in the same tick lets the browser
  // batch them into one paint, which can skip the transform-origin flip
  // and make the wipe-out look like a normal rewind. The force-reflow
  // (`void b.offsetWidth`) commits the .exiting origin change as its own
  // paint first so the scaleX collapse animates against the new origin.
  // The .exiting class is then cleaned up after the transition finishes
  // (~600ms for the slowest layer), leaving the banner ready for the
  // next goal's wipe-in.
  const b = $("goalBanner");
  b.classList.add("exiting");
  void b.offsetWidth;
  b.classList.remove("show");
  clearTimeout(bannerExitTimer);
  bannerExitTimer = setTimeout(() => b.classList.remove("exiting"), 600);
  clearTimeout(bannerTimer);
  bannerTimer = null;
  // Bring the focused-player widgets back. The CSS transition fades them
  // in over .22s so the swap doesn't pop.
  document.body.classList.remove("banner-active");
}

// Kickoff 3-2-1-GO center-screen countdown. Fires on CountdownBegin so
// broadcasts with RL's in-game HUD hidden still see a countdown.
//
// Two delay regimes — RL fires CountdownBegin at different lead times
// relative to the visible "3":
//   - FRESH kickoff (pause/resume, match start): long spawn lead-in
//   - POST-GOAL kickoff: shorter lead-in (celebration already covered it)
// We pick the delay by checking if a goal fired within KICKOFF_POST_GOAL_WINDOW_MS.
//
// GO! is anchored to RoundStarted (the actual ball-drop moment) instead of
// a timer, because RoundStarted reliably arrives right around when the
// in-game "GO" would appear. Without this, RoundStarted's cleanup was
// killing the GO! timer before it fired.
// Three regimes — the very first kickoff after MatchCreated has the longest
// lead-in (full intro / players-spawning sequence). Subsequent fresh kickoffs
// (pause/resume) are shorter. Post-goal kickoffs are the shortest (the goal
// celebration already covered most of the spawn time).
// NOTE: tuned against bot matches; human matches may have different lead-in
// timing — re-verify against a real human game and adjust if drift returns.
const KICKOFF_FIRST_DELAY_MS     = 750;
const KICKOFF_FRESH_DELAY_MS     = 2500;
const KICKOFF_POSTGOAL_DELAY_MS  = 900;
const KICKOFF_POST_GOAL_WINDOW_MS = 15000;
const KICKOFF_GO_HOLD_MS = 1300;
let firstKickoffPending = true;
let kickoffTimers = [];
// Set when fireKickoffGo runs; prevents the fallback timer and RoundStarted
// from both showing GO! and producing a flicker. Cleared on finish.
let kickoffGoShown = false;
function showKickoffValue(text, isGo){
  const el = $("kickoffCount");
  if (!el) return;
  el.classList.remove("show", "go");
  void el.offsetWidth;
  el.textContent = text;
  el.classList.add("show");
  if (isGo) el.classList.add("go");
}
function startKickoffCountdown(){
  finishKickoffCountdown();
  const postGoal = (performance.now() - lastGoalTime) < KICKOFF_POST_GOAL_WINDOW_MS;
  const delay = firstKickoffPending ? KICKOFF_FIRST_DELAY_MS
              : postGoal             ? KICKOFF_POSTGOAL_DELAY_MS
              :                        KICKOFF_FRESH_DELAY_MS;
  firstKickoffPending = false;
  ["3", "2", "1"].forEach((text, i) => {
    kickoffTimers.push(setTimeout(() => showKickoffValue(text, false),
      delay + i * 1000));
  });
  // Fallback GO! in case RoundStarted never arrives (e.g., spectator API quirk).
  kickoffTimers.push(setTimeout(fireKickoffGo, delay + 3000));
}
// Called from RoundStarted (or as a fallback timer). Idempotent — if GO!
// already fired this cycle (e.g., fallback timer ran first), do nothing so
// RoundStarted doesn't re-trigger and cause a flicker.
function fireKickoffGo(){
  if (kickoffGoShown) return;
  kickoffGoShown = true;
  kickoffTimers.forEach(clearTimeout);
  kickoffTimers = [];
  showKickoffValue("GO!", true);
  kickoffTimers.push(setTimeout(finishKickoffCountdown, KICKOFF_GO_HOLD_MS));
}
function finishKickoffCountdown(){
  kickoffTimers.forEach(clearTimeout);
  kickoffTimers = [];
  kickoffGoShown = false;
  const el = $("kickoffCount");
  if (el) el.classList.remove("show", "go");
}

// Populate the goal banner's optional subtitle + badges slots. Data sources:
//   1. League API per-player blob (future) — `subtitle` string + `badges` array
//   2. Manual override on control state (`control.scorerSubtitle`, `control.scorerBadges`)
// Both slots stay hidden when no data is supplied. Up to 3 badges max.
function applyGoalBannerExtras(scorer, teamNum){
  const b = $("goalBanner");
  const player = (latestPlayers || []).find(p => p && p.Name === scorer) || {};
  const subtitle = player.subtitle || control.scorerSubtitle || "";
  const badges   = (player.badges && player.badges.length ? player.badges
                  : (control.scorerBadges || [])).slice(0, 3);
  if (subtitle){
    $("gbSub").textContent = subtitle;
    b.classList.add("has-sub");
  } else {
    b.classList.remove("has-sub");
  }
  const host = $("gbBadges");
  host.innerHTML = "";
  if (badges.length){
    badges.forEach(label => {
      const el = document.createElement("span");
      el.className = "gb-badge";
      el.textContent = label;
      host.appendChild(el);
    });
    b.classList.add("has-badges");
  } else {
    b.classList.remove("has-badges");
  }
}

// Scoreboard GOAL flash — gold "GOAL" graphic over the scoring team's name
// block. Synced with the goal banner so both reactions read as one moment.
let goalFlashTimers = { A:null, B:null };
let goalFlashExitTimers = { A:null, B:null };
function showGoalFlash(teamNum){
  const which = teamNum === 0 ? "A" : "B";
  const el = $("goalFlash" + which);
  if (!el) return;
  // Clean up any pending exit-cleanup from a previous flash before we re-show.
  clearTimeout(goalFlashExitTimers[which]);
  el.classList.remove("exiting");
  // Force reflow so re-trigger during a previous flash re-animates cleanly.
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(goalFlashTimers[which]);
  goalFlashTimers[which] = setTimeout(() => hideGoalFlash(teamNum), 2800);
}
function hideGoalFlash(teamNum){
  const which = teamNum === 0 ? "A" : "B";
  const el = $("goalFlash" + which);
  if (!el) return;
  el.classList.add("exiting");
  void el.offsetWidth;
  el.classList.remove("show");
  clearTimeout(goalFlashExitTimers[which]);
  goalFlashExitTimers[which] = setTimeout(() => el.classList.remove("exiting"), 400);
}

function playStinger(){
  const s = $("stinger");
  if (!s) return;
  lastStingerTime = performance.now();
  s.classList.remove("run");
  void s.offsetWidth;        // force reflow so the animation restarts
  s.classList.add("run");
  clearTimeout(playStinger._t);
  playStinger._t = setTimeout(() => s.classList.remove("run"), 950);
}

// Delay (ms) between RL firing GoalScored and the banner starting to wipe in.
// Lets the in-game celebration land first, then the broadcast graphic sweeps
// in over it. Bump up for more breathing room, down for snappier.
const GOAL_BANNER_DELAY_MS = 750;

function onGoalScored(data){
  if (!control.goalSequence) return;     // let the in-game text show if disabled
  const scorer = (data.Scorer && data.Scorer.Name) || "";
  const teamNum = (data.Scorer && data.Scorer.TeamNum);
  // Don't render a "name-less" banner. Some game modes / own-goals fire
  // GoalScored with an empty Scorer.Name (also fires on every ReplayPlaybackEnd
  // as a phantom payload). Skip — and skip BEFORE the dedup map update so the
  // phantom doesn't poison the last-fire key.
  if (!scorer) return;
  // Dedup the double-fire RL emits per real goal (~4-15ms apart; second payload
  // typically lacks GoalSpeed and would zero out lastGoalSpeed if we re-ran the
  // pipeline). If the late payload carries a GoalSpeed and the earlier one was
  // 0, adopt it; otherwise drop the duplicate.
  const now = performance.now();
  const prevFire = lastGoalFireByName[scorer] || 0;
  if (now - prevFire < GOAL_DEDUP_MS) {
    const lateSpeed = Number(data.GoalSpeed) || 0;
    if (lateSpeed > 0 && lastGoalSpeed === 0) lastGoalSpeed = lateSpeed;
    return;
  }
  lastGoalFireByName[scorer] = now;
  lastGoalTime = now;
  lastGoalSpeed = Number(data.GoalSpeed) || 0;
  spawnStatPop(scorer, "goal", "GOAL");
  // Cancel any in-flight pending banner+flash from a previous goal so a
  // rapid back-to-back doesn't double-pop.
  clearTimeout(goalBannerShowTimer);
  goalBannerShowTimer = setTimeout(() => {
    showGoalBanner(scorer, teamNum);
    showGoalFlash(teamNum);
  }, GOAL_BANNER_DELAY_MS);
  // Schedule the replay card to fade in once the goal banner has wiped
  // out. Replay events (ReplayPlaybackStart/End) don't fire in every game
  // mode, so we drive the card off the same trigger as the banner with
  // a longer delay. onGoalReplayStart/End / clearGoalSequence cancel this
  // if RL does fire those.
  clearTimeout(replayCardShowTimer);
  replayCardShowTimer = setTimeout(
    () => showReplayCard(scorer, teamNum),
    GOAL_BANNER_DELAY_MS + 3600
  );
  // Same fallback pattern for the stinger — ReplayPlaybackEnd doesn't fire in
  // bot/freeplay/private matches, so trigger the wipe on a timer ~9s after
  // the replay card lands (13.75s after the goal). onGoalReplayEnd /
  // clearGoalSequence cancel this if the real event arrives so we don't
  // double-fire. CountdownBegin also fires the stinger early if the fallback
  // hasn't run yet (lastGoalTime > lastStingerTime check).
  clearTimeout(stingerShowTimer);
  stingerShowTimer = setTimeout(
    () => { hideReplayCard(); playStinger(); },
    GOAL_BANNER_DELAY_MS + 13000
  );
}
function onGoalReplayStart(){
  if (!control.goalSequence) return;
  // Real replay started. Cancel the stinger fallback only — the replay card
  // show timer is INTENTIONALLY left alive so the card still appears at its
  // scheduled moment (after the banner has exited), which lines up with the
  // replay playback. RL fires ReplayPlaybackStart ~1-3s after the goal, well
  // before the replay-card show timer at GOAL_BANNER_DELAY_MS + 3600ms.
  clearTimeout(stingerShowTimer);
  hideGoalBanner();
}
// RL fires ReplayWillEnd ~3s before ReplayPlaybackEnd. Pre-hide the replay
// card so it's gone before the cut back to live, leaving the stinger (fired
// on ReplayPlaybackEnd) to mask the cut itself. Also cancels the show timer
// in case the replay was so short that the timer hasn't fired yet — without
// this, the card could pop AFTER the replay ended.
function onGoalReplayWillEnd(){
  if (!control.goalSequence) return;
  clearTimeout(replayCardShowTimer);
  hideReplayCard();
}
function onGoalReplayEnd(){
  if (!control.goalSequence) return;
  // Real event arrived — cancel both fallback timers so we don't fire twice.
  clearTimeout(stingerShowTimer);
  clearTimeout(replayCardShowTimer);
  hideReplayCard();
  // Stinger wipe masks the cut from replay back to live (kickoff reset).
  playStinger();
}
function clearGoalSequence(){
  // Cancel every in-flight timer that drives a piece of the goal sequence so
  // a match boundary / disconnect / next goal can't leave any element stuck
  // on screen. NOTE: deliberately does NOT touch the stinger's .run class or
  // its self-clearing timer — clearGoalSequence is often called RIGHT AFTER
  // playStinger() (CountdownBegin / RoundStarted backstop path), and stripping
  // .run synchronously would cancel the stinger before the browser paints it.
  // playStinger owns its own 950ms teardown; let the animation complete.
  clearTimeout(goalBannerShowTimer);
  clearTimeout(replayCardShowTimer);
  clearTimeout(stingerShowTimer);
  clearTimeout(bannerTimer);
  clearTimeout(bannerExitTimer);
  clearTimeout(goalFlashTimers.A);
  clearTimeout(goalFlashTimers.B);
  clearTimeout(goalFlashExitTimers.A);
  clearTimeout(goalFlashExitTimers.B);
  hideGoalBanner();
  hideReplayCard();
  // Force-clear the GOAL flashes if either was visible.
  document.querySelectorAll(".goal-flash").forEach(el => {
    el.classList.remove("show", "exiting");
  });
  document.body.classList.remove("banner-active");
}

// Look up the scorer's row in the latest UpdateState snapshot and paint
// their stats into the card. Team color drives both the card background
// and which corner it sits in (left for blue, right for orange).
function showReplayCard(scorerName, teamNum){
  const blue = teamNum === 0;
  const p = latestPlayers.find(x => x && x.Name === scorerName) || {};
  document.documentElement.style.setProperty("--rpc", blue ? "var(--blue)" : "var(--red)");
  const card = $("replayCard");
  card.classList.remove("left", "right");
  card.classList.add(blue ? "left" : "right");
  $("rpcName").textContent = scorerName || "-";
  $("rpcGoals").textContent   = p.Goals   ?? 0;
  $("rpcAssists").textContent = p.Assists ?? 0;
  $("rpcSaves").textContent   = p.Saves   ?? 0;
  $("rpcShots").textContent   = p.Shots   ?? 0;
  $("rpcDemos").textContent   = demosByName[scorerName] ?? 0;
  // Goal speed — RL's GoalScored.GoalSpeed comes in KPH (matches the in-game
  // post-goal display unit). Convert to MPH for NA broadcasts: MPH = KPH × 0.621371.
  // When league API supplies match region, the unit will flip for non-NA matches.
  const speedEl = $("rpcSpeed");
  if (lastGoalSpeed > 0){
    const mph = Math.round(lastGoalSpeed * 0.621371);
    speedEl.innerHTML = `<b>${mph}</b>MPH`;
  } else {
    speedEl.textContent = "";
  }
  // Assister attribution — only show if an assist statfeed fired in the
  // window before this goal AND the assister isn't the scorer themselves.
  const recentAssist = lastAssist.player &&
                       lastAssist.player !== scorerName &&
                       (performance.now() - lastAssist.time) < ASSIST_WINDOW_MS;
  if (recentAssist){
    $("rpcAssister").textContent = lastAssist.player;
    card.classList.add("has-assist");
  } else {
    card.classList.remove("has-assist");
  }
  card.classList.add("show");
}

function hideReplayCard(){
  const c = $("replayCard");
  c.classList.remove("show", "has-assist");
  // Scrub the assister text so a rapid next goal doesn't flash the previous
  // assister's name on the new card for one frame before applyControl re-paints.
  const a = $("rpcAssister");
  if (a) a.textContent = "";
}

function onStatfeed(data){
  const type = (data.Type || data.EventName || data.Event || "").toString().toLowerCase();
  // Pull the "main actor" name across the field-name variants RL has used.
  const mainName = (data.MainPlayer && data.MainPlayer.Name) ||
                   (data.MainTarget && data.MainTarget.Name) ||
                   data.MainPlayer || data.Name;
  // Dedup the double-fire on Demolition statfeeds (~800ms apart in the live
  // capture). Currently only applied to the demo branch — other types
  // (Save/Assist/Shot) don't show consistent doubles in our captures. If they
  // start, generalize this wrapper. Trade-off: chained demo-into-kickoff-demo
  // under STATFEED_DEDUP_MS would lose the second pop — revisit if telemetry
  // shows that pattern.
  // Demos: attacker is the actor; also tally for the bottom statfeed counter.
  if (type.includes("demo") || type.includes("demolish")){
    const attacker = (data.Attacker && data.Attacker.Name) || mainName;
    if (attacker){
      const key = "demo|" + attacker;
      const now = performance.now();
      if (now - (lastStatfeedFire[key] || 0) < STATFEED_DEDUP_MS) return;
      lastStatfeedFire[key] = now;
      demosByName[attacker] = (demosByName[attacker] || 0) + 1;
      spawnStatPop(attacker, "demo", "DEMO");
    }
    return;
  }
  if (type.includes("save"))   { if (mainName) spawnStatPop(mainName, "save",   "SAVE");   return; }
  if (type.includes("assist")) {
    if (mainName) {
      spawnStatPop(mainName, "assist", "ASSIST");
      // Remember the most recent assist so the replay card can attribute it.
      lastAssist = { player: mainName, time: performance.now() };
    }
    return;
  }
  if (type.includes("shot"))   { if (mainName) spawnStatPop(mainName, "shot",   "SHOT");   return; }
  // Goal pops are spawned from onGoalScored (the canonical goal trigger) to
  // avoid double-popping if RL also fires a Goal-typed StatfeedEvent.
}

// Add a transient color-coded badge into the matching player's .ptag.
// Stacks vertically if multiple events land in quick succession.
function spawnStatPop(playerName, cls, label){
  const tag = document.querySelector('.ptag[data-name="' + cssEscape(playerName) + '"]');
  if (!tag) return;
  const host = tag.querySelector(".pops");
  if (!host) return;
  const pop = document.createElement("div");
  pop.className = "stat-pop " + cls;
  pop.textContent = label;
  host.appendChild(pop);
  // Force reflow so the show transition runs from the initial state.
  void pop.offsetWidth;
  pop.classList.add("show");
  setTimeout(() => {
    pop.classList.remove("show");
    pop.classList.add("fade");
    setTimeout(() => pop.remove(), 320);
  }, 2200);
}
// Minimal CSS.escape polyfill for the rare case it's not present in the
// Electron build's renderer; player names can contain quotes/brackets.
function cssEscape(s){
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\]/g, "\\$&");
}

function resetMatch(){
  demosByName = {};
  firstKickoffPending = true;
  // Clear per-match state that could bleed into the next match if matches
  // start back-to-back within the assist/goal-dedup windows.
  lastAssist = { player: null, time: 0 };
  lastGoalSpeed = 0;
  lastGoalTime = 0;
  lastStingerTime = 0;
  lastGoalFireByName = {};
  lastStatfeedFire = {};
  lastCountdownBeginTime = 0;
  // OT detector — clear so a new match starts in regulation mode regardless
  // of where the previous one ended.
  prevTimeSeconds = 0;
  clockHitZero = false;
  otAscendingFrames = 0;
  inferredOT = false;
  sawDescent = false;
}

function connectGame(){
  const ws = new WebSocket(GAME_WS);
  ws.onopen = () => $("status").textContent = "live";
  ws.onclose = () => {
    $("status").textContent = "reconnecting";
    // Tear down any in-flight goal sequence so a dropped WS during a goal
    // doesn't leave the banner / replay card / stinger pinned on screen
    // for the rest of the broadcast.
    clearGoalSequence();
    finishKickoffCountdown();
    inCountdown = false;
    currentOT = false;
    // Reset OT detector so the reconnect doesn't re-fire OVERTIME based on
    // stale state from before the drop. sawDescent stays false so if we
    // reconnect mid-OT, the "no descent ever observed" path can still infer.
    clockHitZero = false;
    otAscendingFrames = 0;
    inferredOT = false;
    prevTimeSeconds = 0;
    sawDescent = false;
    updateStateStrip();
    setTimeout(connectGame, 1500);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    const ev = (msg.event || "").toString();
    const data = msg.data || {};
    if (ev === "UpdateState") onUpdateState(data);
    else if (ev === "GoalScored") onGoalScored(data);
    // Canonical RL replay event names. Legacy GoalReplayStart/End names that
    // never actually fired in real matches were the cause of the stinger-late
    // bug pre-0.5.2; the bot/freeplay fallback timers in onGoalScored remain
    // as the safety net for modes that drop replay events entirely.
    else if (ev === "ReplayPlaybackStart") onGoalReplayStart();
    else if (ev === "ReplayWillEnd")       onGoalReplayWillEnd();
    else if (ev === "ReplayPlaybackEnd")   onGoalReplayEnd();
    else if (ev === "CountdownBegin") {
      // Debounce — RL sometimes fires CountdownBegin twice after pause/resume,
      // and the second would re-anchor the kickoff timer with a different
      // regime than the first (drifts the visible 3-2-1 from the in-game one).
      const now = performance.now();
      if (now - lastCountdownBeginTime < COUNTDOWN_DEBOUNCE_MS) return;
      lastCountdownBeginTime = now;
      // If a goal happened since the last stinger fired, play the stinger NOW
      // to mask the cut to kickoff. Then clearGoalSequence cancels the
      // fallback timer (so it doesn't double-fire later).
      if (lastGoalTime > lastStingerTime) {
        hideReplayCard();
        playStinger();
      }
      inCountdown = true;
      updateStateStrip();
      startKickoffCountdown();
      clearGoalSequence();
    }
    else if (ev === "RoundStarted")  { inCountdown = false; updateStateStrip(); fireKickoffGo(); clearGoalSequence(); }
    else if (ev === "StatfeedEvent") onStatfeed(data);
    else if (ev === "MatchCreated" || ev === "MatchInitialized") resetMatch();
    // Golden-goal OT ends the match without firing ReplayPlaybackEnd, which
    // would leave the replay card pinned on screen. MatchEnded / PodiumStart
    // force a full clear of the goal sequence and the OT/kickoff takeovers.
    else if (ev === "MatchEnded" || ev === "PodiumStart") {
      clearGoalSequence();
      currentOT = false;
      inCountdown = false;
      // Reset OT detector so the next match starts in regulation mode.
      clockHitZero = false;
      otAscendingFrames = 0;
      inferredOT = false;
      prevTimeSeconds = 0;
      sawDescent = false;
      updateStateStrip();
      finishKickoffCountdown();
    }
  };
}

function connectControl(){
  const ws = new WebSocket(CONTROL_WS);
  ws.onclose = () => setTimeout(connectControl, 1500);
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "control"){ control = Object.assign(control, msg.payload || {}); applyControl(); }
  };
}

applyControl();
connectGame();
connectControl();
</script>
