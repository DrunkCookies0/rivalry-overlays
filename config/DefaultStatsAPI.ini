; Rocket League official Stats API config.
; Copy this file to:
;   <Documents>\My Games\Rocket League\TAGame\Config\DefaultStatsAPI.ini
; then RESTART Rocket League. (Or run:  npm run setup  to place it automatically.)
;
; PacketSendRate is updates per second, 1-120. 0 disables the API.
; Port is the local TCP port the game streams JSON on; the bridge connects here.

[TAGame.MatchStatsExporter_TA]
Port=49123
PacketSendRate=60
