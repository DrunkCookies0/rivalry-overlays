<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RIVALRY — Summer Circuit 2026 Up Next</title>
<style>
/* =============================================================================
 * Summer Circuit 2026 — Up Next (schedule)
 * SC26 reskin of the house rivalry-up-next scene. Layout, geometry and ALL
 * script logic are the house scene's, untouched; only the surfaces changed:
 * Kinetic Bold blue/gold -> Moldybanana's SC26 cyan/lime on dark teal, with
 * values lifted from the ported rivalry-sc26-brb / -starting-soon / -casters
 * scenes (plate gradient + corner brackets from the casters NEXT UP bar, lime
 * slab from the brb status badge, glows and type treatment throughout).
 *
 * OFFLINE NOTE: the Montserrat @import below is the ONE remote dependency in
 * this scene. It matches existing practice in overlays/shared/rivalry-theme.css
 * (which imports Exo 2 / Roboto / Space Mono the same way). Without a network
 * the scene falls back to the local stack in --sc-font and still lays out; the
 * italic-900 look degrades. Self-host the woff2 into assets/ to make it fully
 * offline-safe.
 * ===========================================================================*/
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

/* Fill the OBS Browser Source viewport; rivalry-fit.js scales the 1920x1080 stage into it. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}

/* The fixed 1920x1080 design canvas. Declared locally rather than pulled from
   shared/rivalry-theme.css on purpose (SC26 set convention): this look must
   not inherit --rv-* tokens or the theme's font imports. NOTE: no box-sizing
   reset here — the house scene laid out content-box and geometry must match. */
.rv-stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;}

.scene-root[data-scene="up-next"]{
  --sc-cyan:#00f0ff;
  --sc-lime:#c6f119;
  --sc-ink:#0b1519;
  --sc-font:'Montserrat','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

.scene-root[data-scene="up-next"]{position:absolute;inset:0;overflow:hidden;font-family:var(--sc-font);color:#ffffff;background:var(--sc-ink);}
/* SC26 season art with a dark scrim so header text stays legible over it
   (in Moldy's scenes text never sits bare on the art — the scrim stands in
   for his 0.93-alpha cards). Full-canvas paint mirrors the house scene, which
   also painted its whole background. */
.scene-root[data-scene="up-next"] .un-bg{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(8,18,21,.66) 0%,rgba(8,18,21,.5) 45%,rgba(8,18,21,.8) 100%),url('assets/sc26-background.webp');background-size:cover;background-position:center;background-color:var(--sc-ink);}
.scene-root[data-scene="up-next"] .un-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,240,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.04) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(120% 100% at 30% 30%,#000 55%,transparent 100%);mask-image:radial-gradient(120% 100% at 30% 30%,#000 55%,transparent 100%);}
.scene-root[data-scene="up-next"] .un-lines{position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 100px,rgba(241,238,238,.03) 100px 102px);animation:unDrift 21s linear infinite;}
@keyframes unDrift{from{transform:translateX(0);}to{transform:translateX(102px);}}
.scene-root[data-scene="up-next"] .un-glow{position:absolute;right:-6%;top:8%;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(0,240,255,.13),transparent 64%);filter:blur(8px);}
.scene-root[data-scene="up-next"] .un-frame{position:absolute;inset:48px 112px 120px;display:flex;flex-direction:column;}
.scene-root[data-scene="up-next"] .un-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:30px;}
.scene-root[data-scene="up-next"] .un-titleblock{display:flex;flex-direction:column;}
/* Two-tone season kicker: white "SUMMER CIRCUIT" + lime "2026", the SC26
   header signature (main-title span treatment from the ported scenes). */
.scene-root[data-scene="up-next"] .un-kick{font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#ffffff;margin-bottom:2px;}
.scene-root[data-scene="up-next"] .un-kick span{color:var(--sc-lime);}
.scene-root[data-scene="up-next"] .un-title{margin:0;font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:104px;line-height:.88;letter-spacing:-2px;text-transform:uppercase;color:#ffffff;text-shadow:0 10px 28px rgba(0,0,0,.65);animation:unIn .7s cubic-bezier(0.34,1.56,0.64,1) both;}
.scene-root[data-scene="up-next"] .un-title em{font-style:italic;color:var(--sc-lime);text-shadow:0 0 14px rgba(198,241,25,.3);}
@keyframes unIn{from{opacity:0;transform:translateX(-40px) skewX(-8deg);}to{opacity:1;transform:translateX(0) skewX(0);}}
.scene-root[data-scene="up-next"] .un-underbar{display:block;margin-top:14px;width:340px;height:7px;background:linear-gradient(90deg,var(--sc-cyan),var(--sc-lime));transform:skewX(-12deg);transform-origin:left;animation:unWipe .8s .2s cubic-bezier(0.6,0,0.2,1) both;}
@keyframes unWipe{from{transform:skewX(-12deg) scaleX(0);}to{transform:skewX(-12deg) scaleX(1);}}
.scene-root[data-scene="up-next"] .un-brand{display:flex;align-items:center;gap:18px;padding-bottom:10px;}
.scene-root[data-scene="up-next"] .un-mark{width:64px;height:43px;background:#ffffff;-webkit-mask:url(../../assets/rivalry-logo.svg) center/contain no-repeat;mask:url(../../assets/rivalry-logo.svg) center/contain no-repeat;filter:drop-shadow(0 0 10px rgba(0,240,255,.45));}
.scene-root[data-scene="up-next"] .un-brandtxt{display:flex;flex-direction:column;gap:3px;text-align:right;}
.scene-root[data-scene="up-next"] .un-league{font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#ffffff;}
.scene-root[data-scene="up-next"] .un-event{font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:14px;letter-spacing:.20em;text-transform:uppercase;color:var(--sc-cyan);}
.scene-root[data-scene="up-next"] .un-list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px;}
/* Match rows as SC26 plates: gradient + hairline cyan border + glow lifted
   from the casters scene's NEXT UP bar (.next-match-container). */
.scene-root[data-scene="up-next"] .un-row{position:relative;flex:1 1 0;display:flex;align-items:center;gap:30px;padding:0 40px;background:linear-gradient(135deg,rgba(8,25,28,.95) 0%,rgba(13,39,44,.85) 100%);border:1px solid rgba(0,240,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.8);animation:unRow .6s cubic-bezier(0.6,0,0.2,1) both;}
/* Cyberpunk corner brackets (top-left / bottom-right), same as the SC26 bar. */
.scene-root[data-scene="up-next"] .un-row::before{content:'';position:absolute;top:-1px;left:-1px;width:12px;height:12px;border-top:2px solid var(--sc-cyan);border-left:2px solid var(--sc-cyan);filter:drop-shadow(0 0 4px var(--sc-cyan));}
.scene-root[data-scene="up-next"] .un-row::after{content:'';position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-bottom:2px solid var(--sc-cyan);border-right:2px solid var(--sc-cyan);filter:drop-shadow(0 0 4px var(--sc-cyan));}
.scene-root[data-scene="up-next"] .un-row:nth-child(1){animation-delay:.25s;}
.scene-root[data-scene="up-next"] .un-row:nth-child(2){animation-delay:.33s;}
.scene-root[data-scene="up-next"] .un-row:nth-child(3){animation-delay:.41s;}
.scene-root[data-scene="up-next"] .un-row:nth-child(4){animation-delay:.49s;}
/* On-deck emphasis: the first row runs hotter cyan (border, glow, index). */
.scene-root[data-scene="up-next"] .un-row:nth-child(1){border-color:rgba(0,240,255,.8);box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 14px rgba(0,240,255,.2);}
.scene-root[data-scene="up-next"] .un-row:nth-child(1) .un-idx{color:var(--sc-cyan);}
@keyframes unRow{from{opacity:0;transform:translateX(-36px) skewX(-3deg);}to{opacity:1;transform:translateX(0) skewX(0);}}
.scene-root[data-scene="up-next"] .un-idx{font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:46px;color:rgba(0,240,255,.35);min-width:72px;}
/* Round tag: dark chip with cyan text + hairline, the casters "NEXT UP" label
   treatment (.next-label), sized for the row. */
.scene-root[data-scene="up-next"] .un-tag{flex:0 0 auto;font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:16px;letter-spacing:3px;text-transform:uppercase;color:var(--sc-cyan);background:#081215;border:1px solid rgba(0,240,255,.4);padding:6px 14px;min-width:120px;text-align:center;}
.scene-root[data-scene="up-next"] .un-matchup{flex:1 1 auto;display:flex;align-items:center;gap:30px;}
.scene-root[data-scene="up-next"] .un-team{flex:1 1 0;font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:56px;line-height:1;letter-spacing:-1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffffff;text-shadow:0 4px 14px rgba(0,0,0,.7);}
/* Team underlines keep the house A/B distinction in the SC26 two-tone. */
.scene-root[data-scene="up-next"] .un-a{text-align:right;border-bottom:3px solid rgba(0,240,255,.7);padding-bottom:4px;}
.scene-root[data-scene="up-next"] .un-b{text-align:left;border-bottom:3px solid rgba(198,241,25,.7);padding-bottom:4px;}
.scene-root[data-scene="up-next"] .un-vs{flex:0 0 auto;font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:34px;color:var(--sc-cyan);}
/* Time as a lime slab with dark text (the brb status-badge treatment, lime). */
.scene-root[data-scene="up-next"] .un-time{flex:0 0 auto;font-family:var(--sc-font);font-style:italic;font-weight:900;font-size:30px;letter-spacing:1px;text-transform:uppercase;color:var(--sc-ink);background:var(--sc-lime);padding:7px 22px;min-width:200px;text-align:center;transform:skewX(-10deg);}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root" data-scene="up-next">
<div class="un-bg"></div>
<div class="un-grid"></div>
<div class="un-lines"></div>
<div class="un-glow"></div>

<div class="un-frame">
  <header class="un-top">
    <div class="un-titleblock">
      <span class="un-kick">SUMMER CIRCUIT <span>2026</span></span>
      <h1 class="un-title">UP <em>NEXT</em></h1>
      <span class="un-underbar"></span>
    </div>
    <div class="un-brand">
      <div class="un-mark"></div>
      <div class="un-brandtxt">
        <span class="un-league" data-field="brand.leagueName">RIVALRY</span>
        <span class="un-event" data-field="eventTitle">RIVALRY SEASON 1</span>
      </div>
    </div>
  </header>

  <section class="un-list">
    <div class="un-row" data-slot="upNext.0">
      <span class="un-idx">01</span>
      <span class="un-tag" data-field="upNext.0.round">UB R1</span>
      <div class="un-matchup">
        <span class="un-team un-a" data-field="upNext.0.teamA">NOVA</span>
        <span class="un-vs">VS</span>
        <span class="un-team un-b" data-field="upNext.0.teamB">ECLIPSE</span>
      </div>
      <span class="un-time" data-field="upNext.0.time">9:30 ET</span>
    </div>
    <div class="un-row" data-slot="upNext.1">
      <span class="un-idx">02</span>
      <span class="un-tag" data-field="upNext.1.round">LB R1</span>
      <div class="un-matchup">
        <span class="un-team un-a" data-field="upNext.1.teamA">VOLT</span>
        <span class="un-vs">VS</span>
        <span class="un-team un-b" data-field="upNext.1.teamB">DRIFT</span>
      </div>
      <span class="un-time" data-field="upNext.1.time">10:00 ET</span>
    </div>
    <div class="un-row" data-slot="upNext.2">
      <span class="un-idx">03</span>
      <span class="un-tag" data-field="upNext.2.round">LB R1</span>
      <div class="un-matchup">
        <span class="un-team un-a" data-field="upNext.2.teamA">APEX</span>
        <span class="un-vs">VS</span>
        <span class="un-team un-b" data-field="upNext.2.teamB">ZENITH</span>
      </div>
      <span class="un-time" data-field="upNext.2.time">10:30 ET</span>
    </div>
    <div class="un-row" data-slot="upNext.3">
      <span class="un-idx">04</span>
      <span class="un-tag" data-field="upNext.3.round">LB R1</span>
      <div class="un-matchup">
        <span class="un-team un-a" data-field="upNext.3.teamA">TEAM A</span>
        <span class="un-vs">VS</span>
        <span class="un-team un-b" data-field="upNext.3.teamB">TEAM B</span>
      </div>
      <span class="un-time" data-field="upNext.3.time">11:00 ET</span>
    </div>
  </section>
</div>
    </div>
  </div>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-bind.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script>
    // Control-only scene: subscribe to the control bus (auto-mocks on file://).
    var rl = RivalryOverlay.connect({ game: false });
    RivalryBind(document.querySelector('.scene-root'), rl);
    // Resolution-independent: scale the 1920x1080 design to fill any source size.
    // Append ?fit=cover to the source URL to fill+crop instead of letterbox on non-16:9.
    RivalryFit('.rv-stage');
  </script>
</body>
</html>
