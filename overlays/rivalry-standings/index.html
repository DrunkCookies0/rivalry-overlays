<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RIVALRY · Standings</title>
<!--
  DARK-LAUNCHED (2026-08-01): built against Ask 1 in ASKS-FOR-CYNICAL.md
  before the standings endpoint exists. The scene is signed and testable (mock
  fixture end to end) but deliberately kept OUT of the OBS scene collection
  and the scene deck (DARK_SCENE_TYPES in bridge/obs-collection.js) until the
  league API actually serves standings. Flip: remove the type from
  DARK_SCENE_TYPES and add an OBS_SCENE_NAMES entry.

  Consumes the additive `standings` control field (see overlays/CONTRACT.md):
  rows arrive in the server's official order and are NEVER re-sorted here, so
  the broadcast cannot disagree with the site about positions.

  The Rivalry brand (2026-11 rebrand), after the broadcast concept's
  standings: the top band, "Standings." and a ruled table (# · team · W · L ·
  win% · GW · GL · +/-, plus points when the league sends them, since they may
  be what the order is by). The two teams on air get the Emerald tint. The
  concept's "this week" panel waits on Ask 3 (no results route yet), and its
  playoff line waits on the league saying how many teams advance. The chrome
  sits on top of this scene, so everything stays inside the 1792x1008 window.
-->
<link rel="stylesheet" href="../shared/rivalry-theme.css" />
<link rel="stylesheet" href="../../assets/brand/rivalry-brand.css" />
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
.scene-root[data-scene="standings"]{position:absolute;inset:0;overflow:hidden;background:var(--rv-coal);color:var(--rv-chalk);font-family:var(--rv-font-body);}
.st-h{position:absolute;left:150px;top:206px;margin:0;font-size:130px;line-height:.86;}

/* The table: a mono header row, then 52px rows on 1px Slate rules. Fixed
   columns so every row lines up; the team name takes whatever is left. */
.st-table{position:absolute;left:150px;right:150px;top:350px;}
.st-head,.st-row{display:grid;grid-template-columns:80px 1fr 90px 90px 150px 100px 100px 110px var(--st-pts,0px);align-items:center;column-gap:12px;padding:0 16px;box-sizing:border-box;}
.st-table:not(.has-pts){--st-pts:0px;}
.st-table.has-pts{--st-pts:110px;}
.st-head{height:36px;border-bottom:1px solid var(--rv-slate);}
.st-head span{font:400 13px/1 var(--rv-font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rv-chalk-dim);}
.st-head .n,.st-row .n{text-align:right;}
.st-table:not(.has-pts) .pts{display:none;}
.st-list{display:flex;flex-direction:column;}
.st-row{height:52px;border-bottom:1px solid var(--rv-slate);animation:stIn .4s cubic-bezier(.2,.8,.2,1) both;}
@keyframes stIn{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:none;}}
.st-row.live{background:var(--rv-emerald-tint);}
.st-pos{font:700 24px/1 var(--rv-font-mono);color:var(--rv-chalk-dim);}
.st-row.live .st-pos{color:var(--rv-emerald);}
.st-name{min-width:0;font:600 26px/1 var(--rv-font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-num{font:400 24px/1 var(--rv-font-mono);text-align:right;white-space:nowrap;}
.st-num.pts{font-weight:700;}

.st-empty{display:flex;align-items:center;height:104px;padding:0 16px;border-bottom:1px solid var(--rv-slate);
  font:400 18px/1.2 var(--rv-font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rv-chalk-dim);}
.st-updated{margin-top:16px;padding:0 16px;}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root" data-scene="standings">
      <img class="rv-lockup" src="../../assets/brand/lockup-horizontal-emerald-on-dark.svg" alt="The Rivalry" />
      <div class="rv-tags">
        <span class="rv-tag ln" id="stCircuit"></span>
      </div>
      <h1 class="st-h rv-hd">Standings.</h1>
      <div class="st-table" id="stTable">
        <div class="st-head">
          <span>#</span><span>Team</span>
          <span class="n">W</span><span class="n">L</span><span class="n">Win%</span>
          <span class="n">GW</span><span class="n">GL</span><span class="n">+/-</span><span class="n pts">Pts</span>
        </div>
        <section class="st-list" id="stList"></section>
        <div class="st-updated rv-lab" id="stUpdated"></div>
      </div>
    </div>
  </div>
  <script src="../shared/rivalry-geometry.js"></script>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script>
  (function () {
    "use strict";
    // Ten rows fill the window above the ticker; the league's order beyond that
    // is cut, never re-sorted.
    var MAX_ROWS = 10;
    var $ = function (id) { return document.getElementById(id); };

    function el(tag, cls, text) {
      var d = document.createElement(tag);
      if (cls) d.className = cls;
      if (text !== undefined && text !== null) d.textContent = String(text);
      return d;
    }

    // eventTitle may carry <b> emphasis (as on the gameplay event bar): escape in
    // full, then re-allow only bare <b>/</b>, so the tags never air literally.
    function titleHtml(s) {
      return String(s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; })
        .replace(/&lt;(\/?)b&gt;/gi, "<$1b>");
    }

    // gamesRecord is "GW-GL" from the normalizer (league-client.js); "" when the
    // league sent no game counts, and then GW, GL and +/- stay blank.
    function games(r) {
      var m = /^(\d+)-(\d+)$/.exec(String(r.gamesRecord || ""));
      return m ? { w: +m[1], l: +m[2] } : null;
    }
    function winPct(r) {
      var w = Number(r.wins) || 0, l = Number(r.losses) || 0;
      return w + l ? (100 * w / (w + l)).toFixed(1) + "%" : "";
    }
    function diff(g) {
      if (!g) return "";
      var d = g.w - g.l;
      return d > 0 ? "+" + d : String(d);
    }
    function norm(s) { return String(s || "").trim().toLowerCase(); }

    var lastRowsKey = null;

    function render(c) {
      c = c || {};
      var s = c.standings;
      var list = $("stList");
      var rows = s && Array.isArray(s.rows) ? s.rows.slice(0, MAX_ROWS) : [];
      var circuitLine = s && s.circuit
        ? [s.circuit.season, s.circuit.nameShort || s.circuit.name, s.circuit.tier].filter(Boolean).join(" · ")
        : "";
      var tag = circuitLine || c.eventTitle || "";
      $("stCircuit").innerHTML = titleHtml(tag);
      $("stCircuit").style.display = tag ? "" : "none";
      // An unparseable updatedAt (e.g. epoch digits) would air "UPDATED INVALID DATE".
      var updated = rows.length && s.updatedAt ? new Date(s.updatedAt) : null;
      $("stUpdated").textContent = updated && !isNaN(updated)
        ? "Updated " + updated.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
        : "";
      var hasPts = rows.some(function (r) { return r.points !== null && r.points !== undefined; });
      $("stTable").classList.toggle("has-pts", hasPts);

      // The panel pushes the FULL payload on every keystroke and the bridge replays
      // it on reconnect: rebuilding every time restarted each row's entrance,
      // blanking the board on air during any unrelated edit. Rebuild only when what
      // the rows render actually changed.
      var key = JSON.stringify(rows.map(function (r) {
        return [r.position, r.name, r.wins, r.losses, r.gamesRecord, r.points];
      }));
      if (key !== lastRowsKey) {
        lastRowsKey = key;
        list.innerHTML = "";
        if (!rows.length) {
          list.appendChild(el("div", "st-empty", "Standings fill in once the league publishes them"));
        }
        rows.forEach(function (r, i) {
          // Server order IS the official order; position renders as sent.
          var g = games(r);
          var row = el("div", "st-row");
          row.style.animationDelay = (0.1 + i * 0.05) + "s";
          row.setAttribute("data-name", norm(r.name));
          row.appendChild(el("span", "st-pos", r.position !== null && r.position !== undefined ? String(r.position).padStart(2, "0") : "--"));
          row.appendChild(el("span", "st-name", r.name || "TBD"));
          row.appendChild(el("span", "st-num", r.wins !== undefined && r.wins !== null ? r.wins : ""));
          row.appendChild(el("span", "st-num", r.losses !== undefined && r.losses !== null ? r.losses : ""));
          row.appendChild(el("span", "st-num", winPct(r)));
          row.appendChild(el("span", "st-num", g ? g.w : ""));
          row.appendChild(el("span", "st-num", g ? g.l : ""));
          row.appendChild(el("span", "st-num", diff(g)));
          row.appendChild(el("span", "st-num pts", hasPts && r.points !== null && r.points !== undefined ? r.points : ""));
          list.appendChild(row);
        });
      }
      // The two teams on air, matched by name (the standings rows and the loaded
      // match both carry the league's team name). Toggled on every push, so a
      // team swap never rebuilds the board.
      var live = [norm(c.teamA && c.teamA.name), norm(c.teamB && c.teamB.name)].filter(Boolean);
      Array.prototype.forEach.call(list.querySelectorAll(".st-row"), function (row) {
        row.classList.toggle("live", live.indexOf(row.getAttribute("data-name")) !== -1);
      });
    }

    var ov = RivalryOverlay.connect({ game: false });
    ov.onControl(render);
    RivalryFit(".rv-stage");
  })();
  </script>
</body>
</html>
