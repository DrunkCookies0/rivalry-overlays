<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>RIVALRY · Post-Game Results</title>
<link rel="stylesheet" href="../shared/rivalry-theme.css" />
<link rel="stylesheet" href="../../assets/brand/rivalry-brand.css" />
<style>
/* The Rivalry brand (2026-11 rebrand), after the broadcast concept's post-game
   stats: "<TEAM> win." with the outlined Emerald word, the two teams compared
   stat by stat (the left team's bars solid Chalk, the right team's outlined
   Emerald: the brand's solid-left / outlined-right motif), and the player of
   the game on a raised card. The chrome sits on top, so everything stays
   inside the 1792x1008 window. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
.pg{position:absolute;inset:0;overflow:hidden;background:var(--rv-coal);color:var(--rv-chalk);font-family:var(--rv-font-body);}
.pg-h{position:absolute;left:150px;top:214px;margin:0;max-width:1640px;font-size:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.pg-boards{position:absolute;left:150px;top:380px;width:1000px;}
.pg-hdr{display:grid;grid-template-columns:1fr 70px 150px 70px 1fr;align-items:center;column-gap:12px;
  padding-bottom:20px;border-bottom:1px solid var(--rv-slate);}
.pg-team{display:flex;align-items:center;gap:14px;min-width:0;}
.pg-team.a{--rv-side:var(--rv-team-blue);}
.pg-team.b{justify-content:flex-end;--rv-side:var(--rv-team-orange);}
.pg-team .rv-tile{width:54px;height:54px;--rv-tbar-h:5px;}
.pg-team .nm{min-width:0;font-size:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pg-tot{font:700 44px/1 var(--rv-font-mono);font-variant-numeric:tabular-nums;text-align:center;}
.pg-totlab{text-align:center;}
.pg-sr{display:grid;grid-template-columns:70px 1fr 150px 1fr 70px;align-items:center;column-gap:12px;height:70px;
  border-bottom:1px solid var(--rv-slate);}
.pg-sr b{font:700 32px/1 var(--rv-font-mono);font-variant-numeric:tabular-nums;}
.pg-sr b:last-child{text-align:right;}
.pg-sr .bar{display:flex;height:22px;}
.pg-sr .bar.a{justify-content:flex-end;}
.pg-sr .bar i{display:block;height:100%;box-sizing:border-box;}
.pg-sr .bar.a i{background:var(--rv-chalk);}
.pg-sr .bar.b i{border:3px solid var(--rv-emerald);}
.pg-sr .rv-lab{text-align:center;}

.pg-potg{position:absolute;left:1236px;right:124px;top:380px;background:var(--rv-coal-raised);border:1px solid var(--rv-slate);}
.pg-potg.a{--rv-side:var(--rv-team-blue);}
.pg-potg.b{--rv-side:var(--rv-team-orange);}
.pg-potg .ph{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--rv-slate);}
.pg-potg .rv-tile{width:48px;height:48px;--rv-tbar-h:5px;}
.pg-potg .pn{padding:22px 22px 18px;}
.pg-potg .pn .nm{font-size:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pg-potg .pn .rv-lab{margin-top:8px;}
.pg-potg .pgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rv-slate);}
.pg-potg .pgrid div{display:flex;flex-direction:column;gap:8px;padding:18px 22px;border-left:1px solid var(--rv-slate);border-top:1px solid var(--rv-slate);}
.pg-potg .pgrid div:nth-child(3n+1){border-left:0;}
.pg-potg .pgrid div:nth-child(-n+3){border-top:0;}
.pg-potg .pgrid b{font:700 40px/1 var(--rv-font-mono);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root pg" data-scene="postgame">
      <img class="rv-lockup" src="../../assets/brand/lockup-horizontal-emerald-on-dark.svg" alt="The Rivalry" />
      <div class="rv-tags">
        <span class="rv-tag em" id="finalTag">Final</span>
        <span class="rv-tag ln pg-event">RIVALRY SEASON 1</span>
        <span class="rv-tag ln" data-field="event.round">UPPER BRACKET • ROUND 1</span>
      </div>

      <h1 class="pg-h rv-hd" id="pgHead">Final.</h1>

      <section class="pg-boards">
        <div class="pg-hdr">
          <span class="pg-team a"><span class="rv-tile rv-tbar" id="tileA"></span><span class="rv-hd nm" data-field="teamA.name">GUARDIANS</span></span>
          <span class="pg-tot" data-field="teamA.score">4</span>
          <span class="rv-lab pg-totlab">Team totals</span>
          <span class="pg-tot" data-field="teamB.score">2</span>
          <span class="pg-team b"><span class="rv-hd nm" data-field="teamB.name">SENTINELS</span><span class="rv-tile rv-tbar" id="tileB"></span></span>
        </div>
        <div id="pgRows"></div>
      </section>

      <section class="pg-potg a" id="potg">
        <div class="ph"><span class="rv-tag em">Player of the game</span><span class="rv-tile rv-tbar" id="potgTile"></span></div>
        <div class="pn"><div class="rv-hd nm" data-field="mvp.name">VECTOR</div><div class="rv-lab" data-field="mvp.team">GUARDIANS</div></div>
        <div class="pgrid" id="potgGrid"></div>
      </section>
    </div>
  </div>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-bind.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script>
(function () {
  var root = document.querySelector('.scene-root');
  var $ = function (id) { return document.getElementById(id); };
  var rl = RivalryOverlay.connect();            // game + control (auto-mock on file://)
  RivalryFit('.rv-stage');
  var control = {}, lastGood = null, frozen = null, frozenGuid = null, held = null, demos = {}, lastDemo = {};
  // The game feed has no last-state replay, so a page refreshed during the postgame never sees
  // the final frame again. Keep the frozen result in sessionStorage: it survives an OBS source
  // refresh but dies with the source's browser, so it never outlives OBS. reset() saves it again
  // as held; the next match's first real frame clears it.
  var SNAP = 'rivalry.postgame.final';
  try {
    var snap = JSON.parse(sessionStorage.getItem(SNAP) || 'null');
    if (snap && snap.data && snap.data.teamA) {
      if (snap.held) held = snap.data;
      else if (snap.guid) { frozen = snap.data; frozenGuid = snap.guid; }
    }
  } catch (e) {}
  function saveSnap(v) {
    try { if (v) sessionStorage.setItem(SNAP, JSON.stringify(v)); else sessionStorage.removeItem(SNAP); } catch (e) {}
  }
  rl.onControl(function (c) { control = c || {}; rebuild(); });
  // Latch the last LIVE frame; ignore the zeroed UpdateState RL streams at podium.
  // While frozen, a new MatchGuid means the next match started -> unfreeze even if
  // MatchCreated/MatchInitialized never fired (bot/private/some modes don't emit them).
  rl.on('UpdateState', function (d) {
    if (frozen) {
      if (d && d.MatchGuid && frozenGuid && d.MatchGuid !== frozenGuid) reset();
      else return;
    }
    if (d && d.Players && d.Players.length && !zeroed(d)) {
      lastGood = d;
      if (held) { held = null; saveSnap(null); }
      rebuild();
    }
  });
  // The podium zero-out still lists the players, just 0-0 with every Score 0. Never latch it:
  // a page (re)loaded after the final, or a zero-out that beats MatchEnded, would air it as a
  // 0-0 FINAL. Pre-kickoff frames look the same and carry nothing worth showing.
  function zeroed(d) {
    var t = (d.Game && d.Game.Teams) || [];
    return !(t[0] && t[0].Score) && !(t[1] && t[1].Score) && !d.Players.some(function (p) { return p.Score; });
  }
  // Demo tally: only the fallback for frames without Players[].Demos (see build()). Demos
  // double-fire (RL native + bridge synthetic, ~800ms apart; CONTRACT.md quirks), so dedupe like
  // the gameplay scene: one count per attacker within 1000ms (a first-ever demo always counts).
  rl.on('StatfeedEvent', function (d) {
    if (frozen || !d) return;
    if ((d.Type || '').toLowerCase() === 'demolition') {
      var n = (d.Attacker && d.Attacker.Name) || (d.MainTarget && d.MainTarget.Name) || (d.MainPlayer && d.MainPlayer.Name);
      var now = performance.now();
      if (n && (lastDemo[n] == null || now - lastDemo[n] >= 1000)) { lastDemo[n] = now; demos[n] = (demos[n] || 0) + 1; }
    }
  });
  // Re-arm for the next match but keep the last final on screen until that match sends a real
  // frame: MatchCreated lands while the postgame is usually still on program (OBS cuts back to
  // live on CountdownBegin), and wiping it there airs an empty board through the load. The held
  // board is saved too, so an OBS source refresh in that window restores it.
  function reset() {
    held = frozen || held; lastGood = null; frozen = null; frozenGuid = null; demos = {}; lastDemo = {};
    saveSnap(held ? { held: true, data: held } : null);
    rebuild();
  }
  rl.on('MatchCreated', reset); rl.on('MatchInitialized', reset);
  rl.on('MatchEnded', freeze); rl.on('PodiumStart', freeze);   // freeze on the FIRST of the two
  function freeze() {
    if (frozen || !lastGood) return;
    frozenGuid = lastGood.MatchGuid || null; frozen = build(lastGood); rebuild();
    if (frozenGuid) saveSnap({ guid: frozenGuid, data: frozen });
  }
  function build(d) {
    d = d || { Game: { Teams: [] }, Players: [] };
    var teams = (d.Game && d.Game.Teams) || [], players = d.Players || [];
    // Demos: RL's own Players[].Demos wins whenever the frame carries it. The bridge synthesizes
    // demo events only from that counter's deltas (so it is present wherever they exist), it is
    // RL's scoreboard number, it survives a mid-match reload, and it has no dedupe window to lose
    // chained demos in. The deduped StatfeedEvent tally covers feeds without the field.
    function col(t) { return players.filter(function (p) { return p.TeamNum === t; }).map(function (p) {
      return { name: p.Name, goals: p.Goals || 0, assists: p.Assists || 0, saves: p.Saves || 0, shots: p.Shots || 0, demos: (typeof p.Demos === 'number' ? p.Demos : (demos[p.Name] || 0)), score: p.Score || 0 };
    }); }
    var A = col(0), B = col(1);
    var all = A.map(function (x) { return { x: x, t: 0 }; }).concat(B.map(function (x) { return { x: x, t: 1 }; }));
    var mvp = null; all.forEach(function (e) { if (!mvp || e.x.score > mvp.x.score) mvp = e; });
    var tA = (control.teamA && control.teamA.name) || (teams[0] && teams[0].Name) || 'BLUE';
    var tB = (control.teamB && control.teamB.name) || (teams[1] && teams[1].Name) || 'ORANGE';
    return {
      brand: { leagueName: (control.brand && control.brand.leagueName) || 'RIVALRY' },
      event: { title: control.eventTitle || 'RIVALRY', round: control.round || '' },
      // No frame at all (e.g. OBS restarted mid-postgame): blank tally, not an invented 0-0 FINAL.
      teamA: { name: tA, logo: (control.teamA && control.teamA.logo) || '', score: teams[0] ? (teams[0].Score || 0) : '', players: A },
      teamB: { name: tB, logo: (control.teamB && control.teamB.logo) || '', score: teams[1] ? (teams[1].Score || 0) : '', players: B },
      mvp: mvp ? { name: mvp.x.name, team: (mvp.t === 0 ? tA : tB), side: mvp.t } : { name: '', team: '', side: 0 }
    };
  }

  // --- drawing ------------------------------------------------------------------
  var STATS = [['goals', 'Goals'], ['shots', 'Shots'], ['saves', 'Saves'], ['assists', 'Assists'], ['demos', 'Demos']];
  var MVP_STATS = [['score', 'Score'], ['goals', 'Goals'], ['assists', 'Assists'], ['saves', 'Saves'], ['shots', 'Shots'], ['demos', 'Demos']];
  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }
  function sum(list, k) { return (list || []).reduce(function (t, p) { return t + (p[k] || 0); }, 0); }
  function setTile(t, logo) {
    t.classList.toggle('has-logo', !!logo);
    t.style.backgroundImage = logo ? 'url("' + String(logo).replace(/"/g, '%22') + '")' : '';
  }
  // Each stat: both teams' totals, bars scaled to the larger of the two.
  function drawRows(data) {
    var host = $('pgRows');
    host.textContent = '';
    STATS.forEach(function (s) {
      var va = sum(data.teamA.players, s[0]), vb = sum(data.teamB.players, s[0]);
      var max = Math.max(va, vb, 1);
      var row = el('div', 'pg-sr');
      row.appendChild(el('b', '', String(va)));
      var ba = row.appendChild(el('span', 'bar a')).appendChild(el('i'));
      ba.style.width = (va / max * 100) + '%';
      row.appendChild(el('span', 'rv-lab', s[1]));
      var bb = row.appendChild(el('span', 'bar b')).appendChild(el('i'));
      bb.style.width = (vb / max * 100) + '%';
      row.appendChild(el('b', '', String(vb)));
      host.appendChild(row);
    });
  }
  function drawPotg(data) {
    var side = data.mvp.side === 1 ? 'b' : 'a';
    $('potg').className = 'pg-potg ' + side;
    setTile($('potgTile'), side === 'a' ? data.teamA.logo : data.teamB.logo);
    var all = (data.teamA.players || []).concat(data.teamB.players || []);
    var m = all.filter(function (p) { return p.name === data.mvp.name; })[0] || {};
    var grid = $('potgGrid');
    grid.textContent = '';
    MVP_STATS.forEach(function (s) {
      var c = grid.appendChild(el('div'));
      c.appendChild(el('b', '', String(m[s[0]] || 0)));
      c.appendChild(el('span', 'rv-lab', s[1]));
    });
  }
  // "<TEAM> win." on a decided final; "Final." otherwise once frozen; "Game stats."
  // while the scene is looking at a live game.
  function drawHead(data, fin) {
    var head = $('pgHead');
    head.textContent = '';
    var a = fin ? fin.teamA.score : 0, b = fin ? fin.teamB.score : 0;
    if (fin && a !== b) {
      head.appendChild(document.createTextNode((a > b ? data.teamA.name : data.teamB.name) + ' '));
      head.appendChild(el('span', 'rv-o', 'win.'));
    } else {
      head.textContent = fin ? 'Final.' : 'Game stats.';
    }
    $('finalTag').style.display = fin ? '' : 'none';
  }

  var lastApplied = '';
  function rebuild() {
    var fin = frozen || (!lastGood && held);       // a decided final on screen, not the live latch
    var data = fin || build(lastGood);
    // UpdateState arrives at ~60 Hz and this scene idles in OBS all night:
    // skip the full re-bind when nothing changed. Final-ness is part of the
    // key because a decided final repaints identical data (the headline).
    var key = (fin ? 'F' : 'L') + JSON.stringify(data);
    if (key === lastApplied) return;
    lastApplied = key;
    RivalryBind(root, null, data);
    // eventTitle may carry <b> emphasis (as on the gameplay event bar) but RivalryBind writes
    // textContent, which aired the tags literally. Escape in full, re-allow only bare <b>/</b>.
    root.querySelector('.pg-event').innerHTML = titleHtml(data.event.title);
    setTile($('tileA'), data.teamA.logo);
    setTile($('tileB'), data.teamB.logo);
    drawHead(data, fin);
    drawRows(data);
    drawPotg(data);
  }
  function titleHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; })
      .replace(/&lt;(\/?)b&gt;/gi, '<$1b>');
  }
  rebuild();
})();
</script>
</body>
</html>
