<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RIVALRY chrome prototype: pick a direction</title>
<!--
  Throwaway decision tool, not a scene. Underscore prefix keeps it out of the
  registry, the signing preflight, and the packaged build surface.

  Purpose: pick the persistent-chrome direction for v1.0. Toggle treatments,
  geometry, ticker density, showcase content, lower thirds, and the wipe, over
  a real gameplay frame (shrunk into the safe area) or a presentation scene
  (full bleed under the chrome). Open in any browser; no app needed.

  The safe area rule: interior stays exactly 16:9 (tickerHeight = railWidth *
  1.125) so the game capture scales in with no letterboxing and no cropping.
  See bridge/broadcast-geometry.js.
-->
<link rel="stylesheet" href="shared/rivalry-theme.css">
<style>
  html,body{margin:0;height:100%;background:#0a1218;overflow:hidden;
    font-family:var(--rv-font-body,Roboto,sans-serif);}
  /* ---------- stage + fit ---------- */
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  #stageBox{flex:1;position:relative;}
  .rv-stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;background:#000;overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.8);}

  /* ---------- backdrop layers ---------- */
  /* The gameplay screenshot is transparent-backed (it is an overlay), so a
     dark arena-ish gradient stands in for the game feed underneath it. */
  #gameLayer{position:absolute;
    background:
      url("_prototype-assets/gameplay-1080.png") center/contain no-repeat,
      radial-gradient(120% 90% at 50% 18%, #1d3a4d 0%, #0d1b24 55%, #08121a 100%);}
  #sceneLayer{position:absolute;inset:0;
    background:#000 center/cover no-repeat;
    background-image:url("_prototype-assets/starting-soon-1080.png");}

  /* ---------- chrome geometry (JS sets the CSS vars) ---------- */
  :root{--rail:64px;--ticker:72px;}
  .rail{position:absolute;top:0;bottom:var(--ticker);width:var(--rail);z-index:40;
    display:flex;flex-direction:column;align-items:center;}
  .rail.left{left:0;}
  .rail.right{right:0;}
  .ticker{position:absolute;left:0;right:0;bottom:0;height:var(--ticker);z-index:41;
    display:flex;align-items:center;}

  /* =======================================================================
     TREATMENT A: "SOLID SLAB" flat jet black, one gold seam at interior edge
     ======================================================================= */
  .tA .rail{background:var(--rv-jet-black,#132e3b);}
  .tA .rail.left{border-right:3px solid var(--rv-gold,#f1c40f);}
  .tA .rail.right{border-left:3px solid var(--rv-gold,#f1c40f);}
  .tA .ticker{background:var(--rv-jet-black,#132e3b);
    border-top:3px solid var(--rv-gold,#f1c40f);}

  /* =======================================================================
     TREATMENT B: "KINETIC SEAM" gradient surface, angled cuts, moving sheen
     ======================================================================= */
  .tB .rail{background:linear-gradient(180deg,#132e3b 0%,#20496f 140%);}
  .tB .rail.left{box-shadow:inset -3px 0 0 var(--rv-gold,#f1c40f);}
  .tB .rail.right{box-shadow:inset 3px 0 0 var(--rv-gold,#f1c40f);}
  .tB .ticker{background:linear-gradient(90deg,#132e3b 0%,#1a3d4d 55%,#20496f 100%);
    box-shadow:inset 0 3px 0 var(--rv-gold,#f1c40f);}
  .tB .rail::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 0%,rgba(241,196,15,.07) 50%,transparent 100%);
    background-size:100% 300%;animation:sheen 9s linear infinite;}
  @keyframes sheen{0%{background-position:0 300%;}100%{background-position:0 -300%;}}

  /* =======================================================================
     TREATMENT C: "GLASS EDGE" translucent panels, thin light borders
     ======================================================================= */
  .tC .rail{background:rgba(19,46,59,.82);backdrop-filter:blur(6px);}
  .tC .rail.left{border-right:1px solid rgba(241,238,238,.28);}
  .tC .rail.right{border-left:1px solid rgba(241,238,238,.28);}
  .tC .ticker{background:rgba(19,46,59,.88);backdrop-filter:blur(6px);
    border-top:1px solid rgba(241,238,238,.28);}

  /* ---------- rail contents ---------- */
  .rail .logo{width:48px;height:48px;margin-top:8px;flex:none;
    background:url("../assets/rivalry-logo.svg") center/contain no-repeat;}
  .rail .wordmark{margin-top:14px;flex:none;
    writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
    font-family:var(--rv-font-display,'Exo 2',sans-serif);font-style:italic;
    font-weight:800;font-size:26px;letter-spacing:.35em;
    color:var(--rv-white-smoke,#f1eeee);}
  .rail .eventmeta{margin-top:auto;margin-bottom:14px;flex:none;
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:var(--rv-font-stat,'Space Mono',monospace);font-size:13px;
    letter-spacing:.22em;color:rgba(241,238,238,.62);white-space:nowrap;}
  .rail .follow{margin-top:10px;flex:none;
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:var(--rv-font-stat,'Space Mono',monospace);font-size:12px;
    letter-spacing:.3em;color:rgba(241,238,238,.55);}
  .rail .tiles{display:flex;flex-direction:column;gap:12px;margin-top:16px;flex:none;}
  .tile{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
    background:rgba(241,238,238,.06);color:var(--rv-white-smoke,#f1eeee);}
  .tA .tile{outline:1px solid rgba(241,196,15,.35);}
  .tB .tile{clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);}
  .tC .tile{outline:1px solid rgba(241,238,238,.25);border-radius:6px;}
  .tile svg{width:24px;height:24px;fill:currentColor;}
  .tile .handle{display:none;}

  /* showcase slot (bottom of right rail) */
  .showcase{margin-top:auto;margin-bottom:14px;flex:none;display:flex;
    flex-direction:column;align-items:center;gap:8px;}
  .showcase .sc-label{writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:var(--rv-font-stat,'Space Mono',monospace);font-size:11px;
    letter-spacing:.28em;color:var(--rv-gold,#f1c40f);}
  .showcase .sc-logo{width:46px;height:46px;background:rgba(241,238,238,.08);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--rv-font-display,'Exo 2',sans-serif);font-style:italic;
    font-weight:800;font-size:20px;color:var(--rv-white-smoke,#f1eeee);}
  .showcase.rotating .sc-logo{animation:scSwap 6s ease-in-out infinite;}
  @keyframes scSwap{0%,42%{opacity:1}46%,50%{opacity:0}54%,100%{opacity:1}}

  /* ---------- ticker contents ---------- */
  .ticker .badge{flex:none;height:100%;display:flex;align-items:center;gap:10px;
    padding:0 18px;background:var(--rv-gold,#f1c40f);color:#132e3b;
    font-family:var(--rv-font-display,'Exo 2',sans-serif);font-style:italic;
    font-weight:800;font-size:20px;letter-spacing:.08em;}
  .tB .ticker .badge{clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);
    padding-right:30px;}
  .ticker .items{flex:1;overflow:hidden;position:relative;height:100%;}
  .t-item{position:absolute;inset:0;display:flex;align-items:center;gap:14px;
    padding:0 26px;opacity:0;transform:translateY(12px);
    transition:opacity .45s var(--rv-ease-out,ease),transform .45s var(--rv-ease-out,ease);
    font-size:21px;color:var(--rv-white-smoke,#f1eeee);white-space:nowrap;}
  .t-item.on{opacity:1;transform:none;}
  .t-item .k{font-family:var(--rv-font-stat,'Space Mono',monospace);font-size:14px;
    letter-spacing:.2em;color:var(--rv-gold,#f1c40f);flex:none;}
  .t-item .vs{color:rgba(241,238,238,.55);font-size:16px;}
  .t-item .rec{font-family:var(--rv-font-stat,'Space Mono',monospace);
    font-size:16px;color:var(--rv-teal,#1abc9c);}
  .t-item .live-dot{width:10px;height:10px;border-radius:50%;flex:none;
    background:var(--rv-red,#e74c3c);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35}}
  .ticker .stream{flex:none;height:100%;display:flex;align-items:center;gap:10px;
    padding:0 22px;font-family:var(--rv-font-stat,'Space Mono',monospace);
    font-size:12px;letter-spacing:.18em;color:rgba(241,238,238,.55);}
  .compact .t-item{font-size:18px;}
  .compact .ticker .badge{font-size:17px;}

  /* ---------- lower third (lives inside safe area, above ticker) ---------- */
  .lower3{position:absolute;z-index:45;left:calc(var(--rail) + 42px);
    bottom:calc(var(--ticker) + 34px);display:flex;align-items:stretch;
    opacity:0;transform:translateX(-24px);pointer-events:none;
    transition:opacity .4s var(--rv-ease-out,ease),transform .4s var(--rv-ease-out,ease);}
  .lower3.on{opacity:1;transform:none;}
  .lower3 .bar{width:8px;background:var(--rv-gold,#f1c40f);flex:none;}
  .lower3 .body{background:rgba(19,46,59,.94);padding:14px 30px 14px 22px;
    clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);}
  .lower3 .l3-title{font-family:var(--rv-font-display,'Exo 2',sans-serif);
    font-style:italic;font-weight:800;font-size:30px;letter-spacing:.04em;
    color:var(--rv-white-smoke,#f1eeee);}
  .lower3 .l3-sub{font-family:var(--rv-font-stat,'Space Mono',monospace);
    font-size:15px;letter-spacing:.16em;color:var(--rv-gold,#f1c40f);margin-top:2px;}

  /* ---------- wipe ---------- */
  .wipe{position:absolute;inset:0;z-index:60;display:none;pointer-events:none;}
  .wipe.run{display:block;}
  .wipe .p{position:absolute;top:0;bottom:0;width:120%;left:-130%;}
  .wipe .p1{background:var(--rv-gold,#f1c40f);}
  .wipe .p2{background:var(--rv-jet-black,#132e3b);}
  .wipe.run .p1{animation:wSweep 1s cubic-bezier(.6,0,.2,1) forwards;}
  .wipe.run .p2{animation:wSweep 1s cubic-bezier(.6,0,.2,1) .12s forwards;}
  .wipe .wlogo{position:absolute;left:50%;top:50%;width:220px;height:220px;
    transform:translate(-50%,-50%) scale(.6);opacity:0;
    background:url("../assets/rivalry-logo.svg") center/contain no-repeat;}
  .wipe.run .wlogo{animation:wLogo 1.12s cubic-bezier(.3,1.4,.4,1) .3s forwards;}
  @keyframes wSweep{0%{transform:translateX(0) skewX(-12deg);}
    100%{transform:translateX(215%) skewX(-12deg);}}
  @keyframes wLogo{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.15);}}

  /* ---------- safe-area outline helper ---------- */
  #safeOutline{position:absolute;z-index:50;border:1px dashed rgba(26,188,156,.9);
    pointer-events:none;display:none;}
  body.showSafe #safeOutline{display:block;}

  /* ---------- control deck (not part of the stage) ---------- */
  #deck{flex:none;background:#10181f;border-top:1px solid #223240;
    padding:10px 16px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;
    color:#cfd8de;font-size:13px;}
  #deck .grp{display:flex;gap:6px;align-items:center;}
  #deck .grp b{font-size:11px;letter-spacing:.14em;color:#7d95a5;margin-right:4px;}
  #deck button{background:#1a2833;color:#e8eef2;border:1px solid #2c4254;
    padding:6px 12px;cursor:pointer;font:inherit;}
  #deck button.on{background:#f1c40f;color:#132e3b;border-color:#f1c40f;font-weight:700;}
  #deck .hint{margin-left:auto;color:#5d7385;font-size:12px;}
</style>
</head>
<body class="showSafe">
<div id="wrap">
  <div id="stageBox">
    <div class="rv-stage tB" id="stage">
      <div id="sceneLayer" style="display:none"></div>
      <div id="gameLayer"></div>

      <div class="rail left">
        <div class="logo"></div>
        <div class="wordmark">RIVALRY</div>
        <div class="eventmeta" id="eventMeta">SUMMER CIRCUIT 2026 &bull; 3V3 EAST</div>
      </div>

      <div class="rail right">
        <div class="follow">FOLLOW</div>
        <div class="tiles">
          <div class="tile" title="Discord"><svg viewBox="0 0 24 24"><path d="M19.3 5.3A16.9 16.9 0 0 0 15.2 4l-.2.4a15.6 15.6 0 0 1 3.8 1.9A12.7 12.7 0 0 0 5.2 6.3a15.6 15.6 0 0 1 3.8-1.9L8.8 4a16.9 16.9 0 0 0-4.1 1.3A17.6 17.6 0 0 0 1.6 17a17 17 0 0 0 5.2 2.6l.4-.6a10.7 10.7 0 0 1-1.7-.8l.4-.3a12.2 12.2 0 0 0 12.2 0l.4.3c-.5.3-1.1.6-1.7.8l.4.6A17 17 0 0 0 22.4 17a17.6 17.6 0 0 0-3.1-11.7ZM8.7 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg></div>
          <div class="tile" title="X"><svg viewBox="0 0 24 24"><path d="M17.5 3h3.1l-6.8 7.8L21.8 21h-6.3l-4.9-6.4L5 21H1.9l7.3-8.3L2.2 3h6.4l4.4 5.9L17.5 3Zm-1.1 16h1.7L7.7 4.7H5.9L16.4 19Z"/></svg></div>
          <div class="tile" title="Twitch"><svg viewBox="0 0 24 24"><path d="M4.3 2 2.5 6.4v14.2h4.9V23h2.7l2.4-2.4h3.7l5-5V2H4.3Zm15.1 12.7-2.9 2.9h-4.5l-2.4 2.4v-2.4H5.9V3.8h13.5v10.9ZM16.7 7v5.3h-1.8V7h1.8Zm-4.9 0v5.3H10V7h1.8Z"/></svg></div>
        </div>
        <div class="showcase rotating" id="showcase">
          <div class="sc-label" id="scLabel">FRANCHISE</div>
          <div class="sc-logo" id="scLogo">FR</div>
        </div>
      </div>

      <div class="ticker" id="ticker">
        <div class="badge">RIVALRY</div>
        <div class="items" id="tickerItems"></div>
        <div class="stream">STREAM &bull; TWITCH.TV/RIVALRY</div>
      </div>

      <div class="lower3" id="lower3">
        <div class="bar"></div>
        <div class="body">
          <div class="l3-title" id="l3Title">ALEX "COOKIES" TOLL</div>
          <div class="l3-sub" id="l3Sub">PLAY-BY-PLAY</div>
        </div>
      </div>

      <div id="safeOutline"></div>

      <div class="wipe" id="wipe">
        <div class="p p2"></div>
        <div class="p p1"></div>
        <div class="wlogo"></div>
      </div>
    </div>
  </div>

  <div id="deck">
    <div class="grp" id="gTreat"><b>TREATMENT</b>
      <button data-t="tA">A solid slab</button>
      <button data-t="tB" class="on">B kinetic seam</button>
      <button data-t="tC">C glass edge</button>
    </div>
    <div class="grp" id="gGeom"><b>GEOMETRY</b>
      <button data-g="64" class="on">rails 64 / ticker 72</button>
      <button data-g="80">rails 80 / ticker 90</button>
    </div>
    <div class="grp" id="gDens"><b>TICKER</b>
      <button data-d="std" class="on">standard</button>
      <button data-d="compact">compact text</button>
    </div>
    <div class="grp" id="gShow"><b>SHOWCASE</b>
      <button data-s="franchise" class="on">franchise</button>
      <button data-s="partner">partner</button>
      <button data-s="off">off</button>
    </div>
    <div class="grp" id="gBack"><b>UNDER IT</b>
      <button data-b="game" class="on">gameplay (shrunk to fit)</button>
      <button data-b="scene">starting soon (full bleed)</button>
    </div>
    <div class="grp"><b>LOWER THIRD</b>
      <button id="btnL3Caster">caster</button>
      <button id="btnL3Ann">announcement</button>
      <button id="btnL3Off">hide</button>
    </div>
    <div class="grp">
      <button id="btnWipe">RUN WIPE</button>
      <button id="btnSafe" class="on">safe area</button>
    </div>
    <div class="hint">keys: 1/2/3 treatment &middot; g geometry &middot; w wipe &middot; s safe area</div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var stage = document.getElementById("stage");

  /* ---- fit the 1920x1080 stage into the window (contain) ---- */
  function fit() {
    var box = document.getElementById("stageBox").getBoundingClientRect();
    var s = Math.min(box.width / 1920, box.height / 1080);
    stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  /* ---- geometry: rails + ticker + derived safe area ---- */
  var geom = 64;
  function applyGeometry() {
    var rail = geom, ticker = Math.round(geom * 1.125); // keeps interior 16:9
    document.documentElement.style.setProperty("--rail", rail + "px");
    document.documentElement.style.setProperty("--ticker", ticker + "px");
    var sa = { x: rail, y: 0, w: 1920 - 2 * rail, h: 1080 - ticker };
    var game = document.getElementById("gameLayer");
    game.style.left = sa.x + "px";
    game.style.top = sa.y + "px";
    game.style.width = sa.w + "px";
    game.style.height = sa.h + "px";
    var o = document.getElementById("safeOutline");
    o.style.left = sa.x + "px";
    o.style.top = sa.y + "px";
    o.style.width = sa.w - 2 + "px";
    o.style.height = sa.h - 2 + "px";
  }
  applyGeometry();

  /* ---- deck wiring ---- */
  function seg(groupId, attr, fn) {
    var g = document.getElementById(groupId);
    g.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      g.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      fn(b.getAttribute(attr));
    });
  }
  seg("gTreat", "data-t", setTreatment);
  seg("gGeom", "data-g", function (v) { geom = +v; applyGeometry(); });
  seg("gDens", "data-d", function (v) {
    document.getElementById("ticker").parentElement.classList.toggle("compact", v === "compact");
  });
  seg("gShow", "data-s", function (v) {
    var sc = document.getElementById("showcase");
    sc.style.display = v === "off" ? "none" : "";
    document.getElementById("scLabel").textContent = v === "partner" ? "PARTNER" : "FRANCHISE";
    document.getElementById("scLogo").textContent = v === "partner" ? "PX" : "FR";
  });
  seg("gBack", "data-b", function (v) {
    document.getElementById("gameLayer").style.display = v === "game" ? "" : "none";
    document.getElementById("sceneLayer").style.display = v === "scene" ? "" : "none";
  });

  function setTreatment(t) {
    stage.classList.remove("tA", "tB", "tC");
    stage.classList.add(t);
    document.querySelectorAll("#gTreat button").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-t") === t);
    });
  }

  /* ---- lower third ---- */
  var l3Timer = null;
  function showL3(title, sub, holdMs) {
    document.getElementById("l3Title").textContent = title;
    document.getElementById("l3Sub").textContent = sub;
    var el = document.getElementById("lower3");
    el.classList.add("on");
    clearTimeout(l3Timer);
    if (holdMs) l3Timer = setTimeout(function () { el.classList.remove("on"); }, holdMs);
  }
  document.getElementById("btnL3Caster").onclick = function () {
    showL3('ALEX "COOKIES" TOLL', "PLAY-BY-PLAY", 8000);
  };
  document.getElementById("btnL3Ann").onclick = function () {
    showL3("FINALS THIS SATURDAY", "8:00 PM ET • TWITCH.TV/RIVALRY", 8000);
  };
  document.getElementById("btnL3Off").onclick = function () {
    clearTimeout(l3Timer);
    document.getElementById("lower3").classList.remove("on");
  };

  /* ---- wipe ---- */
  function runWipe() {
    var w = document.getElementById("wipe");
    w.classList.remove("run");
    void w.offsetWidth;
    w.classList.add("run");
    setTimeout(function () { w.classList.remove("run"); }, 1600);
  }
  document.getElementById("btnWipe").onclick = runWipe;

  document.getElementById("btnSafe").onclick = function () {
    document.body.classList.toggle("showSafe");
    this.classList.toggle("on");
  };

  /* ---- ticker: the three real sources, cycling ---- */
  var items = [
    { html: '<span class="k">UP NEXT</span> FROST <span class="vs">vs</span> EMBER <span class="k">8:30 PM ET</span>' },
    { html: '<span class="live-dot"></span> <span class="k">LIVE NOW</span> GUARDIANS <span class="vs">vs</span> SENTINELS <span class="k">GAME 3</span>' },
    { html: '<span class="k">RECORDS</span> FROST <span class="rec">4-1</span> <span class="vs">&bull;</span> EMBER <span class="rec">3-2</span>' },
    { html: '<span class="k">TONIGHT</span> SERIES 3 <span class="vs">&bull;</span> NOVA <span class="vs">vs</span> ECLIPSE <span class="k">9:30 PM ET</span>' },
    { html: '<span class="k">RIVALRY</span> SIGN-UPS FOR FALL CIRCUIT OPEN AUGUST 15 &bull; THERIVALRY.GG' },
  ];
  var host = document.getElementById("tickerItems");
  items.forEach(function (it) {
    var d = document.createElement("div");
    d.className = "t-item";
    d.innerHTML = it.html;
    host.appendChild(d);
  });
  var idx = 0;
  function cycle() {
    var kids = host.children;
    for (var i = 0; i < kids.length; i++) kids[i].classList.toggle("on", i === idx);
    idx = (idx + 1) % kids.length;
  }
  cycle();
  setInterval(cycle, 5000);

  /* ---- keys ---- */
  document.addEventListener("keydown", function (e) {
    if (e.key === "1") setTreatment("tA");
    if (e.key === "2") setTreatment("tB");
    if (e.key === "3") setTreatment("tC");
    if (e.key === "w") runWipe();
    if (e.key === "s") document.getElementById("btnSafe").click();
    if (e.key === "g") {
      var next = geom === 64 ? "80" : "64";
      document.querySelector('#gGeom [data-g="' + next + '"]').click();
    }
  });
})();
</script>
</body>
</html>
