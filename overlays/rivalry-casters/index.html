<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>RIVALRY — Casters</title>
<link rel="stylesheet" href="../shared/rivalry-theme.css" />
<style>
/* Casters overlay = a GRAPHICS layer only. The decorative background is punched
   with transparent cam holes so the real camera sources (VDO.Ninja browser
   sources or a webcam Video Capture Device) sit BEHIND this overlay in OBS and
   show through the frames. Two layouts via ?layout=duo (default) or ?layout=solo. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
.scene-root[data-scene="caster"]{position:relative;width:1920px;height:1080px;font-family:var(--rv-font-body);color:var(--rv-ink);overflow:hidden;}

/* Decorative background. EVERY decorative layer lives inside .cs-deco, and the
   mask (built in JS from the cam rects) is applied to that wrapper — not to the
   gradient alone. Masking only the gradient left the grid texture and the gold
   seam painting across the camera holes, i.e. straight over a caster's face. */
.scene-root[data-scene="caster"] .cs-deco{position:absolute;inset:0;}
.scene-root[data-scene="caster"] .cs-bg{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 20% 0%, rgba(47,125,255,.20), transparent 55%),
  radial-gradient(120% 80% at 82% 100%, rgba(255,118,1,.16), transparent 55%),
  linear-gradient(160deg,#163140 0%,#0d2330 46%,#0a1b25 100%);}
.scene-root[data-scene="caster"] .cs-grid-tex{position:absolute;inset:0;opacity:.12;
  background-image:linear-gradient(rgba(241,238,238,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(241,238,238,.10) 1px,transparent 1px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(110% 90% at 50% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(110% 90% at 50% 40%,#000 30%,transparent 80%);}
.scene-root[data-scene="caster"] .cs-seam{position:absolute;top:-10%;height:120%;left:-150px;width:380px;transform:skewX(-12deg);
  background:linear-gradient(180deg,rgba(241,196,15,.18),rgba(241,196,15,0));filter:blur(2px);}

.scene-root[data-scene="caster"] .cs-top{position:absolute;top:54px;left:112px;right:112px;display:flex;align-items:flex-start;justify-content:space-between;}
.scene-root[data-scene="caster"] .cs-brand{display:flex;align-items:center;gap:20px;}
.scene-root[data-scene="caster"] .cs-mark{width:74px;height:50px;background:var(--rv-white-smoke);
  -webkit-mask:url(../../assets/rivalry-logo.svg) center/contain no-repeat;mask:url(../../assets/rivalry-logo.svg) center/contain no-repeat;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));}
.scene-root[data-scene="caster"] .cs-league{font-family:var(--rv-font-display);font-style:italic;font-weight:800;font-size:30px;letter-spacing:.14em;text-shadow:0 2px 8px rgba(0,0,0,.6);}
.scene-root[data-scene="caster"] .cs-titleblock{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
.scene-root[data-scene="caster"] .cs-kick{font-family:var(--rv-font-display);font-style:italic;font-weight:700;font-size:20px;letter-spacing:.42em;color:var(--rv-gold);text-indent:.42em;}
.scene-root[data-scene="caster"] .cs-title{font-family:var(--rv-font-display);font-style:italic;font-weight:800;font-size:62px;line-height:.96;margin:2px 0 0;letter-spacing:.02em;text-transform:uppercase;}
.scene-root[data-scene="caster"] .cs-underbar{margin-top:8px;width:150px;height:4px;background:linear-gradient(90deg,var(--rv-gold),rgba(241,196,15,0));}
.scene-root[data-scene="caster"] .cs-event{font-family:var(--rv-font-display);font-style:italic;font-weight:700;font-size:17px;letter-spacing:.20em;color:var(--rv-muted);text-align:right;max-width:420px;}

/* Frames are absolutely positioned per layout rect (set in JS). The interior is
   fully transparent (the cam shows through); only the border chrome + nameplate
   paint. */
.scene-root[data-scene="caster"] .cs-frame{position:absolute;background:transparent;
  box-shadow:0 20px 56px rgba(0,0,0,.55), inset 0 0 0 2px rgba(241,196,15,.32), inset 0 0 0 5px rgba(0,0,0,.5);}
.scene-root[data-scene="caster"] .cs-frame::before{content:"";position:absolute;left:-2px;top:-2px;width:60px;height:60px;
  border-top:4px solid var(--rv-gold);border-left:4px solid var(--rv-gold);}
.scene-root[data-scene="caster"] .cs-frame::after{content:"";position:absolute;right:-2px;bottom:-2px;width:60px;height:60px;
  border-bottom:4px solid var(--rv-gold);border-right:4px solid var(--rv-gold);}
.scene-root[data-scene="caster"] .cs-plate{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 14px;display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(0deg, rgba(8,14,20,.96) 12%, rgba(8,14,20,.55) 62%, transparent);}
.scene-root[data-scene="caster"] .cs-plate::before{content:"";position:absolute;left:0;top:0;width:64px;height:4px;background:var(--rv-gold);}
.scene-root[data-scene="caster"] .cs-name{font-family:var(--rv-font-display);font-style:italic;font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1;}
.scene-root[data-scene="caster"] .cs-role{font-family:var(--rv-font-display);font-style:italic;font-weight:700;font-size:13px;letter-spacing:.24em;color:var(--rv-gold);text-transform:uppercase;margin-top:4px;}
/* Preview-only hint shown when this page is opened without cameras behind it
   (design review, control-panel preview). Hidden on air via ?live=1 so it never
   sits over a real cam. */
.scene-root[data-scene="caster"] .cs-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--rv-font-display);font-style:italic;font-weight:800;font-size:22px;letter-spacing:.3em;color:rgba(241,238,238,.22);text-transform:uppercase;}
.scene-root[data-scene="caster"][data-live="1"] .cs-hint{display:none;}

.scene-root[data-scene="caster"] .cs-foot{position:absolute;left:0;right:0;bottom:34px;text-align:center;
  font-family:var(--rv-font-display);font-style:italic;font-weight:700;font-size:15px;letter-spacing:.28em;color:var(--rv-muted);text-transform:uppercase;}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root" data-scene="caster">
      <div class="cs-deco" id="csDeco">
        <div class="cs-bg"></div>
        <div class="cs-grid-tex"></div>
        <div class="cs-seam"></div>
      </div>
      <header class="cs-top">
        <div class="cs-brand">
          <div class="cs-mark"></div>
          <span class="cs-league" data-field="brand.leagueName">RIVALRY</span>
        </div>
        <div class="cs-titleblock">
          <span class="cs-kick">ON THE</span>
          <h1 class="cs-title">CALL</h1>
          <span class="cs-underbar"></span>
        </div>
        <span class="cs-event" data-field="eventTitle">RIVALRY SEASON 1</span>
      </header>
      <div id="csFrames"></div>
      <footer class="cs-foot" data-field="round">CASTERS</footer>
    </div>
  </div>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-bind.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script>
  (function () {
    var root = document.querySelector('.scene-root');
    var params = new URLSearchParams(location.search);

    // Fixed cam rects (px on the 1920x1080 stage). The producer places the OBS
    // cam sources at these same rects behind the overlay BY HAND — nothing in
    // the app pre-places cam sources, so this block is the single written
    // source of truth for where the holes are.
    var LAYOUTS = {
      duo:  [ { x: 90,  y: 300, w: 853, h: 480 }, { x: 977, y: 300, w: 853, h: 480 } ],
      solo: [ { x: 360, y: 250, w: 1200, h: 675 } ],
    };
    var layout = LAYOUTS[params.get('layout')] ? params.get('layout') : 'duo';
    var rects = LAYOUTS[layout];
    // ?live=1 hides the "CAMERA N" preview hint (set on the OBS browser source
    // URL so it never paints over a real cam).
    if (params.get('live') === '1') root.setAttribute('data-live', '1');

    // Punch transparent holes through ALL the decorative art at each cam rect,
    // so the camera sources behind this overlay in OBS show through cleanly.
    //
    // The mask is ONE path with even-odd fill: an outer 1920x1080 subpath plus
    // one subpath per cam rect. Even-odd makes the interior of each rect fall
    // outside the fill, so those pixels have alpha 0.
    //
    // It has to be alpha, not a black-on-white image: CSS mask-image samples an
    // SVG's ALPHA channel by default, so black rects on a white rect are all
    // equally opaque and mask nothing at all. That is exactly what this overlay
    // did before — the mask looked right in the source and was a silent no-op,
    // leaving the grid texture and gold seam painted across the casters' faces.
    (function maskHoles() {
      var d = 'M0 0H1920V1080H0Z';
      rects.forEach(function (r) {
        d += 'M' + r.x + ' ' + r.y + 'H' + (r.x + r.w) + 'V' + (r.y + r.h) + 'H' + r.x + 'Z';
      });
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">' +
        '<path fill="#fff" fill-rule="evenodd" d="' + d + '"/></svg>';
      var uri = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
      var deco = document.getElementById('csDeco');
      deco.style.webkitMaskImage = uri; deco.style.maskImage = uri;
      deco.style.webkitMaskSize = '1920px 1080px'; deco.style.maskSize = '1920px 1080px';
      deco.style.webkitMaskRepeat = 'no-repeat'; deco.style.maskRepeat = 'no-repeat';
    })();

    // Build a frame (border chrome + nameplate) at each rect.
    var frames = document.getElementById('csFrames');
    var plates = rects.map(function (r, i) {
      var f = document.createElement('div');
      f.className = 'cs-frame rv-cut';
      f.style.left = r.x + 'px'; f.style.top = r.y + 'px'; f.style.width = r.w + 'px'; f.style.height = r.h + 'px';
      var hint = document.createElement('div'); hint.className = 'cs-hint'; hint.textContent = 'Camera ' + (i + 1);
      f.appendChild(hint);
      var plate = document.createElement('div'); plate.className = 'cs-plate';
      var nm = document.createElement('span'); nm.className = 'cs-name';
      var role = document.createElement('span'); role.className = 'cs-role';
      plate.appendChild(nm); plate.appendChild(role);
      f.appendChild(plate);
      frames.appendChild(f);
      return { nm: nm, role: role, hint: hint };
    });

    // Nameplates come from the control feed (caster names/roles); the camera
    // video comes from the OBS sources behind, not from here.
    // ONE connect() per page: a second call would open a duplicate socket pair
    // with its own reconnect loop for the life of the OBS source.
    var rl = RivalryOverlay.connect({ game: false });
    RivalryBind(root, rl); // header: league / event / round
    rl.onControl(function (c) {
      var casters = (c && c.casters) || [];
      plates.forEach(function (p, i) {
        var caster = casters[i] || {};
        p.nm.textContent = caster.name || '';
        p.role.textContent = caster.role || '';
        p.hint.style.display = caster.name ? 'none' : ''; // once named, drop the placeholder label
      });
    });
    RivalryFit('.rv-stage');
  })();
  </script>
</body>
</html>
