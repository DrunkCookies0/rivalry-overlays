<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>RIVALRY · Casters</title>
<link rel="stylesheet" href="../shared/rivalry-theme.css" />
<link rel="stylesheet" href="../../assets/brand/rivalry-brand.css" />
<style>
/* Casters overlay = a GRAPHICS layer only. The Coal background is punched
   with transparent cam holes so the real camera sources (VDO.Ninja browser
   sources or a webcam Video Capture Device) sit BEHIND this overlay in OBS and
   show through the frames; the app places those sources itself. One frame per
   cam: the panel's cam count, or one per named caster (overlays/shared/
   rivalry-caster-cams.js, which the app reads too); ?layout=solo|duo|trio pins
   one.

   The Rivalry brand (2026-11 rebrand), after the broadcast concept's caster
   desk: square frames on a 1px Slate line, and each caster's name plate BELOW
   their cam (name in Chalk, role on an Emerald block) instead of over it. The
   cam rects themselves are unchanged. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
.scene-root[data-scene="caster"]{position:relative;width:1920px;height:1080px;font-family:var(--rv-font-body);color:var(--rv-chalk);overflow:hidden;}

/* Decorative background. EVERY decorative layer lives inside .cs-deco, and the
   mask (built in JS from the cam rects) is applied to that wrapper, so nothing
   decorative can paint across a camera hole. */
.scene-root[data-scene="caster"] .cs-deco{position:absolute;inset:0;}
.scene-root[data-scene="caster"] .cs-bg{position:absolute;inset:0;background:var(--rv-coal);}

/* Frames are absolutely positioned per layout rect (set in JS). The interior is
   fully transparent (the cam shows through). The 1px line sits outside the
   rect (outline), so it never covers a pixel of camera. */
.scene-root[data-scene="caster"] .cs-frame{position:absolute;background:transparent;outline:1px solid var(--rv-slate);}
.scene-root[data-scene="caster"] .cs-plate{position:absolute;left:-1px;right:-1px;top:100%;height:68px;box-sizing:border-box;
  display:flex;align-items:stretch;background:var(--rv-coal-raised);border:1px solid var(--rv-slate);}
.scene-root[data-scene="caster"] .cs-name{flex:1;min-width:0;display:flex;align-items:center;padding:4px 20px 0;
  font:700 40px/1 var(--rv-font-head);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scene-root[data-scene="caster"] .cs-role{flex:none;display:flex;align-items:center;padding:0 16px;
  background:var(--rv-emerald);color:var(--rv-coal);font:700 13px/1 var(--rv-font-mono);letter-spacing:.12em;text-transform:uppercase;}
.scene-root[data-scene="caster"] .cs-role:empty{display:none;}
/* Design-time guide: "CAMERA N" in an unnamed cam hole, for lining up the OBS
   cam sources. Opt-in only, via ?guides=1. Each cam is its own OBS source
   UNDER this hole, so on air the label would sit on top of a live camera. */
.scene-root[data-scene="caster"] .cs-hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font:400 22px/1 var(--rv-font-mono);letter-spacing:.16em;color:rgba(240,237,229,.32);text-transform:uppercase;}
.scene-root[data-scene="caster"][data-guides="1"] .cs-hint{display:flex;}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root" data-scene="caster">
      <div class="cs-deco" id="csDeco">
        <div class="cs-bg"></div>
      </div>
      <img class="rv-lockup" src="../../assets/brand/lockup-horizontal-emerald-on-dark.svg" alt="The Rivalry" />
      <div class="rv-tags">
        <span class="rv-tag em">On the call</span>
        <span class="rv-tag ln" data-field="eventTitle">RIVALRY SEASON 1</span>
        <span class="rv-tag ln" data-field="round">CASTERS</span>
      </div>
      <div id="csFrames"></div>
    </div>
  </div>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-bind.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script src="../shared/rivalry-caster-cams.js"></script>
  <script>
  (function () {
    var root = document.querySelector('.scene-root');
    var params = new URLSearchParams(location.search);

    // Fixed cam rects (px on the 1920x1080 stage) per cam count, from the
    // shared layout file: the app places each OBS cam source at the SAME rect
    // behind this overlay (bridge/caster-cams.js), so a cam always lines up
    // with its hole. ?layout=solo|duo|trio pins a count whatever the payload
    // says; the app reads the pin off this source's URL.
    var Cams = window.RivalryCasterCams;
    var RECTS = Cams.RECTS['rivalry-casters'];
    var PINS = { solo: 1, duo: 2, trio: 3 };
    var pinned = Object.prototype.hasOwnProperty.call(PINS, params.get('layout')) ? PINS[params.get('layout')] : 0;
    // ?guides=1 shows the "CAMERA N" design-time labels (see .cs-hint).
    if (params.get('guides') === '1') root.setAttribute('data-guides', '1');

    // Punch transparent holes through ALL the decorative art at each cam rect,
    // so the camera sources behind this overlay in OBS show through cleanly.
    //
    // The mask is ONE path with even-odd fill: an outer 1920x1080 subpath plus
    // one subpath per cam rect. Even-odd makes the interior of each rect fall
    // outside the fill, so those pixels have alpha 0.
    //
    // It has to be alpha, not a black-on-white image: CSS mask-image samples an
    // SVG's ALPHA channel by default, so black rects on a white rect are all
    // equally opaque and mask nothing at all.
    //
    // Each hole follows the frame's outline. The brand's corners are square, so
    // --rv-cut is 0 here; a 0 must stay 0 (a plain `|| 18` turned it back into
    // cut corners, letting square cams show past the hole).
    var deco = document.getElementById('csDeco');
    var cutRaw = parseFloat(getComputedStyle(root).getPropertyValue('--rv-cut'));
    var cut = isNaN(cutRaw) ? 18 : cutRaw;
    function maskHoles(rects) {
      var d = 'M0 0H1920V1080H0Z';
      rects.forEach(function (r) {
        var x2 = r.x + r.w, y2 = r.y + r.h;
        d += 'M' + r.x + ' ' + r.y + 'H' + (x2 - cut) + 'L' + x2 + ' ' + (r.y + cut) + 'V' + y2 +
          'H' + (r.x + cut) + 'L' + r.x + ' ' + (y2 - cut) + 'Z';
      });
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">' +
        '<path fill="#fff" fill-rule="evenodd" d="' + d + '"/></svg>';
      var uri = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
      deco.style.webkitMaskImage = uri; deco.style.maskImage = uri;
      deco.style.webkitMaskSize = '1920px 1080px'; deco.style.maskSize = '1920px 1080px';
      deco.style.webkitMaskRepeat = 'no-repeat'; deco.style.maskRepeat = 'no-repeat';
    }

    // Build a frame (outline + nameplate under it) at each rect for n cams and
    // punch the matching holes. Rebuilds only when the count changes.
    var frames = document.getElementById('csFrames');
    var plates = [], current = 0;
    function build(n) {
      if (n === current) return;
      current = n;
      var rects = RECTS[n];
      maskHoles(rects);
      frames.innerHTML = '';
      plates = rects.map(function (r, i) {
        var f = document.createElement('div');
        f.className = 'cs-frame';
        f.style.left = r.x + 'px'; f.style.top = r.y + 'px'; f.style.width = r.w + 'px'; f.style.height = r.h + 'px';
        var hint = document.createElement('div'); hint.className = 'cs-hint'; hint.textContent = 'Camera ' + (i + 1);
        f.appendChild(hint);
        var plate = document.createElement('div'); plate.className = 'cs-plate';
        var nm = document.createElement('span'); nm.className = 'cs-name';
        var role = document.createElement('span'); role.className = 'cs-role';
        plate.appendChild(nm); plate.appendChild(role);
        f.appendChild(plate);
        frames.appendChild(f);
        return { plate: plate, nm: nm, role: role, hint: hint };
      });
    }

    // Nameplates come from the control feed (caster names/roles); the camera
    // video comes from the OBS sources behind, not from here. ONE connect() per
    // page: a second call opens a duplicate control socket with its own
    // reconnect loop and its own copy of the state.
    var rl = RivalryOverlay.connect({ game: false });
    RivalryBind(root, rl); // header: event / round
    rl.onControl(function (c) {
      // One frame per cam; casters sharing a cam share its plate ("A & B").
      var n = pinned || Cams.camCount(c, 'rivalry-casters');
      build(n);
      var slots = Cams.slots(c, n);
      plates.forEach(function (p, i) {
        var slot = slots[i];
        p.nm.textContent = slot.name;
        p.role.textContent = slot.role;
        p.plate.style.display = slot.name ? '' : 'none'; // never an empty bar under a cam
        p.hint.style.display = slot.name ? 'none' : ''; // once named, drop the guide label
      });
    });
    RivalryFit('.rv-stage');
  })();
  </script>
</body>
</html>
