<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RIVALRY · Starting Soon</title>
<link rel="stylesheet" href="../shared/rivalry-theme.css" />
<link rel="stylesheet" href="../../assets/brand/rivalry-brand.css" />
<style>
/* The Rivalry brand (2026-11 rebrand). Layout from the locked decision
   prototype: lockup and tags across the top, "Starting soon." with the outlined
   Emerald half of the motif, the kickoff countdown, and the first match on a
   raised card. The chrome (rails 64, ticker 72) is layered on top of this
   scene, so everything sits inside the 1792x1008 window. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
.ss{position:absolute;inset:0;overflow:hidden;background:var(--rv-coal);color:var(--rv-chalk);font-family:var(--rv-font-body);}
.ss .lab{font:400 13px/1.2 var(--rv-font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rv-chalk-dim);}
.ss .tag{display:inline-flex;align-items:center;padding:4px 10px;font:700 13px/1.2 var(--rv-font-mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
.ss .tag.em{background:var(--rv-emerald);color:var(--rv-coal);}
.ss .tag.ln{border:1px solid var(--rv-slate);color:var(--rv-chalk-dim);font-weight:400;}
.ss .hd{font-family:var(--rv-font-head);font-weight:700;text-transform:uppercase;line-height:.9;}
.ss .o{color:transparent;-webkit-text-stroke:5px var(--rv-emerald);}

.ss-lock{position:absolute;left:124px;top:64px;height:120px;width:auto;}
.ss-tags{position:absolute;right:124px;top:92px;display:flex;gap:8px;max-width:960px;}
.ss-h{position:absolute;left:150px;top:280px;margin:0;font:700 190px/.86 var(--rv-font-head);text-transform:uppercase;}
.ss-h span{display:block;}
/* The countdown, or the typed start time when no kickoff time is set. */
.ss-cd{position:absolute;left:154px;top:660px;margin:0;max-width:980px;overflow:hidden;white-space:nowrap;
  font:700 150px/1 var(--rv-font-mono);font-variant-numeric:tabular-nums;}
.ss-cd.long{font-size:96px;top:700px;}
.ss-cdl{position:absolute;left:156px;top:822px;margin:0;}

.ss-next{position:absolute;right:124px;top:292px;width:620px;background:var(--rv-coal-raised);border:1px solid var(--rv-slate);}
.ss-next .nh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px;}
.ss-next .nh .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ss-next .nr{display:flex;align-items:center;gap:18px;padding:20px 24px;border-top:1px solid var(--rv-slate);}
.ss-next .ss-name{flex:1;min-width:0;font-size:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ss-next .meta{flex:none;display:flex;gap:14px;font:400 22px/1 var(--rv-font-mono);color:var(--rv-chalk-dim);}
.ss-next .nr.cs{justify-content:space-between;}
.ss-next .nr.cs b{font:600 22px/1.2 var(--rv-font-body);text-align:right;}

/* Team tiles: the shared .rv-tile (the league logo, else the brand symbol),
   the same tile every other scene uses. */
.ss-next .rv-tile{width:72px;height:72px;}
.ss-next .nr.a{--rv-side:var(--rv-team-blue);}
.ss-next .nr.b{--rv-side:var(--rv-team-orange);}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root ss" data-scene="starting-soon">
      <img class="ss-lock" src="../../assets/brand/lockup-horizontal-emerald-on-dark.svg" alt="The Rivalry" />
      <div class="ss-tags">
        <span class="tag ln" data-field="eventTitle">RIVALRY SEASON 1</span>
        <span class="tag em" id="tonight" style="display:none">Tonight · 3 series</span>
      </div>

      <h1 class="ss-h"><span>Starting</span><span class="o">soon.</span></h1>
      <p class="ss-cd" id="cd" style="display:none"></p>
      <p class="lab ss-cdl" id="cdl" style="display:none"></p>

      <section class="ss-next">
        <div class="nh">
          <span class="tag em">Up next</span>
          <span class="lab"><span data-field="round">UPPER BRACKET • ROUND 1</span> · Best of <span data-field="bestOf">5</span></span>
        </div>
        <div class="nr a">
          <span class="rv-tile rv-tbar" id="tileA" data-bg="teamA.logo"></span>
          <span class="hd ss-name" data-field="teamA.name">GUARDIANS</span>
          <span class="meta"><span data-field="teamA.seed">#1</span><span data-field="teamA.record">12-3</span></span>
        </div>
        <div class="nr b">
          <span class="rv-tile rv-tbar" id="tileB" data-bg="teamB.logo"></span>
          <span class="hd ss-name" data-field="teamB.name">SENTINELS</span>
          <span class="meta"><span data-field="teamB.seed">#4</span><span data-field="teamB.record">9-6</span></span>
        </div>
        <div class="nr cs" id="castersRow" style="display:none">
          <span class="lab">Casters</span><b id="casters"></b>
        </div>
      </section>
    </div>
  </div>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-bind.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    // Control-only scene: subscribe to the control bus (auto-mocks on file://).
    var rl = RivalryOverlay.connect({ game: false });
    RivalryBind(document.querySelector(".scene-root"), rl);
    // Resolution-independent: scale the 1920x1080 design to fill any source size.
    // Append ?fit=cover to the source URL to fill+crop instead of letterbox on non-16:9.
    RivalryFit(".rv-stage");

    // RivalryBind paints the logo; .has-logo swaps out the brand symbol.
    function team(side, t) {
      $("tile" + side).classList.toggle("has-logo", !!(t && t.logo));
    }

    // kickoffAt is the producer's own clock (epoch ms from the panel's "First
    // kickoff" picker), not the league's match time: that one is local time
    // labelled UTC until the website fixes it, so it can be hours off.
    var kickoffAt = 0, startText = "";
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function tick() {
      var cd = $("cd"), lbl = $("cdl");
      if (kickoffAt > 0) {
        var s = Math.max(0, Math.ceil((kickoffAt - Date.now()) / 1000));
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        cd.textContent = (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s % 60);
        cd.classList.remove("long");
        lbl.textContent = s > 0 ? "Countdown to first kickoff" : "Starting now";
      } else if (startText) {
        cd.textContent = startText;
        cd.classList.toggle("long", startText.length > 9);
        lbl.textContent = "First kickoff";
      }
      var show = kickoffAt > 0 || !!startText;
      cd.style.display = lbl.style.display = show ? "" : "none";
    }

    rl.onControl(function (c) {
      c = c || {};
      team("A", c.teamA);
      team("B", c.teamB);
      var names = (Array.isArray(c.casters) ? c.casters : [])
        .map(function (x) { return x && x.name; }).filter(Boolean);
      $("casters").textContent = names.join(" & ");
      $("castersRow").style.display = names.length ? "" : "none";
      var n = c.schedule && Array.isArray(c.schedule.series) ? c.schedule.series.length : 0;
      $("tonight").textContent = "Tonight · " + n + " series";
      $("tonight").style.display = n ? "" : "none";
      kickoffAt = Number(c.kickoffAt) || 0;
      startText = String(c.startTime || "").trim();
      tick();
    });
    setInterval(tick, 250);
  })();
  </script>
</body>
</html>
