<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RIVALRY Chrome</title>
<!--
  The persistent broadcast frame: left/right rails, bottom ticker, producer
  lower thirds, and the branded wipe. Added ONCE in OBS as a browser source
  layered above every scene; the interior window it leaves open is the safe
  area every other scene (and the game capture) fits inside.

  Geometry comes from ../shared/rivalry-geometry.js (single source, guarded by
  tests). Data rides the control bus as the additive v1 fields documented in
  overlays/CONTRACT.md: chrome, ticker, lowerThird, schedule. The wipe fires on
  the transient "chrome-wipe" bus message (never retained, so a reloaded scene
  can never replay an old wipe).

  The Rivalry brand (2026-11 rebrand), from the locked decision prototype:
  Coal rails and ticker on a 1px Slate edge, one fixed-width Emerald tag in the
  ticker naming the current item, the upright symbol and event line on the
  left rail (the league), follow + socials on the right rail, whose bottom is
  kept for league-pushed sponsors. The wipe keeps its timing until the new
  stinger lands; only its colors and mark follow the brand for now.
-->
<link rel="stylesheet" href="../shared/rivalry-theme.css">
<link rel="stylesheet" href="../../assets/brand/rivalry-brand.css">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  .rv-stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;
    font-family:var(--rv-font-body);color:var(--rv-chalk);}

  /* Geometry: JS stamps --rail/--ticker from RivalryGeometry before first paint. */
  .rv-stage{--rail:64px;--ticker:72px;}
  .rail{position:absolute;top:0;bottom:var(--ticker);width:var(--rail);z-index:40;
    display:flex;flex-direction:column;align-items:center;background:var(--rv-coal);}
  .rail.left{left:0;}
  .rail.right{right:0;}
  .ticker{position:absolute;left:0;right:0;bottom:0;height:var(--ticker);z-index:41;box-sizing:border-box;
    display:flex;align-items:center;background:var(--rv-coal-raised);border-top:1px solid var(--rv-slate);}

  /* The 1px Slate line around the game window, on the bars' inner pixel. */
  .frame-seam{position:absolute;z-index:42;pointer-events:none;
    left:calc(var(--rail) - 1px);right:calc(var(--rail) - 1px);
    top:0;bottom:calc(var(--ticker) - 1px);
    border:solid var(--rv-slate);border-width:0 1px 1px 1px;}

  /* Vertical rail type: plain text turned on its side. The symbol never rotates. */
  .vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;flex:none;
    font:400 13px/1 var(--rv-font-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--rv-chalk-dim);}

  /* Left rail: the league and the competition. */
  .rail .logo{width:49px;height:48px;margin-top:10px;flex:none;
    background:url("../../assets/brand/logo-emerald-on-dark.svg") center/contain no-repeat;}
  .rail .eventmeta{margin-top:auto;margin-bottom:22px;max-height:640px;overflow:hidden;}

  /* Right rail: follow + socials on top; the bottom is kept for sponsors. */
  .rail .tiles{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px;flex:none;}
  .tile{width:40px;height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    background:var(--rv-coal-raised);border:1px solid var(--rv-slate);color:var(--rv-chalk);
    font:700 16px/1 var(--rv-font-head);text-transform:uppercase;}
  .tile svg{width:20px;height:20px;fill:currentColor;}
  .rail .follow{margin-top:18px;}
  .rail .follow b{color:var(--rv-chalk);font-weight:700;}

  /* Ticker: one fixed-width Emerald tag naming the item, so it never jumps. */
  .badge{flex:none;align-self:stretch;width:170px;display:flex;align-items:center;justify-content:center;
    background:var(--rv-emerald);color:var(--rv-coal);
    font:700 16px/1 var(--rv-font-mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;}
  .items{flex:1;overflow:hidden;position:relative;align-self:stretch;}
  .t-item{position:absolute;inset:0;display:flex;align-items:center;gap:20px;padding:0 26px;
    opacity:0;transform:translateY(10px);white-space:nowrap;
    transition:opacity .35s var(--rv-ease-out,ease),transform .35s var(--rv-ease-out,ease);
    font:700 18px/1 var(--rv-font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rv-chalk);}
  .t-item.on{opacity:1;transform:none;}
  .t-item i{width:9px;height:9px;flex:none;box-sizing:border-box;background:currentColor;}
  .t-item i.ln{background:none;border:2px solid currentColor;}
  .t-item b{color:var(--rv-emerald);}
  .stream{flex:none;padding:0 26px;font:700 14px/1 var(--rv-font-mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--rv-chalk-dim);white-space:nowrap;}

  /* Lower third: solid Chalk name block + outlined Emerald detail block,
     centered above the ticker. Announcements lead in Emerald. */
  .lower3{position:absolute;z-index:45;left:50%;bottom:calc(var(--ticker) + 28px);
    display:flex;align-items:stretch;opacity:0;transform:translate(-50%,16px);pointer-events:none;
    transition:opacity .22s var(--rv-ease-out,ease),transform .22s var(--rv-ease-out,ease);}
  .lower3.on{opacity:1;transform:translate(-50%,0);}
  .lower3 .l3-title{display:flex;align-items:center;padding:10px 24px 6px;white-space:nowrap;
    background:var(--rv-chalk);color:var(--rv-coal);font:700 40px/1 var(--rv-font-head);text-transform:uppercase;}
  .lower3.kind-announce .l3-title{background:var(--rv-emerald);}
  .lower3 .l3-sub{display:flex;align-items:center;padding:10px 22px;white-space:nowrap;
    background:var(--rv-coal);border:2px solid var(--rv-emerald);border-left:0;
    font:700 18px/1 var(--rv-font-mono);letter-spacing:.06em;color:var(--rv-chalk);}
  .lower3 .l3-sub:empty{display:none;}

  /* Wipe: covers the whole canvas, driven by the transient chrome-wipe event.
     Timing unchanged (main.js cuts the scene at 450 ms, clears at 1600 ms). */
  .wipe{position:absolute;inset:0;z-index:60;display:none;pointer-events:none;}
  .wipe.run{display:block;}
  .wipe .p{position:absolute;top:0;bottom:0;width:120%;left:-130%;}
  .wipe .p1{background:var(--rv-emerald);}
  .wipe .p2{background:var(--rv-coal);}
  .wipe.run .p1{animation:wSweep 1s cubic-bezier(.6,0,.2,1) forwards;}
  .wipe.run .p2{animation:wSweep 1s cubic-bezier(.6,0,.2,1) .12s forwards;}
  .wipe .wlogo{position:absolute;left:50%;top:50%;width:280px;height:274px;
    transform:translate(-50%,-50%) scale(.6);opacity:0;
    background:url("../../assets/brand/logo-emerald-on-dark.svg") center/contain no-repeat;}
  .wipe.run .wlogo{animation:wLogo 1.12s cubic-bezier(.3,1.4,.4,1) .3s forwards;}
  @keyframes wSweep{0%{transform:translateX(0) skewX(-12deg);}100%{transform:translateX(215%) skewX(-12deg);}}
  @keyframes wLogo{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.15);}}
</style>
</head>
<body>
<div class="rv-stage" id="stage">
  <div class="frame-seam"></div>
  <div class="rail left">
    <div class="logo" role="img" aria-label="The Rivalry"></div>
    <div class="vt eventmeta" id="eventMeta"></div>
  </div>

  <div class="rail right">
    <div class="tiles" id="tiles"></div>
    <div class="vt follow" id="followLabel" style="display:none"></div>
  </div>

  <div class="ticker" id="ticker">
    <div class="badge" id="tickerBadge">RIVALRY</div>
    <div class="items" id="tickerItems"></div>
    <div class="stream" id="streamLine" style="display:none"></div>
  </div>

  <div class="lower3" id="lower3">
    <div class="l3-title" id="l3Title"></div>
    <div class="l3-sub" id="l3Sub"></div>
  </div>

  <div class="wipe" id="wipe">
    <div class="p p2"></div>
    <div class="p p1"></div>
    <div class="wlogo"></div>
  </div>
</div>

<script src="../shared/rivalry-geometry.js"></script>
<script src="../sdk/rivalry-fit.js"></script>
<script src="../sdk/rivalry-overlay-sdk.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage");

  // Geometry from the shared constant, stamped before first paint so the CSS
  // never carries a second copy of the numbers.
  var G = window.RivalryGeometry;
  if (G) {
    stage.style.setProperty("--rail", G.RAIL_WIDTH + "px");
    stage.style.setProperty("--ticker", G.TICKER_HEIGHT + "px");
  }

  RivalryFit(".rv-stage");

  /* ---- socials: known networks get their mark, unknown get a letter tile */
  var ICONS = {
    discord: '<svg viewBox="0 0 24 24"><path d="M19.3 5.3A16.9 16.9 0 0 0 15.2 4l-.2.4a15.6 15.6 0 0 1 3.8 1.9A12.7 12.7 0 0 0 5.2 6.3a15.6 15.6 0 0 1 3.8-1.9L8.8 4a16.9 16.9 0 0 0-4.1 1.3A17.6 17.6 0 0 0 1.6 17a17 17 0 0 0 5.2 2.6l.4-.6a10.7 10.7 0 0 1-1.7-.8l.4-.3a12.2 12.2 0 0 0 12.2 0l.4.3c-.5.3-1.1.6-1.7.8l.4.6A17 17 0 0 0 22.4 17a17.6 17.6 0 0 0-3.1-11.7ZM8.7 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M17.5 3h3.1l-6.8 7.8L21.8 21h-6.3l-4.9-6.4L5 21H1.9l7.3-8.3L2.2 3h6.4l4.4 5.9L17.5 3Zm-1.1 16h1.7L7.7 4.7H5.9L16.4 19Z"/></svg>',
    twitter: '<svg viewBox="0 0 24 24"><path d="M17.5 3h3.1l-6.8 7.8L21.8 21h-6.3l-4.9-6.4L5 21H1.9l7.3-8.3L2.2 3h6.4l4.4 5.9L17.5 3Zm-1.1 16h1.7L7.7 4.7H5.9L16.4 19Z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm5.3-4a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg>',
    twitch: '<svg viewBox="0 0 24 24"><path d="M4.3 2 2.5 6.4v14.2h4.9V23h2.7l2.4-2.4h3.7l5-5V2H4.3Zm15.1 12.7-2.9 2.9h-4.5l-2.4 2.4v-2.4H5.9V3.8h13.5v10.9ZM16.7 7v5.3h-1.8V7h1.8Zm-4.9 0v5.3H10V7h1.8Z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24"><path d="M23 7.6a2.9 2.9 0 0 0-2-2C19.2 5 12 5 12 5s-7.2 0-9 .5a2.9 2.9 0 0 0-2 2A30.6 30.6 0 0 0 .5 12c0 1.5.2 3 .5 4.4a2.9 2.9 0 0 0 2 2c1.8.6 9 .6 9 .6s7.2 0 9-.5a2.9 2.9 0 0 0 2-2c.3-1.5.5-3 .5-4.5s-.2-3-.5-4.4ZM9.7 15.6V8.4l6 3.6-6 3.6Z"/></svg>',
  };
  var MAX_SOCIALS = 5;

  var TICKER_CYCLE_MS = 6000;
  var tickerIdx = 0;
  var tickerTimer = null;
  var tickerSig = "";

  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  function renderSocials(socials) {
    var tiles = $("tiles");
    tiles.innerHTML = "";
    var list = Array.isArray(socials) ? socials.filter(function (s) { return s && (s.network || s.handle); }) : [];
    list = list.slice(0, MAX_SOCIALS);
    list.forEach(function (s) {
      var t = el("div", "tile");
      var key = String(s.network || "").trim().toLowerCase();
      if (ICONS[key]) t.innerHTML = ICONS[key];
      else t.textContent = (s.network || s.handle || "?").trim().slice(0, 1).toUpperCase();
      t.title = s.handle || s.network || "";
      tiles.appendChild(t);
    });
    // "Follow" plus the first @handle, the one most networks share.
    var follow = $("followLabel");
    follow.textContent = "";
    if (list.length) {
      follow.appendChild(document.createTextNode("Follow"));
      var at = list.filter(function (s) { return /^@/.test(String(s.handle || "").trim()); })[0];
      if (at) {
        follow.appendChild(document.createTextNode(" "));
        follow.appendChild(el("b", "", String(at.handle).trim()));
      }
    }
    follow.style.display = list.length ? "" : "none";
  }

  /* ---- ticker: three sources, one item list --------------------------------
     1. the schedule (live series + what is next), derived automatically
     2. team records for the loaded series
     3. the producer's manual lines plus typed items (unknown types skipped,
        so future item kinds are a no-op here instead of a break)
     Each item carries the word its Emerald tag shows while it is on.       */
  function buildTickerItems(c, league) {
    var items = [];
    var sched = c.schedule || {};
    var series = Array.isArray(sched.series) ? sched.series : [];
    var active = typeof sched.activeIndex === "number" ? sched.activeIndex : -1;

    var nameA = c.teamA && c.teamA.name, nameB = c.teamB && c.teamB.name;
    if (active >= 0 && series[active] && nameA && nameB) {
      var s = c.series || { a: 0, b: 0 };
      items.push({ tag: "Live", parts: [nameA + " vs " + nameB, "Series " + s.a + "-" + s.b]
        .concat(c.bestOf ? ["Best of " + c.bestOf] : []) });
    }
    series.forEach(function (e, i) {
      if (i <= active) return;
      var a = e.teamA && e.teamA.name, b = e.teamB && e.teamB.name;
      if (!a && !b) return;
      items.push({ tag: i === active + 1 ? "Up next" : "Tonight",
        parts: [(a || "TBD") + " vs " + (b || "TBD")].concat(e.startTimeDisplay ? [e.startTimeDisplay] : []) });
    });
    if (c.teamA && c.teamA.record && c.teamB && c.teamB.record && nameA && nameB) {
      items.push({ tag: "Records", parts: [nameA + " " + c.teamA.record, nameB + " " + c.teamB.record] });
    }
    var t = c.ticker || {};
    (Array.isArray(t.manualLines) ? t.manualLines : []).forEach(function (line) {
      if (line && line.trim()) items.push({ tag: league, parts: [line.trim()] });
    });
    (Array.isArray(t.items) ? t.items : []).forEach(function (it) {
      if (it && it.type === "text" && it.text) items.push({ tag: league, parts: [it.text] });
      // unknown item types: deliberately skipped, additive contract
    });
    if (!items.length) {
      if (c.eventTitle) items.push({ tag: league, title: c.eventTitle });
      else items.push({ tag: league, parts: [league] });
    }
    return items;
  }

  // eventTitle keeps its <b> emphasis, as the gameplay eventbar shows it. Only
  // a bare <b> / </b> becomes an element; every other token (any other tag
  // included) is appended as inert text, never parsed as HTML. One wrapping
  // span keeps the title a single flex item (.t-item gaps its children).
  function appendTitle(d, text) {
    var line = d.appendChild(el("span")), target = line;
    String(text).split(/(<\/?b>)/i).forEach(function (tok) {
      if (/^<b>$/i.test(tok)) { if (target === line) target = line.appendChild(el("b")); }
      else if (/^<\/b>$/i.test(tok)) target = line;
      else if (tok) target.appendChild(document.createTextNode(tok));
    });
  }

  // Parts are split by square markers, alternating solid and outlined (the
  // brand's solid-left / outlined-right motif).
  function renderTickerItem(host, it) {
    var d = el("div", "t-item");
    d.setAttribute("data-tag", it.tag);
    if (it.title) appendTitle(d, it.title);
    else it.parts.forEach(function (p, i) {
      if (i) d.appendChild(el("i", i % 2 ? "" : "ln"));
      d.appendChild(el("span", "", p));
    });
    host.appendChild(d);
    return d;
  }

  function renderTicker(c, league) {
    var items = buildTickerItems(c, league);
    // The panel pushes the full payload on every keystroke; rebuilding an
    // unchanged list would snap a crossfade.
    var sig = JSON.stringify(items);
    if (sig === tickerSig) return;
    tickerSig = sig;
    var host = $("tickerItems");
    host.innerHTML = "";
    items.forEach(function (it) { renderTickerItem(host, it); });
    if (tickerIdx >= host.children.length) tickerIdx = 0;
    cycleTicker(true);
    if (!tickerTimer) tickerTimer = setInterval(cycleTicker, TICKER_CYCLE_MS);
  }

  function cycleTicker(hold) {
    var kids = $("tickerItems").children;
    if (!kids.length) return;
    if (!hold) tickerIdx = (tickerIdx + 1) % kids.length;
    for (var i = 0; i < kids.length; i++) kids[i].classList.toggle("on", i === tickerIdx);
    $("tickerBadge").textContent = kids[tickerIdx].getAttribute("data-tag") || "";
  }

  /* ---- lower third ---------------------------------------------------------
     Retained-state safe via age, not flags: the panel stamps shownAt (epoch
     ms, same machine so no clock skew) when the producer calls it. A timed
     lower third shows only for its REMAINING time, so the bus replaying
     retained state to a fresh page can never resurrect one that already ran
     out. A held one (durationSec 0) survives a browser-source refresh, which
     is what a producer wants mid-segment, but a page that first sees it older
     than HOLD_REPLAY_MAX (a replay) skips it, so yesterday's hold never haunts
     tonight. A page already showing the hold keeps it until Hide or a new call. */
  var HOLD_REPLAY_MAX_S = 300;
  var l3Timer = null;
  var l3LastShownAt = 0;
  function renderLowerThird(lt) {
    var host = $("lower3");
    if (!lt || !lt.visible || !lt.shownAt) {
      l3LastShownAt = 0;
      clearTimeout(l3Timer);
      host.classList.remove("on");
      return;
    }
    var ageS = (Date.now() - Number(lt.shownAt)) / 1000;
    var hold = Number(lt.durationSec) || 0;
    var firstSight = lt.shownAt !== l3LastShownAt;
    // The hold age-out is for a page REPLAYING retained state. The panel
    // re-pushes the full payload on every keystroke, so judging an on-air hold
    // by its age would drop it mid-segment.
    var expired = hold > 0 ? ageS >= hold : (firstSight && ageS >= HOLD_REPLAY_MAX_S);
    if (expired) {
      clearTimeout(l3Timer);
      host.classList.remove("on");
      return;
    }
    if (!firstSight) return; // merge repeat of the same call
    l3LastShownAt = lt.shownAt;
    $("l3Title").textContent = lt.title || "";
    $("l3Sub").textContent = lt.subtitle || "";
    host.className = "lower3 on kind-" + (lt.kind || "caster");
    clearTimeout(l3Timer);
    if (hold > 0) {
      var remainingMs = Math.max(0, hold - ageS) * 1000;
      l3Timer = setTimeout(function () { host.classList.remove("on"); }, remainingMs);
    }
  }

  /* ---- wipe ---- */
  var wipeTimer = null;
  function runWipe() {
    var w = $("wipe");
    // A second deck switch inside 1.6 s restarts the sweep; the first call's
    // timer must not cut the new one off mid-canvas.
    clearTimeout(wipeTimer);
    w.classList.remove("run");
    void w.offsetWidth;
    w.classList.add("run");
    wipeTimer = setTimeout(function () { w.classList.remove("run"); }, 1600);
  }

  /* ---- render from control state ---- */
  function render(c) {
    var ch = c.chrome || {};
    var league = String(ch.leagueName || (c.brand && c.brand.leagueName) || "RIVALRY").toUpperCase();

    var ev = c.schedule && c.schedule.event ? c.schedule.event : {};
    var meta = [ch.seasonName || ev.season, ch.circuitName || ev.circuit, ev.tier]
      .filter(Boolean).join(" · ");
    $("eventMeta").textContent = meta;

    var stream = ch.streamLine || "";
    $("streamLine").textContent = stream;
    $("streamLine").style.display = stream ? "" : "none";

    // chrome.showcase is deliberately not drawn: the right rail's bottom is
    // kept for league-pushed sponsors (CONTRACT.md).
    renderSocials(ch.socials);
    renderTicker(c, league);
    renderLowerThird(c.lowerThird);
  }

  var ov = RivalryOverlay.connect({ game: false });
  ov.onControl(render);
  ov.onBus("chrome-wipe", runWipe);
})();
</script>
</body>
</html>
