<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>RIVALRY — Bracket</title>
<link rel="stylesheet" href="../shared/rivalry-theme.css" />
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
.scene-root[data-scene="bracket"]{position:absolute;inset:0;overflow:hidden;font-family:var(--rv-font-body);color:var(--rv-ink);background:var(--rv-jet-black);}

/* --- ambient backdrop (matches preview/up-next) --- */
.scene-root[data-scene="bracket"] .br-bg{position:absolute;inset:0;background:radial-gradient(130% 120% at 18% 0%,var(--rv-surface-2) 0%,var(--rv-yale-blue) 30%,var(--rv-jet-black) 74%,#091820 100%);}
.scene-root[data-scene="bracket"] .br-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(47,125,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(47,125,255,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(120% 100% at 50% 46%,#000 55%,transparent 100%);mask-image:radial-gradient(120% 100% at 50% 46%,#000 55%,transparent 100%);}
.scene-root[data-scene="bracket"] .br-lines{position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 108px,rgba(241,238,238,.03) 108px 110px);animation:brDrift 22s linear infinite;}
@keyframes brDrift{from{transform:translateX(0);}to{transform:translateX(110px);}}
/* signature glowing diagonal gold seam */
.scene-root[data-scene="bracket"] .br-seam{position:absolute;top:-8%;bottom:-8%;left:78%;width:9px;transform:translateX(-50%) skewX(-12deg);background:linear-gradient(180deg,transparent,var(--rv-teal) 26%,var(--rv-gold) 58%,transparent);box-shadow:0 0 30px rgba(241,196,15,.55);opacity:.85;}
.scene-root[data-scene="bracket"] .br-glow{position:absolute;right:-4%;top:24%;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(241,196,15,.18),transparent 64%);filter:blur(8px);}

.scene-root[data-scene="bracket"] .br-frame{position:absolute;inset:48px;display:flex;flex-direction:column;}

/* --- header --- */
.scene-root[data-scene="bracket"] .br-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;}
.scene-root[data-scene="bracket"] .br-brand{display:flex;align-items:center;gap:18px;padding-bottom:10px;}
.scene-root[data-scene="bracket"] .br-mark{width:72px;height:48px;background:var(--rv-white-smoke);-webkit-mask:url(../../assets/rivalry-logo.svg) center/contain no-repeat;mask:url(../../assets/rivalry-logo.svg) center/contain no-repeat;filter:drop-shadow(0 0 12px rgba(47,125,255,.5));}
.scene-root[data-scene="bracket"] .br-league{font-family:var(--rv-font-display);font-style:italic;font-weight:800;font-size:30px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.6);}
.scene-root[data-scene="bracket"] .br-titleblock{display:flex;flex-direction:column;align-items:flex-end;text-align:right;}
.scene-root[data-scene="bracket"] .br-kick{font-family:var(--rv-font-display);font-style:italic;font-weight:700;font-size:16px;letter-spacing:.26em;text-transform:uppercase;color:var(--rv-gold);margin-bottom:4px;}
.scene-root[data-scene="bracket"] .br-title{margin:0;font-family:var(--rv-font-display);font-style:italic;font-weight:800;font-size:72px;line-height:.86;text-transform:uppercase;color:var(--rv-white-smoke);text-shadow:0 8px 24px rgba(0,0,0,.65);}
.scene-root[data-scene="bracket"] .br-title em{font-style:italic;color:var(--rv-gold);text-shadow:0 0 28px rgba(241,196,15,.5),0 8px 24px rgba(0,0,0,.65);}
.scene-root[data-scene="bracket"] .br-underbar{display:block;margin-top:12px;width:260px;height:6px;background:linear-gradient(90deg,var(--rv-blue),var(--rv-teal) 55%,var(--rv-gold));transform:skewX(-12deg);box-shadow:0 0 18px rgba(47,125,255,.5);}

/* --- board: 4 columns + connector layer --- */
.scene-root[data-scene="bracket"] .br-board{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:stretch;}
.scene-root[data-scene="bracket"] .br-connectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;}
.scene-root[data-scene="bracket"] .br-line{fill:none;stroke:rgba(47,125,255,.55);stroke-width:3;filter:drop-shadow(0 0 6px rgba(47,125,255,.35));}
.scene-root[data-scene="bracket"] .br-line-gold{stroke:var(--rv-gold);stroke-width:4;filter:drop-shadow(0 0 10px rgba(241,196,15,.55));}

.scene-root[data-scene="bracket"] .br-col{position:relative;z-index:2;display:flex;flex-direction:column;}
.scene-root[data-scene="bracket"] .br-col-qf{flex:0 0 25%;}
.scene-root[data-scene="bracket"] .br-col-sf{flex:0 0 25%;}
.scene-root[data-scene="bracket"] .br-col-final{flex:0 0 25%;}
.scene-root[data-scene="bracket"] .br-col-champ{flex:0 0 25%;}

.scene-root[data-scene="bracket"] .br-round{margin:0 0 18px;font-family:var(--rv-font-stat);font-weight:700;font-size:17px;letter-spacing:.24em;text-transform:uppercase;color:var(--rv-white-smoke);text-align:center;padding:9px 0;background:rgba(0,0,0,.42);box-shadow:inset 0 0 0 1px rgba(47,125,255,.32),0 6px 18px rgba(0,0,0,.45);margin-right:28px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
.scene-root[data-scene="bracket"] .br-round-gold{color:var(--rv-jet-black);background:var(--rv-gold);box-shadow:inset 0 0 0 1px rgba(241,196,15,.6),0 6px 22px rgba(241,196,15,.35);}

.scene-root[data-scene="bracket"] .br-stack{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-around;padding-right:28px;}

/* --- matchup card: two stacked rows --- */
.scene-root[data-scene="bracket"] .br-match{display:flex;flex-direction:column;gap:4px;background:linear-gradient(100deg,var(--rv-surface-1),var(--rv-jet-black));padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(241,238,238,.05);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));}

.scene-root[data-scene="bracket"] .br-row{position:relative;display:flex;align-items:center;gap:14px;height:54px;padding:0 14px;background:rgba(9,24,32,.55);border-left:5px solid var(--rv-seg-off);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));}
.scene-root[data-scene="bracket"] .br-match .br-row:nth-child(1){border-left-color:var(--rv-blue);}
.scene-root[data-scene="bracket"] .br-match .br-row:nth-child(2){border-left-color:var(--rv-orange);}

.scene-root[data-scene="bracket"] .br-seed{flex:0 0 auto;font-family:var(--rv-font-stat);font-weight:700;font-size:18px;color:var(--rv-muted);min-width:24px;text-align:center;}
.scene-root[data-scene="bracket"] .br-team{flex:1 1 auto;font-family:var(--rv-font-display);font-style:italic;font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rv-white-smoke);text-shadow:0 3px 10px rgba(0,0,0,.6);}
.scene-root[data-scene="bracket"] .br-score{flex:0 0 auto;font-family:var(--rv-font-stat);font-weight:700;font-size:24px;color:var(--rv-white-smoke);min-width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(241,238,238,.12);}

/* --- winner highlight: gold accent + Rivalry Cut emphasis --- */
.scene-root[data-scene="bracket"] .br-row.is-winner{background:linear-gradient(100deg,rgba(241,196,15,.16),rgba(9,24,32,.55) 70%);border-left-color:var(--rv-gold);box-shadow:inset 0 0 0 1px rgba(241,196,15,.45);}
.scene-root[data-scene="bracket"] .br-row.is-winner .br-team{color:var(--rv-gold);text-shadow:0 0 18px rgba(241,196,15,.4),0 3px 10px rgba(0,0,0,.6);}
.scene-root[data-scene="bracket"] .br-row.is-winner .br-seed{color:rgba(241,196,15,.8);}
.scene-root[data-scene="bracket"] .br-row.is-winner .br-score{background:var(--rv-gold);color:var(--rv-jet-black);box-shadow:0 0 16px rgba(241,196,15,.45);}

/* --- final emphasis --- */
.scene-root[data-scene="bracket"] .br-col-final .br-stack{justify-content:center;}
.scene-root[data-scene="bracket"] .br-match-final{padding:11px;box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(241,196,15,.3);}
.scene-root[data-scene="bracket"] .br-match-final .br-row{height:66px;}
.scene-root[data-scene="bracket"] .br-match-final .br-team{font-size:30px;}
.scene-root[data-scene="bracket"] .br-match-final .br-score{font-size:28px;min-width:44px;height:44px;}

/* --- champion callout --- */
.scene-root[data-scene="bracket"] .br-col-champ .br-round{margin-right:0;}
.scene-root[data-scene="bracket"] .br-champ{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:radial-gradient(120% 90% at 50% 30%,rgba(241,196,15,.16),rgba(9,24,32,.6) 70%);box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 0 0 2px rgba(241,196,15,.45);padding:26px 18px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));}
.scene-root[data-scene="bracket"] .br-champ-trophy{width:128px;height:128px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--rv-surface-2),var(--rv-jet-black));box-shadow:0 0 44px rgba(241,196,15,.4),inset 0 0 0 2px rgba(241,196,15,.55);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));animation:brChampPulse 3.4s var(--rv-ease-out) infinite;}
@keyframes brChampPulse{0%,100%{box-shadow:0 0 38px rgba(241,196,15,.34),inset 0 0 0 2px rgba(241,196,15,.5);}50%{box-shadow:0 0 58px rgba(241,196,15,.5),inset 0 0 0 2px rgba(241,196,15,.7);}}
.scene-root[data-scene="bracket"] .br-champ-mark{width:78px;height:52px;background:var(--rv-gold);filter:drop-shadow(0 0 14px rgba(241,196,15,.6));}
.scene-root[data-scene="bracket"] .br-champ-name{font-family:var(--rv-font-display);font-style:italic;font-weight:800;font-size:46px;line-height:.94;text-transform:uppercase;color:var(--rv-gold);text-shadow:0 0 30px rgba(241,196,15,.5),0 6px 18px rgba(0,0,0,.6);max-width:100%;}
.scene-root[data-scene="bracket"] .br-champ-label{font-family:var(--rv-font-stat);font-weight:700;font-size:13px;letter-spacing:.30em;text-transform:uppercase;color:var(--rv-white-smoke);padding:7px 16px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(241,196,15,.35);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root" data-scene="bracket">
<div class="br-bg"></div>
<div class="br-grid"></div>
<div class="br-lines"></div>
<div class="br-seam"></div>
<div class="br-glow"></div>

<div class="br-frame">
  <header class="br-top">
    <div class="br-brand">
      <div class="br-mark"></div>
      <span class="br-league" data-field="brand.leagueName">RIVALRY</span>
    </div>
    <div class="br-titleblock">
      <span class="br-kick" data-field="eventTitle">RIVALRY SEASON 1</span>
      <h1 class="br-title">PLAY<em>OFFS</em></h1>
      <span class="br-underbar"></span>
    </div>
  </header>

  <div class="br-board">
    <!-- connector layer sits behind the cards -->
    <svg class="br-connectors" viewBox="0 0 1824 800" preserveAspectRatio="none" aria-hidden="true">
      <!-- QF -> SF (top semi) -->
      <path class="br-line" d="M444 116 H516 V270 H588" />
      <path class="br-line" d="M444 290 H516 V270 H588" />
      <!-- QF -> SF (bottom semi) -->
      <path class="br-line" d="M444 510 H516 V530 H588" />
      <path class="br-line" d="M444 684 H516 V530 H588" />
      <!-- SF -> FINAL -->
      <path class="br-line" d="M1032 270 H1104 V400 H1176" />
      <path class="br-line" d="M1032 530 H1104 V400 H1176" />
      <!-- FINAL -> CHAMPION -->
      <path class="br-line br-line-gold" d="M1620 400 H1824" />
    </svg>

    <!-- ===================== QUARTERFINALS ===================== -->
    <section class="br-col br-col-qf">
      <h2 class="br-round" data-field="bracket.rounds.0.name">QUARTERFINALS</h2>
      <div class="br-stack">
        <div class="br-match" data-slot="bracket.rounds.0.matchups.0">
          <div class="br-row is-winner">
            <span class="br-seed">1</span>
            <span class="br-team" data-field="bracket.rounds.0.matchups.0.teamA">GUARDIANS</span>
            <span class="br-score" data-field="bracket.rounds.0.matchups.0.scoreA">3</span>
          </div>
          <div class="br-row">
            <span class="br-seed">8</span>
            <span class="br-team" data-field="bracket.rounds.0.matchups.0.teamB">DRIFT</span>
            <span class="br-score" data-field="bracket.rounds.0.matchups.0.scoreB">1</span>
          </div>
        </div>
        <div class="br-match" data-slot="bracket.rounds.0.matchups.1">
          <div class="br-row">
            <span class="br-seed">4</span>
            <span class="br-team" data-field="bracket.rounds.0.matchups.1.teamA">SENTINELS</span>
            <span class="br-score" data-field="bracket.rounds.0.matchups.1.scoreA">2</span>
          </div>
          <div class="br-row is-winner">
            <span class="br-seed">5</span>
            <span class="br-team" data-field="bracket.rounds.0.matchups.1.teamB">VOLT</span>
            <span class="br-score" data-field="bracket.rounds.0.matchups.1.scoreB">3</span>
          </div>
        </div>
        <div class="br-match" data-slot="bracket.rounds.0.matchups.2">
          <div class="br-row is-winner">
            <span class="br-seed">2</span>
            <span class="br-team" data-field="bracket.rounds.0.matchups.2.teamA">NOVA</span>
            <span class="br-score" data-field="bracket.rounds.0.matchups.2.scoreA">3</span>
          </div>
          <div class="br-row">
            <span class="br-seed">7</span>
            <span class="br-team" data-field="bracket.rounds.0.matchups.2.teamB">ZENITH</span>
            <span class="br-score" data-field="bracket.rounds.0.matchups.2.scoreB">0</span>
          </div>
        </div>
        <div class="br-match" data-slot="bracket.rounds.0.matchups.3">
          <div class="br-row">
            <span class="br-seed">3</span>
            <span class="br-team" data-field="bracket.rounds.0.matchups.3.teamA">APEX</span>
            <span class="br-score" data-field="bracket.rounds.0.matchups.3.scoreA">1</span>
          </div>
          <div class="br-row is-winner">
            <span class="br-seed">6</span>
            <span class="br-team" data-field="bracket.rounds.0.matchups.3.teamB">ECLIPSE</span>
            <span class="br-score" data-field="bracket.rounds.0.matchups.3.scoreB">3</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== SEMIFINALS ===================== -->
    <section class="br-col br-col-sf">
      <h2 class="br-round" data-field="bracket.rounds.1.name">SEMIFINALS</h2>
      <div class="br-stack">
        <div class="br-match" data-slot="bracket.rounds.1.matchups.0">
          <div class="br-row is-winner">
            <span class="br-seed">1</span>
            <span class="br-team" data-field="bracket.rounds.1.matchups.0.teamA">GUARDIANS</span>
            <span class="br-score" data-field="bracket.rounds.1.matchups.0.scoreA">3</span>
          </div>
          <div class="br-row">
            <span class="br-seed">5</span>
            <span class="br-team" data-field="bracket.rounds.1.matchups.0.teamB">VOLT</span>
            <span class="br-score" data-field="bracket.rounds.1.matchups.0.scoreB">2</span>
          </div>
        </div>
        <div class="br-match" data-slot="bracket.rounds.1.matchups.1">
          <div class="br-row">
            <span class="br-seed">2</span>
            <span class="br-team" data-field="bracket.rounds.1.matchups.1.teamA">NOVA</span>
            <span class="br-score" data-field="bracket.rounds.1.matchups.1.scoreA">1</span>
          </div>
          <div class="br-row is-winner">
            <span class="br-seed">6</span>
            <span class="br-team" data-field="bracket.rounds.1.matchups.1.teamB">ECLIPSE</span>
            <span class="br-score" data-field="bracket.rounds.1.matchups.1.scoreB">3</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== FINAL ===================== -->
    <section class="br-col br-col-final">
      <h2 class="br-round br-round-gold" data-field="bracket.rounds.2.name">FINAL</h2>
      <div class="br-stack">
        <div class="br-match br-match-final" data-slot="bracket.rounds.2.matchups.0">
          <div class="br-row is-winner">
            <span class="br-seed">1</span>
            <span class="br-team" data-field="bracket.rounds.2.matchups.0.teamA">GUARDIANS</span>
            <span class="br-score" data-field="bracket.rounds.2.matchups.0.scoreA">4</span>
          </div>
          <div class="br-row">
            <span class="br-seed">6</span>
            <span class="br-team" data-field="bracket.rounds.2.matchups.0.teamB">ECLIPSE</span>
            <span class="br-score" data-field="bracket.rounds.2.matchups.0.scoreB">2</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== CHAMPION ===================== -->
    <section class="br-col br-col-champ" data-slot="bracket.champion">
      <h2 class="br-round br-round-gold">CHAMPION</h2>
      <div class="br-champ">
        <div class="br-champ-trophy">
          <div class="br-mark br-champ-mark"></div>
        </div>
        <span class="br-champ-name" data-field="bracket.champion">GUARDIANS</span>
        <span class="br-champ-label">RIVALRY CHAMPION</span>
      </div>
    </section>
  </div>
</div>
    </div>
  </div>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-bind.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script>
(function () {
  var root = document.querySelector('.scene-root');
  var rl = RivalryOverlay.connect({ game: false });   // control-only
  RivalryBind(root, rl);                                // binds control incl. bracket.*
  RivalryFit('.rv-stage');
  rl.onControl(function () { markWinners(); });
  // Highlight the higher-scored row in each matchup (first row = teamA, second = teamB).
  function markWinners() {
    root.querySelectorAll('.br-match').forEach(function (m) {
      var rows = m.querySelectorAll('.br-row');
      if (rows.length < 2) return;
      rows.forEach(function (r) { r.classList.remove('is-winner'); });
      var sa = parseInt(((rows[0].querySelector('.br-score') || {}).textContent || ''), 10);
      var sb = parseInt(((rows[1].querySelector('.br-score') || {}).textContent || ''), 10);
      if (!isNaN(sa) && !isNaN(sb) && sa !== sb) (sa > sb ? rows[0] : rows[1]).classList.add('is-winner');
    });
  }
  markWinners();
})();
</script>
</body>
</html>
