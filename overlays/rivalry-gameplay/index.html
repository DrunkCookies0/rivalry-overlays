<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RIVALRY Overlay</title>
<!-- The Rivalry brand: self-hosted fonts + color tokens (no network at show
     time). This scene keeps its own role names below, pointed at the brand. -->
<link rel="stylesheet" href="../../assets/brand/rivalry-brand.css" />
<style>

  /* RLCS-style broadcast overlay. Transparent so it composites in OBS over
     gameplay + player webcams. Designed against a 1920x1080 canvas. */
  :root{
    /* Team sides: the game's blue and orange, as the brand's team tones.
       Thin stripes and boost fills only, never surfaces. */
    --blue:var(--rv-team-blue);
    --red:var(--rv-team-orange);
    /* Surfaces and type, pointed at The Rivalry brand (assets/brand). */
    --panel:var(--rv-coal);
    --panel-solid:var(--rv-coal);
    --bar:var(--rv-coal-raised);
    --ink:var(--rv-chalk);
    --muted:var(--rv-chalk-dim);
    --gold:var(--rv-emerald);        /* the one accent (was the old gold) */
    --seg-off:var(--rv-slate);
    --shadow:none;                    /* the brand has no shadows or glows */

    /* Old palette names kept for the rules that still use them, re-pointed. */
    --rivalry-yale-blue:var(--rv-slate);
    --rivalry-jet-black:var(--rv-coal);
    --rivalry-white-smoke:var(--rv-chalk);
    --rivalry-surface-1:var(--rv-coal-raised);
    --rivalry-surface-2:var(--rv-slate);
    --rivalry-gold:var(--rv-emerald);
    --rivalry-teal:var(--rv-emerald);
    --rivalry-green:#2ECC71;          /* status colors: still an open brand item */
    --rivalry-red:#E74C3C;

    /* Scorebar geometry — team blocks 340 + scores 64 + clock 120, ×2 for
       both sides. Used to cap the eventbar so an overlong event title can't
       stretch the .top flex container and drag the subbar wider than the
       scorebar. Update if any of those .team / .score / .clockwrap widths
       change so the eventbar cap tracks. */
    --scorebar-w: 928px;

    /* Brand font stacks: Barlow Condensed for headlines (upright caps),
       Space Mono for numbers and labels, Inter for everything else. */
    --font-display:var(--rv-font-head);
    --font-stat:var(--rv-font-mono);
    --font-body:var(--rv-font-body);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:var(--font-body);color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  .nums{font-family:var(--font-stat);font-weight:700;font-variant-numeric:tabular-nums;}
  /* Display headline utility used by every uppercase brand label. */
  .headline{font-family:var(--font-display);font-weight:700;}

  /* ====================== BROADCAST WINDOW (1:1 pixels) ======================
     RivalryFit({safeArea:true}) scales this 1920x1080 stage by 1792/1920 into
     the chrome's interior window. .win scales back up by 1920/1792 and is the
     window itself (1792x1008), so everything inside uses on-canvas pixels,
     measured from the window's top-left corner, exactly as the brand's
     decision prototype draws them. */
  .win{position:absolute;left:0;top:0;width:1792px;height:1008px;
    transform:scale(1.0714285714);transform-origin:0 0;} /* 1920 / 1792 */

  /* ============================ SCOREBUG ============================ */
  /* Coal bar on a 1px Slate edge: team blocks with a 6px team stripe on the
     outside edge and the team's tile, scores on Coal Raised, the clock on a
     Chalk block. Team color is a stripe only. */
  .top{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:940px;}
  .scorebar{display:grid;grid-template-columns:1fr 78px 160px 78px 1fr;height:66px;
    background:var(--rv-coal);border:1px solid var(--rv-slate);}
  .team{position:relative;display:flex;align-items:center;gap:12px;min-width:0;
    padding:0 18px 0 22px;overflow:hidden;}
  .team.left{--side:var(--blue);}
  .team.right{--side:var(--red);justify-content:flex-end;padding:0 22px 0 18px;}
  .team .stripe{position:absolute;top:0;bottom:0;width:6px;background:var(--side);}
  .team.left .stripe{left:0;}
  .team.right .stripe{right:0;}
  .team .name{min-width:0;font:700 32px/1 var(--font-display);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Team / player tile: the league logo first. Without one, the brand symbol
     as supplied (never recolored: brand rule) on a Coal tile whose 4px outer
     edge carries the team color, so the slot still reads as that team's.
     --side comes from the container (team block, card, banner). .r puts the
     edge on the right, for right-side placements. */
  .tile{display:inline-block;flex:none;width:42px;height:42px;box-sizing:border-box;padding:4px;
    background-color:var(--rv-coal-raised);background-position:center;background-size:contain;
    background-repeat:no-repeat;background-origin:content-box;border:1px solid var(--rv-slate);}
  .tile:not(.has-logo){padding:1px;background-image:url("../../assets/brand/logo-emerald-on-dark.svg");
    border-left:4px solid var(--side,var(--rv-slate));}
  .tile.r:not(.has-logo){border-left:1px solid var(--rv-slate);border-right:4px solid var(--side,var(--rv-slate));}

  /* GOAL flash over the scoring team's block: a solid Chalk slab wipes in from
     the score side, GOAL in Coal, then wipes on out the far side. */
  .goal-flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;overflow:hidden;background:var(--rv-chalk);
    transform:scaleX(0);transition:transform .32s cubic-bezier(.7,0,.2,1);z-index:5;}
  /* Entry origin = score side; exit origin = the far side (pass-through). */
  .team.left  .goal-flash{transform-origin:right center;}
  .team.right .goal-flash{transform-origin:left center;}
  .goal-flash.show{transform:scaleX(1);}
  .team.left  .goal-flash.exiting{transform-origin:left center;transform:scaleX(0);}
  .team.right .goal-flash.exiting{transform-origin:right center;transform:scaleX(0);}
  .goal-flash .gf-text{font:700 40px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;
    color:var(--rv-coal);opacity:0;transition:opacity .18s ease-out;}
  .goal-flash.show .gf-text{opacity:1;transition-delay:.22s;}
  .goal-flash::after{content:"";position:absolute;top:0;bottom:0;width:6px;}
  .team.left  .goal-flash::after{left:0;background:var(--blue);}
  .team.right .goal-flash::after{right:0;background:var(--red);}

  .score{display:flex;align-items:center;justify-content:center;background:var(--rv-coal-raised);
    border-left:1px solid var(--rv-slate);border-right:1px solid var(--rv-slate);
    font:700 44px/1 var(--font-stat);font-variant-numeric:tabular-nums;color:var(--rv-chalk);}
  .clockwrap{display:flex;align-items:center;justify-content:center;background:var(--rv-chalk);color:var(--rv-coal);}
  .clock{font:700 38px/1 var(--font-stat);font-variant-numeric:tabular-nums;}

  /* ===================== KICKOFF CENTER COUNTDOWN (3-2-1-GO) ============== */
  /* Mirrors RL's own kickoff countdown for broadcasts where the in-game HUD
     is hidden via Settings → Interface. Driven by CountdownBegin: 3 → 2 → 1
     each second, then GO! briefly. Each value re-mounts via key change so
     the punch-in animation restarts cleanly. */
  .kickoff-count{position:fixed;top:42%;left:50%;
    font-family:var(--font-display);font-weight:700;
    font-size:240px;line-height:1;color:#fff;
    text-shadow:0 8px 28px rgba(0,0,0,.8),0 0 24px rgba(255,255,255,.35);
    pointer-events:none;z-index:54;
    opacity:0;transform:translate(-50%,-50%) scale(.94);
    transition:opacity .4s ease-in,transform .4s ease-in;}
  .kickoff-count.show{opacity:1;transform:translate(-50%,-50%) scale(1);
    animation:kickoffPunch .5s cubic-bezier(.34,1.56,.64,1);}
  .kickoff-count.go{color:var(--gold);
    text-shadow:0 8px 28px rgba(0,0,0,.8),0 0 32px rgba(241,196,15,.85);}
  @keyframes kickoffPunch{
    0%   {opacity:0;transform:translate(-50%,-50%) scale(.4);}
    60%  {opacity:1;transform:translate(-50%,-50%) scale(1.15);}
    100% {opacity:1;transform:translate(-50%,-50%) scale(1);}
  }

  /* ===================== FINAL 10s CENTER COUNTDOWN ====================== */
  /* When ≤10s remain in regulation, a big gold number appears upper-center
     of the screen and pulses each second. Hidden during OT (the eventbar's
     OVERTIME treatment carries the urgency cue there). */
  .final10{position:fixed;top:18%;left:50%;transform:translate(-50%,-50%);
    font-family:var(--font-stat);font-weight:700;font-size:180px;line-height:1;
    color:var(--gold);font-variant-numeric:tabular-nums;
    text-shadow:0 0 28px rgba(241,196,15,.75),0 6px 18px rgba(0,0,0,.7);
    pointer-events:none;display:none;z-index:55;
    animation:final10Tick .9s ease-in-out infinite;}
  .final10.show{display:block;}
  @keyframes final10Tick{
    0%,100%{transform:translate(-50%,-50%) scale(1);
            text-shadow:0 0 22px rgba(241,196,15,.55),0 6px 18px rgba(0,0,0,.7);}
    50%    {transform:translate(-50%,-50%) scale(1.08);
            text-shadow:0 0 36px rgba(241,196,15,.95),0 6px 18px rgba(0,0,0,.7);}
  }

  /* Info row under the scorebug: game label, the series boxes, the event title. */
  .subbar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:30px;padding:0 16px;
    background:var(--rv-coal-raised);border:1px solid var(--rv-slate);border-top:0;
    font:400 12px/1 var(--font-stat);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .subbar .gameLbl,.subbar .eventbar{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .subbar .eventbar{text-align:right;}
  .subbar .eventbar b{color:var(--ink);font-weight:700;}
  /* Series boxes, RLCS style: one box per possible game. Blue fills from the
     left edge in, orange from the right edge in; the middle box is the series
     winner's, lit in their color. Outlined Dim while it is still to play. */
  .pips{display:flex;align-items:center;gap:5px;flex:none;}
  .seg{width:32px;height:14px;box-sizing:border-box;border:2px solid var(--rv-slate);}
  .seg.current{border-color:var(--muted);}
  .seg.on.blue{background:var(--blue);border-color:var(--blue);}
  .seg.on.red{background:var(--red);border-color:var(--red);}

  /* One state tab at a time, the width of the clock, dead center under it:
     KICKOFF outlined, OVERTIME solid Emerald. .fading keeps it in layout for
     the soft fade-out; JS removes .fading after the transition. */
  .state-wrap{display:flex;justify-content:center;}
  .state-strip{width:160px;height:30px;margin:8px auto 0;box-sizing:border-box;
    display:none;align-items:center;justify-content:center;
    font:700 13px/1 var(--font-stat);letter-spacing:.12em;text-transform:uppercase;
    opacity:0;transform:translateY(-6px);transition:opacity .4s ease-in,transform .4s ease-in;pointer-events:none;}
  .state-strip.show,
  .state-strip.fading{display:flex;}
  .state-strip.show{opacity:1;transform:none;}
  .state-strip.fading{opacity:0;transform:translateY(-6px);}
  .state-strip.kickoff{background:var(--rv-coal);border:1px solid var(--rv-slate);color:var(--muted);font-weight:400;}
  .state-strip.overtime{background:var(--rv-emerald);color:var(--rv-coal);}

  /* ===================== PLAYER BOARDS ====================== */
  /* Top corners of the window: a header with the team name, then one 44px row
     per player (team stripe, name, CAM tag, boost bar, boost number). The
     spectated player's row takes the Emerald tint. */
  .pb{position:absolute;top:22px;width:340px;}
  .pb.left{left:28px;}
  .pb.right{right:28px;}
  .pb.left{--side:var(--blue);}
  .pb.right{--side:var(--red);}
  .pb-h{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;box-sizing:border-box;
    background:var(--rv-coal);border:1px solid var(--rv-slate);
    font:400 12px/1 var(--font-stat);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;overflow:hidden;}
  .pb.right .pb-h{flex-direction:row-reverse;}
  .pb-h i{width:9px;height:9px;flex:none;background:var(--side);}
  .pb-h span{min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .col{display:flex;flex-direction:column;}
  .ptag{position:relative;height:44px;box-sizing:border-box;background:var(--rv-coal);
    border:1px solid var(--rv-slate);border-top:0;transition:background .2s ease-out;}
  .ptag .stripe{position:absolute;top:0;bottom:0;width:4px;background:var(--side);}
  .col.left .ptag .stripe{left:0;}
  .col.right .ptag .stripe{right:0;}
  .ptag .prow{position:absolute;inset:0;display:grid;grid-template-columns:1fr 104px 46px;
    align-items:center;gap:10px;padding:0 12px 0 16px;}
  .col.right .ptag .prow{grid-template-columns:46px 104px 1fr;padding:0 16px 0 12px;}
  .ptag .pn{display:flex;align-items:center;gap:8px;min-width:0;}
  .col.right .ptag .pn{order:3;flex-direction:row-reverse;}
  .col.right .ptag .bar{order:2;}
  .col.right .ptag .pboost{order:1;text-align:left;}
  .ptag .pname{min-width:0;font:600 17px/1 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ptag .t-cam{display:none;flex:none;font:700 10px/1 var(--font-stat);font-style:normal;letter-spacing:.12em;color:var(--rv-emerald);}
  .ptag.active{background:var(--rv-emerald-tint);}
  .ptag.active .t-cam{display:inline;}
  .ptag .bar{position:relative;height:8px;background:var(--rv-slate);transition:opacity .15s;}
  .ptag .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--side);transition:width .12s linear;}
  .col.right .ptag .fill{left:auto;right:0;}
  .ptag .pboost{font:700 18px/1 var(--font-stat);font-variant-numeric:tabular-nums;text-align:right;}
  .ptag .pboost .num{transition:opacity .15s;}

  /* ===================== STAT POPS ====================== */
  /* On a stat event the word takes over the bar + number slot of that
     player's row, revealed from the side facing the scorebug. Big plays
     (goals, epic saves, demos) in Emerald, the rest in Chalk. The goal
     scorer's word holds through the whole goal sequence (JS owns that). */
  .ptag .slot{position:absolute;top:6px;bottom:6px;right:12px;width:160px;display:flex;align-items:center;justify-content:center;
    background:var(--rv-chalk);color:var(--rv-coal);
    font:700 14px/1 var(--font-stat);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 0 0 100%);transition:clip-path .18s ease-in;}
  .col.right .ptag .slot{right:auto;left:12px;clip-path:inset(0 100% 0 0);}
  .ptag.ev-big .slot{background:var(--rv-emerald);}
  .ptag.statev .slot{clip-path:inset(0)!important;transition:clip-path .22s cubic-bezier(.2,.8,.2,1);}
  .ptag.statev .bar,.ptag.statev .pboost .num{opacity:0;}

  /* ===================== SPECTATED PLAYER CARD + BOOST ====================== */
  /* Bottom-left card (88% size) and bottom-right boost block, 28px in from the
     window's corners. While the goal sequence is in flight (banner -> replay
     -> card -> stinger -> kickoff) both fade out so they don't compete with the
     goal graphics. JS toggles body.goal-sequence-active (showGoalBanner sets
     it, clearGoalSequence clears it). */
  body.goal-sequence-active .statbar,
  body.goal-sequence-active .boostgauge{opacity:0;pointer-events:none;}
  .pc{position:absolute;left:28px;bottom:28px;width:640px;box-sizing:border-box;
    background:var(--rv-coal);border:1px solid var(--rv-slate);
    transform:scale(.88);transform-origin:0 100%;transition:opacity .22s ease-out;}
  .pc.blue{--side:var(--blue);}
  .pc.red{--side:var(--red);}
  .pc-top{position:relative;display:flex;align-items:center;gap:14px;height:66px;padding:0 18px 0 22px;
    border-bottom:1px solid var(--rv-slate);}
  .pc-top .stripe{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--side);}
  .pc-top .tile{width:46px;height:46px;font-size:15px;}
  .pc-top .nm{min-width:0;font:700 40px/1 var(--font-display);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pc-top .lab{margin-left:auto;flex:none;font:400 13px/1.2 var(--font-stat);letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  .pc-stats{display:grid;grid-template-columns:repeat(6,1fr);height:58px;}
  .pc-stats div{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 16px;
    border-left:1px solid var(--rv-slate);}
  .pc-stats div:first-child{border-left:0;}
  .pc-stats b{font:700 22px/1.1 var(--font-stat);font-variant-numeric:tabular-nums;}
  .pc-stats span{font:400 10px/1 var(--font-stat);letter-spacing:.12em;color:var(--muted);}
  .bb{position:absolute;right:28px;bottom:28px;width:300px;box-sizing:border-box;padding:12px 16px 14px;
    background:var(--rv-coal);border:1px solid var(--rv-slate);transition:opacity .22s ease-out;}
  .bb p{margin:0;}
  .bb .lab{font:400 13px/1.2 var(--font-stat);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bb-n{margin-top:4px!important;font:700 62px/1 var(--font-stat);font-variant-numeric:tabular-nums;}
  .segs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px;}
  .segs i{height:16px;box-sizing:border-box;border:2px solid var(--rv-slate);}
  .segs i.on{background:var(--rv-emerald);border-color:var(--rv-emerald);}

  /* ===================== GOAL BANNER ====================== */
  /* Positioned at y=35% center, 300px tall, fully opaque across the full
     width. This was originally chosen to physically cover RL's in-game
     "X Scored!" text (rendered around y=22-30%). RL has a "Hide In-Game
     HUD" toggle in Settings → Interface that broadcasters should enable —
     pending verification of whether it suppresses the goal celebration
     text too, this overlay coverage remains as a belt-and-suspenders
     fallback. Coexists with the top scorebar which is centered + only
     ~50% wide, so the scorebar still shows above the goal slab.
     Asset spec for the designer is in DESIGN-SPEC.md. */
  .goal-banner{position:fixed;top:35%;left:0;right:0;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60;}
  /* Layer 1: dark slate backing, taller than mid slab, wipes in first/slowest.
     Gives the team-color slab a "mounted on" feel. */
  .goal-banner .gb-back{position:absolute;left:0;right:0;top:50%;height:320px;
    transform:translateY(-50%) scaleX(0);transform-origin:left center;
    transition:transform .42s cubic-bezier(.65,0,.2,1);
    background:linear-gradient(180deg,#11161d 0%,#06080b 50%,#11161d 100%);
    box-shadow:0 0 70px rgba(0,0,0,.85);}
  /* Layer 2: team-color slab — solid base with soft ambient lighting that
     mimics RL's in-game focused-player card. Radial spotlight from top center
     gives a "light from above" feel; bottom subtly darkens for grounding.
     Inner shadow around the perimeter adds plate depth. No hatch / stripes.
     Wipes in 90ms after the backing so the layers stagger. */
  .goal-banner .gb-bg{position:absolute;left:0;right:0;top:50%;height:260px;
    transform:translateY(-50%) scaleX(0);transform-origin:left center;
    transition:transform .34s cubic-bezier(.7,0,.25,1) .09s;
    background-color:var(--goalc);
    background-image:
      radial-gradient(ellipse 70% 90% at 50% -10%,
                      rgba(255,255,255,.32) 0%,
                      rgba(255,255,255,.10) 35%,
                      rgba(255,255,255,0)   65%),
      linear-gradient(180deg,
                      rgba(255,255,255,0) 0%,
                      rgba(255,255,255,0) 55%,
                      rgba(0,0,0,.28)     100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.45),
      inset 0 -2px 0 rgba(0,0,0,.55),
      inset 0 0 80px rgba(0,0,0,.20);}
  /* Layer 3: scorer avatar — square plate with the brand "Rivalry Cut"
     diagonally clipped corners (matches RIVALRY-web's signature shape).
     Always to the left of the scorer text regardless of which team scored.
     RV logo is the placeholder; league API swaps the src later. */
  .goal-banner .gb-avatar{position:relative;flex:0 0 auto;width:140px;height:140px;
    object-fit:contain;padding:24px;
    background:rgba(0,0,0,.45);
    box-shadow:0 6px 22px rgba(0,0,0,.55);
    margin-right:28px;
    clip-path:polygon(
      0 0,
      calc(100% - 18px) 0,
      100% 18px,
      100% 100%,
      18px 100%,
      0 calc(100% - 18px));
    opacity:0;transform:translateY(14px);
    transition:opacity .28s .30s,transform .28s .30s;}
  .goal-banner.show .gb-avatar{opacity:1;transform:translateY(0);}
  /* Layer 4: scorer text + subtitle + badges — vertical stack to the right of
     the avatar. Each row fades + slides in last, sits above all layers. */
  .goal-banner .gb-stack{position:relative;display:flex;flex-direction:column;
    align-items:flex-start;gap:6px;}
  .goal-banner .gb-text{position:relative;
    font-family:var(--font-display);
    font-size:92px;font-weight:700;letter-spacing:7px;line-height:1;
    text-transform:uppercase;color:#fff;
    text-shadow:0 4px 18px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.95),
                0 2px 0 rgba(0,0,0,.6);
    opacity:0;transform:translateY(14px);
    transition:opacity .28s .30s,transform .28s .30s;white-space:nowrap;}
  /* Subtitle — the scorer's title, one line under the name. Hidden when empty.
     It comes from the panel's Player Titles (control.players[].title), which
     loading a match fills with each player's active title on therivalry.gg.
     Titles are free text (assume up to ~60 characters), so the line stays one
     row and ends in an ellipsis instead of widening the banner past the frame.
     The cap fits a ~60-character title; it is in stage pixels, since the
     banner sits in the 1920x1080 stage that RivalryFit scales to the canvas.
     The padding/negative-margin pairs give the text shadow and the italic
     overhang room inside overflow:hidden without moving the text. */
  .goal-banner .gb-sub{position:relative;
    font-family:var(--font-display);
    font-size:22px;font-weight:700;letter-spacing:4px;
    text-transform:uppercase;color:rgba(255,255,255,.85);
    text-shadow:0 2px 8px rgba(0,0,0,.65);
    max-width:1100px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:6px 12px 10px 8px;margin:-6px -12px -10px -8px;
    opacity:0;transform:translateY(8px);
    transition:opacity .28s .38s,transform .28s .38s;display:none;}
  .goal-banner.has-sub .gb-sub{display:block;}
  .goal-banner.show.has-sub .gb-sub{opacity:1;transform:translateY(0);}
  /* Badges row — up to 3 small pills (achievement / role / milestone markers).
     Hidden when empty. Typed per player in the panel's Player Titles. */
  .goal-banner .gb-badges{position:relative;display:none;flex-direction:row;gap:8px;
    opacity:0;transform:translateY(8px);
    transition:opacity .28s .46s,transform .28s .46s;}
  .goal-banner.has-badges .gb-badges{display:flex;}
  .goal-banner.show.has-badges .gb-badges{opacity:1;transform:translateY(0);}
  .goal-banner .gb-badge{font-family:var(--font-display);
    font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    padding:5px 11px;color:#fff;background:rgba(0,0,0,.55);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
  .goal-banner.show .gb-back{transform:translateY(-50%) scaleX(1);}
  .goal-banner.show .gb-bg{transform:translateY(-50%) scaleX(1);}
  .goal-banner.show .gb-text{opacity:1;transform:translateY(0);}
  /* Per-side content delays — orange (from-right) banner wipes mirror-image so
     the slab reaches the content area at a different perceived moment than
     blue. Override these independently to tune each side without affecting
     the other. Defaults match the base (blue) timing; adjust as needed. */
  .goal-banner.from-right .gb-avatar{
    transition:opacity .28s .30s,transform .28s .30s;}
  .goal-banner.from-right .gb-text{
    transition:opacity .28s .30s,transform .28s .30s;}
  .goal-banner.from-right .gb-sub{
    transition:opacity .28s .38s,transform .28s .38s;}
  .goal-banner.from-right .gb-badges{
    transition:opacity .28s .46s,transform .28s .46s;}
  /* Wipe direction follows the scoring team. Blue (left team) is the default:
     wipe in from left, exit to right. Orange (right team) gets .from-right,
     which mirrors both: wipe in from right, exit to left. The .exiting class
     swaps the active origin so the slab collapses off the screen in the
     "outgoing" direction instead of rewinding. */
  .goal-banner.exiting .gb-back,
  .goal-banner.exiting .gb-bg{transform-origin:right center;}
  .goal-banner.from-right .gb-back,
  .goal-banner.from-right .gb-bg{transform-origin:right center;}
  .goal-banner.from-right.exiting .gb-back,
  .goal-banner.from-right.exiting .gb-bg{transform-origin:left center;}
  /* On exit, the text/avatar/extras fade out FASTER than the banner layers
     so they clear before the slab wipes away. Banner layer timings are
     untouched (entry behavior preserved). */
  .goal-banner.exiting .gb-avatar,
  .goal-banner.exiting .gb-text,
  .goal-banner.exiting .gb-sub,
  .goal-banner.exiting .gb-badges{
    transition:opacity .14s ease-in,transform .14s ease-in;}

  /* ===================== STINGER WIPE (masks replay cut in/out) ============ */
  .stinger{position:fixed;inset:0;overflow:hidden;pointer-events:none;display:none;z-index:120;}
  .stinger.run{display:block;}
  .stinger .panel{position:absolute;top:-20%;height:140%;width:170%;left:-210%;transform:skewX(-12deg);}
  .stinger .panel.p1{background:var(--rivalry-yale-blue);}
  .stinger .panel.p2{background:var(--rivalry-jet-black);}
  .stinger .slogo{position:absolute;top:50%;left:50%;width:230px;height:155px;opacity:0;
    transform:translate(-50%,-50%) scale(.55);background:center/contain no-repeat;}
  .stinger.run .panel.p1{animation:stgSweep .9s cubic-bezier(.6,0,.2,1) forwards;}
  .stinger.run .panel.p2{animation:stgSweep .9s cubic-bezier(.6,0,.2,1) .06s forwards;}
  .stinger.run .slogo{animation:stgLogo .9s ease forwards;}
  @keyframes stgSweep{0%{left:-210%;}44%{left:-22%;}56%{left:-22%;}100%{left:170%;}}
  @keyframes stgLogo{0%,30%{opacity:0;transform:translate(-50%,-50%) scale(.55);}
    46%,54%{opacity:1;transform:translate(-50%,-50%) scale(1);}78%,100%{opacity:0;}}

  /* ===================== REPLAY PLAYER CARD ====================== */
  /* Sits in the bottom corner on the scorer's team side during the goal
     replay window. Shows the scorer's name + stats snapshot taken at the
     moment they scored. Subsequent cuts will add: ball-speed (cut 2),
     assist player (cut 3), avatar slot (cut 4). */
  .replay-card{position:fixed;bottom:30px;width:500px;
    background-color:var(--rpc);
    background-image:
      radial-gradient(ellipse 70% 90% at 50% -10%,
                      rgba(255,255,255,.30) 0%,
                      rgba(255,255,255,.08) 35%,
                      rgba(255,255,255,0)   65%),
      linear-gradient(180deg,
                      rgba(255,255,255,0) 0%,
                      rgba(255,255,255,0) 60%,
                      rgba(0,0,0,.30)     100%);
    box-shadow:
      0 12px 32px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.45),
      inset 0 -2px 0 rgba(0,0,0,.55);
    opacity:0;transform:translateY(40px);pointer-events:none;z-index:55;
    transition:opacity .28s ease-out,transform .34s cubic-bezier(.2,.7,.2,1);}
  .replay-card.left{left:30px;}
  .replay-card.right{right:30px;}
  .replay-card.show{opacity:1;transform:translateY(0);}
  .replay-card .rpc-header{display:flex;align-items:center;justify-content:space-between;
    padding:11px 20px;background:rgba(0,0,0,.35);
    border-bottom:1px solid rgba(0,0,0,.5);
    font-family:var(--font-display);
    font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
    color:rgba(255,255,255,.8);}
  .replay-card .rpc-speed{color:var(--gold);font-variant-numeric:tabular-nums;}
  .replay-card .rpc-speed b{font-family:var(--font-stat);font-size:16px;font-weight:700;
    color:var(--gold);margin-right:4px;}
  .replay-card .rpc-identity{display:flex;align-items:center;gap:18px;
    padding:18px 20px 8px 20px;}
  .replay-card .rpc-avatar{flex:0 0 auto;width:70px;height:70px;
    object-fit:contain;padding:12px;
    background:rgba(0,0,0,.35);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    clip-path:polygon(
      0 0,
      calc(100% - 10px) 0,
      100% 10px,
      100% 100%,
      10px 100%,
      0 calc(100% - 10px));}
  .replay-card .rpc-name{flex:1 1 auto;
    font-family:var(--font-display);
    font-size:36px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Assister line — hidden when no assist was captured in the window before
     the goal. Sits between the name and the stat grid as a thin one-liner. */
  .replay-card .rpc-assist{padding:0 20px 10px 20px;
    font-family:var(--font-display);
    font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:rgba(255,255,255,.78);display:none;}
  .replay-card .rpc-assist b{color:#fff;font-weight:700;}
  .replay-card.has-assist .rpc-assist{display:block;}
  .replay-card .rpc-stats{display:grid;grid-template-columns:repeat(5,1fr);
    gap:1px;padding:0 12px 14px 12px;}
  .replay-card .rpc-stat{display:flex;flex-direction:column;align-items:center;
    padding:9px 6px;}
  .replay-card .rpc-stat b{font-family:var(--font-stat);font-size:30px;font-weight:700;
    color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
  .replay-card .rpc-stat span{font-family:var(--font-display);
    font-size:13px;font-weight:700;letter-spacing:1px;
    color:rgba(255,255,255,.75);margin-top:5px;text-transform:uppercase;}

  #status{position:fixed;top:2px;right:4px;font-size:10px;color:var(--muted);
    font-family:monospace;opacity:.6;}
  .rv-stage{position:relative;width:1920px;height:1080px;transform-origin:center center;}
</style>
</head>
<body>
  <div class="rv-stage">
  <div id="status">connecting...</div>

  <!-- The broadcast window: everything below is laid out in on-canvas pixels. -->
  <div class="win">
  <!-- SCOREBUG -->
  <div class="top">
    <div class="scorebar">
      <div class="team left">
        <i class="stripe"></i>
        <span class="tile" id="logoA"></span>
        <span class="name" id="nameA">BLUE</span>
        <div class="goal-flash" id="goalFlashA"><span class="gf-text">GOAL</span></div>
      </div>
      <div class="score" id="scoreA">0</div>
      <div class="clockwrap"><div class="clock" id="clock">5:00</div></div>
      <div class="score" id="scoreB">0</div>
      <div class="team right">
        <span class="name" id="nameB">ORANGE</span>
        <span class="tile r" id="logoB"></span>
        <i class="stripe"></i>
        <div class="goal-flash" id="goalFlashB"><span class="gf-text">GOAL</span></div>
      </div>
    </div>
    <div class="subbar">
      <span class="gameLbl" id="gameLbl">Game 1 · Best of 5</span>
