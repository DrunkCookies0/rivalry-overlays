<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RIVALRY · Be Right Back</title>
<link rel="stylesheet" href="../shared/rivalry-theme.css" />
<link rel="stylesheet" href="../../assets/brand/rivalry-brand.css" />
<style>
/* The Rivalry brand (2026-11 rebrand). Same family as Starting Soon: the top
   band, "Be right back." with the outlined Emerald word, and the series on a
   raised card so a break still tells viewers where things stand. The chrome
   sits on top, so everything stays inside the 1792x1008 window. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
.brb{position:absolute;inset:0;overflow:hidden;background:var(--rv-coal);color:var(--rv-chalk);font-family:var(--rv-font-body);}
.brb-title{position:absolute;left:150px;top:280px;margin:0;font-size:190px;line-height:.86;}
.brb-title span{display:block;}
.brb-note{position:absolute;left:154px;top:660px;margin:0;max-width:820px;font:400 28px/1.5 var(--rv-font-body);color:var(--rv-chalk-dim);}
/* Three square markers taking turns, the only motion on the scene. */
.brb-dots{position:absolute;left:156px;top:742px;display:flex;gap:12px;}
.brb-dots i{width:14px;height:14px;background:var(--rv-emerald);opacity:.25;animation:brbDot 1.4s ease-in-out infinite;}
.brb-dots i:nth-child(2){animation-delay:.2s;}
.brb-dots i:nth-child(3){animation-delay:.4s;}
@keyframes brbDot{0%,100%{opacity:.25;}40%{opacity:1;}}

.brb-card{position:absolute;right:124px;top:292px;width:620px;background:var(--rv-coal-raised);border:1px solid var(--rv-slate);}
.brb-card .nh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px;}
.brb-card .nr{display:flex;align-items:center;gap:18px;padding:20px 24px;border-top:1px solid var(--rv-slate);}
.brb-card .nr.a{--rv-side:var(--rv-team-blue);}
.brb-card .nr.b{--rv-side:var(--rv-team-orange);}
.brb-card .rv-tile{width:72px;height:72px;}
.brb-card .nm{flex:1;min-width:0;font-size:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brb-card .wins{font:700 44px/1 var(--rv-font-mono);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root brb" data-scene="brb">
      <img class="rv-lockup" src="../../assets/brand/lockup-horizontal-emerald-on-dark.svg" alt="The Rivalry" />
      <div class="rv-tags">
        <span class="rv-tag ln" data-field="eventTitle">RIVALRY SEASON 1</span>
        <span class="rv-tag ln" data-field="round">UPPER BRACKET • ROUND 1</span>
      </div>

      <h1 class="brb-title rv-hd"><span>Be right</span><span class="rv-o">back.</span></h1>
      <p class="brb-note">Grab a drink. The action resumes in a moment.</p>
      <div class="brb-dots"><i></i><i></i><i></i></div>

      <section class="brb-card">
        <div class="nh"><span class="rv-tag em">Series</span><span class="rv-lab">Best of <span data-field="bestOf">5</span></span></div>
        <div class="nr a">
          <span class="rv-tile" id="tileA" data-bg="teamA.logo"></span>
          <span class="rv-hd nm" data-field="teamA.name">GUARDIANS</span>
          <span class="wins" data-field="series.a">1</span>
        </div>
        <div class="nr b">
          <span class="rv-tile" id="tileB" data-bg="teamB.logo"></span>
          <span class="rv-hd nm" data-field="teamB.name">SENTINELS</span>
          <span class="wins" data-field="series.b">1</span>
        </div>
      </section>
    </div>
  </div>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-bind.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script>
    // Control-only scene: subscribe to the control bus (auto-mocks on file://).
    var rl = RivalryOverlay.connect({ game: false });
    RivalryBind(document.querySelector('.scene-root'), rl);
    // Tiles: RivalryBind paints the logo; .has-logo drops the placeholder's edge.
    rl.onControl(function (c) {
      c = c || {};
      document.getElementById('tileA').classList.toggle('has-logo', !!(c.teamA && c.teamA.logo));
      document.getElementById('tileB').classList.toggle('has-logo', !!(c.teamB && c.teamB.logo));
    });
    // Resolution-independent: scale the 1920x1080 design to fill any source size.
    // Append ?fit=cover to the source URL to fill+crop instead of letterbox on non-16:9.
    RivalryFit('.rv-stage');
  </script>
</body>
</html>
