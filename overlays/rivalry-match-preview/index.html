<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RIVALRY · Match Preview</title>
<link rel="stylesheet" href="../shared/rivalry-theme.css" />
<link rel="stylesheet" href="../../assets/brand/rivalry-brand.css" />
<style>
/* The Rivalry brand (2026-11 rebrand), after the broadcast concept's match
   intro: the two teams face off from the window's edges, each with its tile,
   a team-color bar, the name, record / seed / side, and the roster from the
   loaded league match. The chrome sits on top of this scene, so everything
   stays inside the 1792x1008 window. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
.mp{position:absolute;inset:0;overflow:hidden;background:var(--rv-coal);color:var(--rv-chalk);font-family:var(--rv-font-body);}
.mp-team{position:absolute;top:250px;width:720px;display:flex;flex-direction:column;}
.mp-team.a{left:150px;align-items:flex-start;text-align:left;--rv-side:var(--rv-team-blue);animation:mpInL .5s cubic-bezier(.2,.8,.2,1) both;}
.mp-team.b{right:150px;align-items:flex-end;text-align:right;--rv-side:var(--rv-team-orange);animation:mpInR .5s cubic-bezier(.2,.8,.2,1) both;}
@keyframes mpInL{from{opacity:0;transform:translateX(-24px);}to{opacity:1;transform:none;}}
@keyframes mpInR{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:none;}}
.mp-team .rv-tile{width:220px;height:220px;padding:18px;}
.mp-team .rv-tile:not(.has-logo){padding:6px;}
.mp-bar{width:220px;height:8px;margin-top:20px;background:var(--rv-side);}
/* Up to two lines, then an ellipsis: long franchise names wrap rather than
   shrink. */
.mp-name{margin-top:28px;max-width:720px;font-size:108px;line-height:.92;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mp-meta{margin-top:22px;font:400 28px/1 var(--rv-font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--rv-chalk-dim);white-space:nowrap;}
.mp-meta i{font-style:normal;padding:0 10px;}
.mp-roster{margin-top:26px;display:flex;flex-direction:column;gap:6px;font:600 28px/1.2 var(--rv-font-body);}
.mp-vs{position:absolute;left:50%;top:470px;transform:translateX(-50%);font-size:90px;color:var(--rv-chalk-dim);}
</style>
</head>
<body>
  <div class="rv-stage">
    <div class="scene-root mp" data-scene="match-preview">
      <img class="rv-lockup" src="../../assets/brand/lockup-horizontal-emerald-on-dark.svg" alt="The Rivalry" />
      <div class="rv-tags">
        <span class="rv-tag em" id="gameTag">Game 1</span>
        <span class="rv-tag ln"><span data-field="round">UPPER BRACKET • ROUND 1</span>&nbsp;· Best of&nbsp;<span data-field="bestOf">5</span></span>
      </div>

      <section class="mp-team a">
        <span class="rv-tile" id="tileA" data-bg="teamA.logo"></span>
        <span class="mp-bar"></span>
        <div class="mp-name rv-hd" data-field="teamA.name">GUARDIANS</div>
        <div class="mp-meta" id="metaA"></div>
        <div class="mp-roster" id="rosterA"></div>
      </section>

      <div class="mp-vs rv-hd">vs</div>

      <section class="mp-team b">
        <span class="rv-tile" id="tileB" data-bg="teamB.logo"></span>
        <span class="mp-bar"></span>
        <div class="mp-name rv-hd" data-field="teamB.name">SENTINELS</div>
        <div class="mp-meta" id="metaB"></div>
        <div class="mp-roster" id="rosterB"></div>
      </section>
    </div>
  </div>
  <script src="../sdk/rivalry-overlay-sdk.js"></script>
  <script src="../sdk/rivalry-bind.js"></script>
  <script src="../sdk/rivalry-fit.js"></script>
  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    // Control-only scene: subscribe to the control bus (auto-mocks on file://).
    var rl = RivalryOverlay.connect({ game: false });
    RivalryBind(document.querySelector('.scene-root'), rl);

    // "5-2 · #1 · Blue": record and seed when the producer has them, then the side.
    function meta(el, t, side) {
      el.textContent = "";
      [t.record, t.seed, side].filter(Boolean).forEach(function (part, i) {
        if (i) el.appendChild(Object.assign(document.createElement("i"), { textContent: "·" }));
        el.appendChild(document.createTextNode(part));
      });
    }
    // The roster comes from the loaded league match (teamA.roster / teamB.roster:
    // names only). Four lines at most so a deep bench can't run into the ticker.
    function roster(el, t) {
      el.textContent = "";
      (Array.isArray(t.roster) ? t.roster : []).filter(Boolean).slice(0, 4).forEach(function (n) {
        el.appendChild(Object.assign(document.createElement("span"), { textContent: n }));
      });
    }
    rl.onControl(function (c) {
      c = c || {};
      var a = c.teamA || {}, b = c.teamB || {};
      $("tileA").classList.toggle("has-logo", !!a.logo);
      $("tileB").classList.toggle("has-logo", !!b.logo);
      meta($("metaA"), a, "Blue");
      meta($("metaB"), b, "Orange");
      roster($("rosterA"), a);
      roster($("rosterB"), b);
      // The game about to start: one past the games already won.
      var s = c.series || {};
      $("gameTag").textContent = "Game " + ((s.a | 0) + (s.b | 0) + 1);
    });
    // Resolution-independent: scale the 1920x1080 design to fill any source size.
    // Append ?fit=cover to the source URL to fill+crop instead of letterbox on non-16:9.
    RivalryFit('.rv-stage');
  })();
  </script>
</body>
</html>
