<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>RIVALRY — Combo Scene Gallery (Broadcast Bold × Energy Tech)</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Roboto:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap");
/* =============================================================================
 * RIVALRY Overlay Theme  v1
 * -----------------------------------------------------------------------------
 * Shared design tokens extracted from the live gameplay overlay so every scene
 * (Starting Soon, Match Preview, etc.) inherits one visual identity. Import this
 * in an overlay, then build on the --rv-* variables and .rv-* utilities.
 *
 *   <link rel="stylesheet" href="../shared/rivalry-theme.css" />
 *
 * Source of truth is overlay/overlay.html's :root; keep these in sync if the
 * brand palette moves.
 * ===========================================================================*/

:root {
  /* --- brand palette (synced with the league brand) --- */
  --rv-yale-blue: #20496f;
  --rv-jet-black: #132e3b;
  --rv-white-smoke: #f1eeee;
  --rv-surface-1: #1a3d4d;
  --rv-surface-2: #20496f;
  --rv-gold: #f1c40f;
  --rv-teal: #1abc9c;
  --rv-green: #2ecc71;
  --rv-red: #e74c3c;

  /* --- team accents (overridden live by control panel) --- */
  --rv-blue: #2f7dff;   /* team A */
  --rv-orange: #ff7601; /* team B */

  /* --- text --- */
  --rv-ink: var(--rv-white-smoke);
  --rv-muted: rgba(241, 238, 238, 0.65);

  /* --- surfaces --- */
  --rv-panel: rgba(19, 46, 59, 0.94);
  --rv-panel-solid: #132e3b;
  --rv-bar: #1a3d4d;
  --rv-seg-off: #475a6e;

  /* --- elevation / fx --- */
  --rv-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
  --rv-shadow-soft: 0 6px 20px rgba(0, 0, 0, 0.4);
  --rv-cut: 18px; /* "Rivalry Cut" diagonal corner size */

  /* --- type --- */
  --rv-font-display: "Exo 2", "Segoe UI", system-ui, sans-serif; /* italic 700 for headlines */
  --rv-font-stat: "Space Mono", "SF Mono", Consolas, monospace;  /* numbers, clocks, scores */
  --rv-font-body: "Roboto", "Segoe UI", system-ui, sans-serif;

  /* --- motion --- */
  --rv-ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1); /* punch-in (goals, kickoff) */
  --rv-ease-wipe: cubic-bezier(0.6, 0, 0.2, 1);        /* stinger sweep */
  --rv-ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* --- stage: every overlay is a fixed, transparent 1920x1080 canvas --- */
.rv-stage {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: transparent;
  color: var(--rv-ink);
  font-family: var(--rv-font-body);
}

/* --- type utilities --- */
.rv-display { font-family: var(--rv-font-display); font-style: italic; font-weight: 800; text-transform: uppercase; }
.rv-stat { font-family: var(--rv-font-stat); font-variant-numeric: tabular-nums; }
.rv-label { font-family: var(--rv-font-display); font-style: italic; font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; color: var(--rv-muted); }

/* --- the signature diagonal-corner clip ("Rivalry Cut") --- */
.rv-cut {
  clip-path: polygon(
    0 0,
    calc(100% - var(--rv-cut)) 0,
    100% var(--rv-cut),
    100% 100%,
    var(--rv-cut) 100%,
    0 calc(100% - var(--rv-cut))
  );
}

/* --- team color helpers: set --team to --rv-blue / --rv-orange on a wrapper --- */
.rv-teamA { --team: var(--rv-blue); }
.rv-teamB { --team: var(--rv-orange); }

/* --- a panel surface matching the scorebar language --- */
.rv-panel { background: var(--rv-panel); box-shadow: var(--rv-shadow); }
.rv-panel-grad { background: linear-gradient(180deg, var(--rv-surface-1), var(--rv-jet-black)); }

*{box-sizing:border-box;} html,body{margin:0;height:100%;background:#0a0f14;color:#dfe7ef;font-family:'Roboto',system-ui,sans-serif;}
#bar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:18px;padding:0 16px;background:#0d141b;border-bottom:1px solid rgba(255,255,255,.08);z-index:100;}
#bar .grp{display:flex;align-items:center;gap:6px;} #bar .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#67788c;margin-right:4px;}
#bar button{cursor:pointer;border:1px solid rgba(255,255,255,.12);background:#15202b;color:#cfdae6;font-size:13px;font-weight:600;padding:7px 12px;border-radius:6px;font-family:inherit;}
#bar button.on{background:var(--rv-gold);color:#10161c;border-color:var(--rv-gold);} #bar .g-dir i{font-style:normal;opacity:.6;font-size:11px;margin-left:4px;} #bar .spacer{flex:1;}
#wrap{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#11181f 0% 25%, #0c1217 0% 50%) 50%/40px 40px;overflow:hidden;}
#viewport{position:relative;} #stage{transform-origin:top left;box-shadow:0 30px 90px rgba(0,0,0,.6);}
#editor{position:fixed;top:54px;right:0;bottom:0;width:360px;background:#0d141b;border-left:1px solid rgba(255,255,255,.08);transform:translateX(100%);transition:transform .2s ease;z-index:90;overflow:auto;padding:14px 16px 40px;}
#editor.open{transform:none;} #editor h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#67788c;margin:18px 0 8px;}
#editor label{display:block;font-size:11px;color:#8aa0b6;margin:8px 0 3px;} #editor input{width:100%;padding:6px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.1);background:#0b0f14;color:#dfe7ef;font-size:12px;} #editor .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
#notes{position:fixed;left:16px;bottom:14px;max-width:60%;font-size:12px;color:#8aa0b6;z-index:95;line-height:1.4;}
.safe #stage::after{content:"";position:absolute;inset:48px;border:1px dashed rgba(255,255,255,.35);pointer-events:none;z-index:9999;}
</style></head>

const LABELS = {"anchored-energy":"Anchored Energy","fusion":"Fusion","kinetic-bold":"Kinetic Bold"};
const NOTES = {"anchored-energy":"Broadcast Bold is the spine (~70%): its composition, type scale (italic Exo 2 800 headlines, Space Mono numerics), team-color slab cards, gold-accent system, Rivalry Cut corners and heavy drop-shadows are all intact. Energy Tech shows up only as disciplined accents (~30%): (1) a single skewed, glowing GOLD SEAM at each scene's focal point (the VS divider, a headline underbar, the schedule center rail) lifted from ET's .mp-split/.ss-underbar and retuned to gold; (2) a subtle team-color EDGE GLOW on the slabs/logos (ET's outer rgba glow added on top of BB's inset rings); (3) exactly ONE tasteful animated accent per scene (seam shimmer / underbar scaleX wipe / footer pulse / VS energy halo / row glow sweep). I deliberately did NOT bring ET's full gradient field, 44px grid, or drifting scanlines, BB's own faint grid stays as understated texture only. Through-line: gold is energy, team colors anchor sides, everything skews 11-12deg toward the seam so the whole package leans into the matchup. Every scene is correct in a static frame, animations only enhance.","fusion":"A true 50/50 marriage. Every scene sits on Energy Tech's field (radial blue->jet gradient, faint 44px blue grid masked to a vignette, a slow 115deg drifting line texture, and colored corner glows) while carrying Broadcast Bold's content language (solid slabs, heavy italic Exo 2 display type, monograms, gold rationing, Space Mono numbers). The through-line is the glowing -12deg gold seam, promoted from match-preview's center split into the RECURRING STRUCTURAL SPINE on all five scenes: a bright pulsing center-spine organizes the two hero scenes (starting-soon, match-preview), a dimmer center-spine anchors the symmetric break/caster scenes, and an offset spine at the 33% gutter divides index from matchup on up-next. ET's -12deg skewed panels carry BB content everywhere: team plates, the event/round chips, caster footer chips, and the schedule rows are all skewed slabs with their inner content counter-skewed back to level for legibility. Gold discipline holds throughout (seam, eyebrows, seeds/records, the accent word of each headline, VS marks) so the energy never floods. Type scale is BB-heavy: 150px STARTING SOON, 180px monograms, 76px team names, 56-58px schedule names, with ET's teal eyebrows and skewed underbars adding motion. Signature device: the skewed gold spine + Rivalry Cut corners appear on every scene so the set reads as one family. Accent rule colors run blue->teal->orange across caster cards and schedule rows, blending BB's two-team blue/orange with ET's teal. Verified: all 5 render correctly in static 1920x1080 screenshots, ~48px safe margins, no console errors, empty data slots hide cleanly (4th up-next row, missing avatars), monograms fall back when logos are empty.","kinetic-bold":"Energy Tech's kinetic engine is the chassis (~70%): radial yale-blue to jet-black gradients, a fine 44px grid, animated diagonal motion lines, blurred color glows, skewed blue->teal->gold underbars, the Rivalry Cut clip-path on every plate/logo/badge, and bounce/wipe entrance animations. Broadcast Bold supplies the discipline (~30%): one large fixed display scale (hero headlines 120-150px, names 52-76px, a single dominant gold <em> word per scene), strict gold rationing (gold appears once as the highlight plus the seed/handle/time numerals, nothing else competes), heavier text shadows and solid panel fills for BB-level legibility, plus BB's seed treatment, RECORD micro-labels and pulse dots. Teal is demoted from ET's co-accent to a thin edge-glint inside underbars/seams only, so gold stays the lone hero color. Signature device across all five scenes: the skewed kinetic underbar + Rivalry Cut plate, and the gold-em headline. Type system is shared family-wide (Exo 2 italic 800 UPPERCASE headlines/names, Space Mono numerals, fixed sizes per role), so the set reads as one broadcast package: the most dynamic of the three, still clean from across a room with 48px safe margins. Every scene is correct in a static frame (entrances settle to full-opacity end states). Logo uses a CSS mask off rivalry-logo.svg per the brief; all color/type/easing via --rv-* tokens; selectors namespaced per scene so nothing leaks."};

const DIR_ORDER = ["anchored-energy","fusion","kinetic-bold"];
const SCENE_ORDER = ["starting-soon","brb","caster","match-preview","up-next"];
let curDir = DIR_ORDER[0], curScene = SCENE_ORDER[0];
const $ = s => document.querySelector(s); const $$ = s => Array.from(document.querySelectorAll(s));
function resolve(p){ return p.split('.').reduce((o,k)=> (o==null?undefined:o[k]), DATA); }
function bind(root){
  root.querySelectorAll('[data-field]').forEach(el=>{ const v=resolve(el.getAttribute('data-field')); el.textContent=(v==null?'':String(v)); });
  root.querySelectorAll('[data-mono]').forEach(el=>{ const v=resolve(el.getAttribute('data-mono')); el.textContent=(v?String(v).trim().charAt(0).toUpperCase():''); });
  root.querySelectorAll('[data-bg]').forEach(el=>{ const v=resolve(el.getAttribute('data-bg'));
    if(v){ el.style.backgroundImage='url("'+v+'")'; el.style.backgroundSize='contain'; el.style.backgroundPosition='center'; el.style.backgroundRepeat='no-repeat'; el.querySelectorAll('[data-mono]').forEach(m=>m.style.display='none'); }
    else { el.style.backgroundImage=''; el.querySelectorAll('[data-mono]').forEach(m=>m.style.display=''); } });
  root.querySelectorAll('[data-slot]').forEach(el=>{ const v=resolve(el.getAttribute('data-slot'));
    const empty=(v==null)||(typeof v==='object'&&Object.values(v).every(x=>!x))||(v===''); el.style.display=empty?'none':''; });
}
function render(){
  const f=(FRAG[curDir]||{})[curScene];
  $('#active-style').textContent=f?f.css:'';
  const root=$('.scene-root'); root.setAttribute('data-scene',curScene);
  root.innerHTML=f?f.html:'<div style="color:#fff;padding:40px;font:700 40px sans-serif">missing</div>';
  bind(root);
  $$('.g-dir').forEach(b=>b.classList.toggle('on',b.dataset.dir===curDir));
  $$('.g-scene').forEach(b=>b.classList.toggle('on',b.dataset.sceneid===curScene));
  $('#notes').textContent=LABELS[curDir]+' — '+(NOTES[curDir]||'').slice(0,240)+'…'; fit();
}
function fit(){ const wrap=$('#wrap'),stage=$('#stage'),vp=$('#viewport');
  const s=Math.min((wrap.clientWidth-40)/1920,(wrap.clientHeight-40)/1080);
  stage.style.transform='scale('+s+')'; vp.style.width=(1920*s)+'px'; vp.style.height=(1080*s)+'px'; }
window.addEventListener('resize',fit);
$$('.g-dir').forEach(b=>b.onclick=()=>{ curDir=b.dataset.dir; render(); });
$$('.g-scene').forEach(b=>b.onclick=()=>{ curScene=b.dataset.sceneid; render(); });
$('#safeBtn').onclick=()=>{ document.body.classList.toggle('safe'); $('#safeBtn').classList.toggle('on'); };
$('#dataBtn').onclick=()=>{ $('#editor').classList.toggle('open'); $('#dataBtn').classList.toggle('on'); };
function field(label,path){ return '<label>'+label+'</label><input data-edit="'+path+'" value="'+(resolve(path)||'')+'">'; }
function teamBlock(t,key){ return '<h3>Team '+t+'</h3>'+field('Name','match.'+key+'.name')+'<div class="two">'+field('Seed','match.'+key+'.seed')+field('Record','match.'+key+'.record')+'</div><div class="two">'+field('Tag','match.'+key+'.tag')+field('Logo URL','match.'+key+'.logo')+'</div>'; }
function casterBlock(i){ return '<h3>Caster '+(i+1)+'</h3>'+field('Name','casters.'+i+'.name')+'<div class="two">'+field('Role','casters.'+i+'.role')+field('Handle','casters.'+i+'.handle')+'</div>'+field('Avatar URL','casters.'+i+'.avatar'); }
function nextBlock(i){ return '<h3>Up Next '+(i+1)+'</h3><div class="two">'+field('Team A','upNext.'+i+'.teamA')+field('Team B','upNext.'+i+'.teamB')+'</div><div class="two">'+field('Time','upNext.'+i+'.time')+field('Round','upNext.'+i+'.round')+'</div>'; }
function buildEditor(){
  let h='<h3>Event</h3>'+field('Event title','match.eventTitle')+field('Round','match.round')+'<div class="two">'+field('Best of','match.bestOf')+field('Start time','match.startTime')+'</div>';
  h+=teamBlock('A','teamA')+teamBlock('B','teamB'); h+=DATA.casters.map((c,i)=>casterBlock(i)).join(''); h+=DATA.upNext.map((c,i)=>nextBlock(i)).join('');
  $('#editor').innerHTML=h;
  $$('#editor input[data-edit]').forEach(inp=>{ inp.addEventListener('input',()=>{ const p=inp.getAttribute('data-edit').split('.'); let o=DATA; for(let k=0;k<p.length-1;k++) o=o[p[k]]; o[p[p.length-1]]=inp.value; bind($('.scene-root')); }); });
}
buildEditor(); render();
</script>
