name: Release

on:
  push:
    tags:
      # Exact semver only. A bare 'v*' also matches beta-shaped tags
      # (v0.6.12-beta.N) that pr-build.yml creates and force-pushes; that was
      # only safe because GITHUB_TOKEN pushes don't trigger workflows, and a
      # human re-pushing a beta tag would have fired a production release.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # needed for electron-builder to create/upload the release

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      # Never publish a production installer that fails its own proof gate.
      - name: Run unit tests
        run: npm test
      - name: Build and publish Windows installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the built package.json so the tray + control panel
          # show "v0.2.2 (a3b9c1d)" instead of "v0.2.2 (dev)".
          BUILD_SHA: ${{ github.sha }}
