name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed for electron-builder to create/upload the release

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build and publish Windows installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the built package.json so the tray + control panel
          # show "v0.2.2 (a3b9c1d)" instead of "v0.2.2 (dev)".
          BUILD_SHA: ${{ github.sha }}
