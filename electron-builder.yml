# =============================================================================
# Production build config (Squirrel.Windows target).
#
# Why Squirrel and not NSIS:
#   - No installer dialog. The Setup.exe runs silently into %LocalAppData%.
#   - Truly background updates: electron-updater downloads a small .nupkg
#     delta, swaps app files in place, next launch is the new version. No
#     "quit and install" wizard, no UAC prompt, no install-time UI flash.
#   - Per-user install (no admin). Makes update silent + safe to ship to
#     casters who don't have local admin rights.
#   - Differential .nupkg packages keep update downloads tiny.
#
# Trade-offs:
#   - Install path is %LocalAppData%\RIVALRYOverlay\app-<version>\ instead
#     of "Program Files". This is normal for Squirrel apps (Discord, Slack,
#     VS Code, GitHub Desktop, Atom all use it).
#   - One-time migration for anyone on an older NSIS install: uninstall
#     the NSIS one first, then run the new Setup.exe.
#
# Tag-push -> .github/workflows/release.yml uses this. Mirrored (with
# overrides) by electron-builder.beta.js for the beta channel.
# =============================================================================
appId: gg.rivalry.overlay
productName: RIVALRY Overlay
directories:
  output: dist
files:
  - main.js
  - bridge/**/*
  - overlay/**/*
  - control/**/*
  - config/**/*
  - assets/**/*
win:
  target:
    - squirrel
  icon: build/icon.ico
squirrelWindows:
  # Squirrel requires the icon as a hosted URL (it embeds it in the
  # Setup.exe + uninstall entry). Repo is public, so the raw GitHub URL
  # works. If the repo ever flips private, host this somewhere else.
  iconUrl: https://raw.githubusercontent.com/DrunkCookies0/rivalry-overlays/main/build/icon.ico
  msi: false
publish:
  - provider: github
    owner: DrunkCookies0
    repo: rivalry-overlays
    releaseType: release
